<!doctype html>
<!-- split-screen demo: maplibre gl slippy map on the left, the earth renderer on
     an ordinary canvas on the right, two-way synced. tiles are cached in
     indexeddb via the js fetch hook.

     serve this directory and open /demo.html, e.g.:
       ./build.sh weblib && python3 -m http.server -d web 8000
     coi-serviceworker injects the cross-origin-isolation headers the pthread
     build needs (expect one automatic reload on first visit). -->
<meta charset="utf-8">
<title>earth split-screen demo</title>
<script>window.coi = { coepCredentialless: () => true };</script>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; }
  #map, #right { flex: 1; height: 100%; }
  #right { position: relative; }
  #globe { width: 100%; height: 100%; display: block; outline: none; }
  /* pick debug: reticle at the exact screen center of the 3d view (what the
     center raycast should be looking through) plus a readout of the hit */
  #cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
           pointer-events: none; z-index: 5; }
  #pickinfo { position: absolute; right: 8px; bottom: 8px; z-index: 10; color: #fff;
              background: rgba(0,0,0,.55); font: 12px monospace; padding: 6px 8px;
              border-radius: 4px; pointer-events: none; }
  #tubeinfo { position: absolute; left: 8px; bottom: 8px; z-index: 10; color: #fff;
              background: rgba(0,0,0,.55); font: 12px monospace; padding: 6px 8px;
              border-radius: 4px; pointer-events: none; display: none; }
  /* top-right hud: controls hint and speed readout as separate boxes, each
     hugging its own content */
  #hud { position: fixed; right: 8px; top: 8px; z-index: 10; display: flex;
         flex-direction: column; align-items: flex-end; gap: 4px; }
  #hint, #speed { color: #fff; background: rgba(0,0,0,.55); font: 12px sans-serif;
                  padding: 6px 8px; border-radius: 4px; }
  /* tube axis switch, over the map's bottom-left corner */
  #axisbtn { position: fixed; left: 8px; bottom: 24px; z-index: 10; color: #fff;
             background: rgba(0,0,0,.55); font: 12px sans-serif; padding: 6px 8px;
             border-radius: 4px; cursor: pointer; user-select: none; }
</style>
<div id="map"></div>
<div id="right"><canvas id="globe" tabindex="0"></canvas>
  <svg id="cross" width="33" height="33" viewBox="-16 -16 32 32">
    <g stroke="#000" stroke-width="3.5" fill="none" opacity=".6">
      <circle r="8"/><path d="M0,-14 V-5 M0,5 V14 M-14,0 H-5 M5,0 H14"/>
    </g>
    <g stroke="#ff7f0e" stroke-width="1.5" fill="none">
      <circle r="8"/><path d="M0,-14 V-5 M0,5 V14 M-14,0 H-5 M5,0 H14"/>
    </g>
  </svg>
  <div id="pickinfo"></div>
  <div id="tubeinfo"></div>
</div>
<div id="hud"><div id="hint"></div><div id="speed"></div></div>
<div id="axisbtn"></div>
<script>
  // per-mode control hints; the active one is set by updateHint() below
  const HINTS = {
    persp: 'WASD move · R/F up/down · hold space: view-frame · arrows/drag look · ' +
      'Z/X zoom · shift slow · O ortho · C pick debug · L lod debug · click map to teleport · ' +
      '⇧drag map: tube rect',
    ortho: 'WASD/drag pan · arrows orbit around center · wheel/Z/X/R/F zoom · ' +
      'shift slow · O perspective · C pick debug · L lod debug · click map to teleport · ' +
      '⇧drag map: tube rect',
    tube: 'airplane controls — W/S thrust · A/D strafe · R/F up/down · arrows/drag pitch+yaw · Q/E roll · ' +
      'Z/X zoom · shift slow · T unroll · esc clear tube · ⇧drag map: new rect',
  };
  document.getElementById('hint').textContent = HINTS.persp;
  document.getElementById('speed').textContent = '-/= speed x1';
</script>
<script src="earth.js"></script>
<script>
(async () => {
  // --- indexeddb byte cache -------------------------------------------------
  const db = await new Promise((res, rej) => {
    const r = indexedDB.open('earth-cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tiles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const idbGet = (key) => new Promise((res) => {
    const t = db.transaction('tiles').objectStore('tiles').get(key);
    t.onsuccess = () => res(t.result);
    t.onerror = () => res(undefined);
  });
  const idbPut = (key, bytes) => {
    try { db.transaction('tiles', 'readwrite').objectStore('tiles').put(bytes, key); } catch (e) {}
  };

  // --- module + view --------------------------------------------------------
  const Module = await createEarthModule();

  // the fetch hook: the renderer asks for a path, we answer with bytes.
  // planetoid metadata ('P...') is not cached, matching the native client
  const stats = window.__stats = {
    issued: 0, delivered: 0, failed: 0, inflight: 0,
    idbHits: 0, netHits: 0, maxMs: 0, log: [],
  };
  const fetchTile = async (path, id) => {
    const t0 = performance.now();
    stats.issued++;
    stats.inflight++;
    try {
      let bytes = path[0] !== 'P' ? await idbGet(path) : undefined;
      if (bytes) stats.idbHits++;
      if (!bytes) {
        const resp = await fetch('https://kh.google.com/rt/earth/' + path);
        if (!resp.ok) throw new Error('http ' + resp.status);
        bytes = new Uint8Array(await resp.arrayBuffer());
        stats.netHits++;
        if (path[0] !== 'P') idbPut(path, bytes);
      }
      stats.delivered++;
      Module.deliverFetch(id, true, bytes);
    } catch (e) {
      stats.failed++;
      stats.log.push(path + ' -> ' + e.message);
      Module.deliverFetch(id, false, null);
    } finally {
      stats.inflight--;
      stats.maxMs = Math.max(stats.maxMs, performance.now() - t0);
    }
  };

  const canvas = document.getElementById('globe');
  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
  };
  resize();
  addEventListener('resize', resize);

  if (new URLSearchParams(location.search).has('jpg')) Module.forceJpgTextures();
  const view = Module.createView('#globe', fetchTile);

  // view state (camera pose, fov, speed gain, map zoom) persists in
  // localstorage so a reload puts you back where you were
  // the seattle skyline from out on elliott bay
  const DEFAULT_VIEW = { lat: 47.5980, lon: -122.3750, alt: 800, heading: 65, tilt: -12, fov: 45, zoom: 12, gain: 1, ortho: false, tube: null };
  const START = (() => {
    try {
      const v = JSON.parse(localStorage.getItem('earth-view'));
      if (v && Number.isFinite(v.lat) && Number.isFinite(v.lon) && Number.isFinite(v.alt))
        return { ...DEFAULT_VIEW, ...v };
    } catch (e) {}
    return DEFAULT_VIEW;
  })();
  const saveView = () => {
    if (!view.ready()) return;
    const p = view.getPose();
    try {
      localStorage.setItem('earth-view', JSON.stringify({
        lat: p.lat, lon: p.lon, alt: p.alt, heading: p.heading, tilt: p.tilt,
        roll: p.roll, fov: p.fov, zoom: map.getZoom(), gain, ortho,
        tube: tubeRect ? { rect: tubeRect, on: tubeOn, ewAxis: tubeAxisEw } : null,
      }));
    } catch (e) {}
  };
  addEventListener('beforeunload', saveView);

  // --- maplibre -------------------------------------------------------------
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [START.lon, START.lat],
    zoom: START.zoom,
    dragRotate: false, // keep the map north-up
    pitchWithRotate: false,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disable(); // arrows belong to the flight canvas
  // camera marker: a dot with a view cone that rotates with the heading.
  // pointer-events none so clicks pass through to the map (teleport)
  const markerEl = document.createElement('div');
  markerEl.style.pointerEvents = 'none';
  markerEl.innerHTML =
    '<svg id="camIcon" width="44" height="44" viewBox="-22 -22 44 44" style="display:block">' +
    '<path d="M0,-3 L-13,-19 A21,21 0 0 1 13,-19 Z" fill="rgba(66,133,244,.4)"/>' +
    '<circle r="5.5" fill="#4285f4" stroke="#fff" stroke-width="2.5"/></svg>';
  const marker = new maplibregl.Marker({ element: markerEl })
    .setLngLat([START.lon, START.lat]).addTo(map);
  const setMarkerHeading = (deg) => {
    const el = document.getElementById('camIcon');
    if (el) el.style.transform = `rotate(${deg}deg)`;
  };

  // pick debug (C to toggle): a reticle at the exact center of the 3d view,
  // an orange dot on the map at what the center raycast hit (the orbit
  // pivot), and a readout of the hit distance/altitude and whether it came
  // from terrain triangles or the sea-level sphere fallback. if the orbit
  // pivot looks wrong on screen, the orange dot shows where it actually is
  let pickDebug = false;
  const pickEl = document.createElement('div');
  pickEl.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#ff7f0e;' +
    'border:2.5px solid #fff;pointer-events:none;';
  const pickMarker = new maplibregl.Marker({ element: pickEl });
  let pickMarkerOn = false;
  const setPickDebug = (on) => {
    pickDebug = on;
    document.getElementById('cross').style.display = on ? '' : 'none';
    document.getElementById('pickinfo').style.display = on ? '' : 'none';
    if (!on && pickMarkerOn) { pickMarker.remove(); pickMarkerOn = false; }
  };
  const updatePickDebug = () => {
    const pick = view.pickCenter();
    if (pick) {
      // position before addTo: a marker on the map without a position throws
      // from maplibre's own update events (e.g. when the style loads)
      pickMarker.setLngLat([pick.lon, pick.lat]);
      if (!pickMarkerOn) { pickMarker.addTo(map); pickMarkerOn = true; }
      document.getElementById('pickinfo').textContent =
        `pick: ${pick.src} · dist ${Math.round(pick.dist)}m · alt ${Math.round(pick.alt)}m`;
    } else {
      if (pickMarkerOn) { pickMarker.remove(); pickMarkerOn = false; }
      document.getElementById('pickinfo').textContent = 'pick: miss';
    }
  };
  setPickDebug(pickDebug);

  // --- input on the canvas -> built-in flying controls ----------------------
  // ground frame: WASD cruise/truck, Q/E pedestal. hold Space for the view
  // frame: W/S dolly along the view, Q/E boom along view-up. arrows pan/tilt
  // so no mouse is needed. Z/X zoom (fov). -/= sticky speed gain. shift slow
  const keys = {};
  const handled = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyR','KeyF','KeyZ','KeyX','KeyO','KeyC','KeyL','KeyT',
    'Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Minus','Equal']);
  let gain = 1; // re-initialized from the saved view once it loads
  let ortho = false;
  let debugLod = false;
  const updateHint = () => {
    document.getElementById('hint').textContent =
      HINTS[tubeOn ? 'tube' : ortho ? 'ortho' : 'persp']
      // T only does anything once a rect exists
      + (!tubeOn && tubeRect ? ' · T roll tube · esc clear' : '');
    document.getElementById('speed').textContent =
      `-/= speed x${gain >= 1 ? gain : '1/' + (1/gain)}`;
  };
  canvas.addEventListener('keydown', (e) => {
    // browser/os shortcuts (cmd-R reload etc.) pass through untouched
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (handled.has(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Minus' && !e.repeat) { gain = Math.max(1/16, gain/2); updateHint(); }
    if (e.code === 'Equal' && !e.repeat) { gain = Math.min(16, gain*2); updateHint(); }
    if (e.code === 'KeyO' && !e.repeat) { ortho = !ortho; view.setOrtho(ortho); updateHint(); }
    if (e.code === 'KeyC' && !e.repeat) setPickDebug(!pickDebug);
    // like the native app's L key: tint octants red where a finer tile is
    // wanted but not yet downloaded
    if (e.code === 'KeyL' && !e.repeat) { debugLod = !debugLod; view.setDebugLod(debugLod); }
    // roll/unroll the tube for the current rect (drawn by shift+drag on the
    // map). rolling up also flies into the tube mouth — watching the roll
    // from outside mostly shows the back of the sheet
    // clear the tube entirely: unroll, drop the rect, back to normal flight
    if (e.code === 'Escape' && tubeRect) {
      tubeRect = null;
      tubeOn = false;
      tubePending = null;
      view.setTubeEnabled(false);
      view.setAirplane(false);
      setRectData(null);
      updateHint();
    }
    if (e.code === 'KeyT' && !e.repeat && tubeRect) {
      tubeOn = !tubeOn;
      view.setTubeEnabled(tubeOn);
      view.setAirplane(tubeOn); // tube flying is airplane-frame
      if (tubeOn) {
        curl = 0;
        view.setTubeCurl(0);
        tubePending = 'fly'; // rolls (and flies in) once the rect is loaded
        tubePendingSince = performance.now();
      } else {
        tubePending = null;
      }
      updateHint();
    }
  });
  canvas.addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  let dragging = false, yaw = 0, pitch = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    canvas.focus();
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // grab-the-world: in perspective, dragging pulls the scene with the
    // pointer by looking around; in ortho it pans instead (WASD-equivalent
    // camera translation, so the ground follows the pointer)
    if (ortho) {
      view.panOrtho(e.movementX, e.movementY, canvas.clientHeight);
      return;
    }
    yaw -= e.movementX * 0.003;
    pitch += e.movementY * 0.003;
  });
  // scroll on the 3d view zooms by narrowing/widening the fov, like the
  // native app (which uses fov *= 0.9^wheel; setFov clamps to 1..100 deg)
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    // in ortho, zooming is a dolly (elevation is not a real degree of
    // freedom there); in perspective it narrows the fov like the native app
    if (ortho) { view.zoomOrtho(Math.pow(0.9, e.deltaY / 100)); return; }
    const p = view.getPose();
    view.setFov(p.fov * Math.pow(0.9, -e.deltaY / 100));
  }, { passive: false });

  // --- sync -----------------------------------------------------------------
  // the marker always shows where the camera is. the map is a free viewport:
  // dragging it never touches the camera; clicking it teleports the camera
  // there. while flying, the map follows the marker (smoothly easing over
  // when follow mode re-engages); grabbing the map stops the following
  let following = true;
  let posed = false;

  // while the pointer is down on the map, pause follow updates entirely:
  // the per-frame jumpTo would cancel maplibre's drag gesture mid-flight
  // (the aborted drag then even lands as a click -> surprise teleport)
  let mapPointerDown = false;
  const mapEl = document.getElementById('map');
  mapEl.addEventListener('pointerdown', () => { mapPointerDown = true; });
  addEventListener('pointerup', () => { mapPointerDown = false; });

  // the standard geolocate control (crosshair button); its geolocate event
  // teleports the camera like a map click, keeping altitude/heading/tilt.
  // the control's own flyTo is immediately overridden by follow mode's
  // per-frame jumpTo, which brings the map along instead
  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000 },
    trackUserLocation: false,
  });
  map.addControl(geolocate, 'top-left');
  geolocate.on('geolocate', (pos) => {
    if (!view.ready()) return;
    const p = view.getPose();
    view.setPose(pos.coords.latitude, pos.coords.longitude, p.alt, p.heading, p.tilt);
    following = true;
  });

  map.on('dragstart', () => { following = false; });
  map.on('click', (e) => {
    if (!view.ready()) return;
    if (e.originalEvent.shiftKey) return; // shift belongs to rect drawing
    const p = view.getPose();
    view.setPose(e.lngLat.lat, e.lngLat.lng, p.alt, p.heading, p.tilt);
  });

  // --- tube mode ------------------------------------------------------------
  // shift+drag on the map draws a rectangle; that slab of territory is rolled
  // into a tube (the inception effect) and the camera teleports to one end of
  // the tube axis, looking down it. T rolls/unrolls; drawing a new rect
  // replaces the old one. the roll animates via curl (0 flat .. 1 closed)
  let tubeRect = null; // [latMin, lonMin, latMax, lonMax] degrees
  let tubeOn = false;
  let curl = 0;
  const curlTarget = 1;
  // staged pipeline: the sheet stays flat while the rect's tiles load at
  // full res; once the scene is complete the engine measures ground level
  // off the mesh, and only then does the roll (and camera fly-in) happen.
  // 'fly' also teleports into the tube mouth; 'roll' just rolls in place
  let tubePending = null; // null | 'fly' | 'roll'
  let tubePendingSince = 0;
  // which way the tube axis runs; the rolled-up (glued) edges are the two
  // edges parallel to it. toggled by the #axisbtn switch
  let tubeAxisEw = true;
  const normRect = (a, b) => [Math.min(a.lat, b.lat), Math.min(a.lng, b.lng),
    Math.max(a.lat, b.lat), Math.max(a.lng, b.lng)];
  // the rect plus topology-diagram arrows on the two glued edges (the ones
  // that meet at the overhead seam), same direction on both — the cylinder
  // identification, the way quotient-space diagrams mark it
  const rectFC = (r) => {
    if (!r) return { type: 'FeatureCollection', features: [] };
    const feats = [{ type: 'Feature', properties: { kind: 'rect' },
      geometry: { type: 'Polygon', coordinates: [[
        [r[1], r[0]], [r[3], r[0]], [r[3], r[2]], [r[1], r[2]], [r[1], r[0]],
      ]] } }];
    const latc = (r[0] + r[2]) / 2, lonc = (r[1] + r[3]) / 2;
    const cosLat = Math.cos(latc * Math.PI / 180);
    const tri = (pts) => feats.push({ type: 'Feature', properties: { kind: 'arrow' },
      geometry: { type: 'Polygon', coordinates: [pts.concat([pts[0]])] } });
    if (tubeAxisEw) {
      // glued edges run east-west; both arrows point east
      const s = 0.09 * (r[3] - r[1]); // arrow half-length, degrees lon
      const h = 0.55 * s * cosLat; // half-height in degrees lat (same meters)
      for (const lat of [r[0], r[2]])
        tri([[lonc + s, lat], [lonc - 0.6 * s, lat + h], [lonc - 0.6 * s, lat - h]]);
    } else {
      // glued edges run north-south; both arrows point north
      const s = 0.09 * (r[2] - r[0]);
      const h = 0.55 * s / cosLat;
      for (const lon of [r[1], r[3]])
        tri([[lon, latc + s], [lon + h, latc - 0.6 * s], [lon - h, latc - 0.6 * s]]);
    }
    return { type: 'FeatureCollection', features: feats };
  };
  const setRectData = (r) => {
    const src = map.getSource('tube-rect');
    if (src) src.setData(rectFC(r));
  };
  map.on('load', () => {
    map.addSource('tube-rect', { type: 'geojson', data: rectFC(null) });
    map.addLayer({ id: 'tube-rect-fill', type: 'fill', source: 'tube-rect',
      filter: ['==', ['get', 'kind'], 'rect'],
      paint: { 'fill-color': '#ff7f0e', 'fill-opacity': 0.12 } });
    map.addLayer({ id: 'tube-rect-line', type: 'line', source: 'tube-rect',
      filter: ['==', ['get', 'kind'], 'rect'],
      paint: { 'line-color': '#ff7f0e', 'line-width': 2 } });
    map.addLayer({ id: 'tube-rect-arrows', type: 'fill', source: 'tube-rect',
      filter: ['==', ['get', 'kind'], 'arrow'],
      paint: { 'fill-color': '#ff7f0e', 'fill-opacity': 0.9 } });
    setRectData(tubeRect);
  });
  const axisBtn = document.getElementById('axisbtn');
  const updateAxisBtn = () => {
    axisBtn.textContent = `tube axis: ${tubeAxisEw ? 'E–W' : 'N–S'} (click to flip)`;
  };
  updateAxisBtn();
  axisBtn.addEventListener('click', () => {
    tubeAxisEw = !tubeAxisEw;
    updateAxisBtn();
    if (tubeRect) {
      setRectData(tubeRect); // arrows move to the other edge pair
      if (tubeOn) applyTube(tubeRect, true); // re-roll around the new axis
      else view.setTubeRect(tubeRect[0], tubeRect[1], tubeRect[2], tubeRect[3], tubeAxisEw);
    }
  });
  // fly to the near end of the tube axis: the axis runs along the rect's
  // longer dimension at height = tube radius, so spawning at (end, radius)
  // heading along the axis puts you dead center in the pipe, looking down it
  const flyIntoTube = (r) => {
    const latc = (r[0] + r[2]) / 2, lonc = (r[1] + r[3]) / 2;
    const ew = tubeAxisEw;
    // on the tube axis (ground + radius), a step in from the mouth
    const info = view.getTubeInfo();
    const alt = info.groundAlt + Math.max(20, info.radius);
    const inset = 0.05;
    view.setPose(
      ew ? latc : r[0] + inset * (r[2] - r[0]),
      ew ? r[1] + inset * (r[3] - r[1]) : lonc,
      alt, ew ? 90 : 0, -5);
    following = true;
  };
  const applyTube = (r, teleport) => {
    view.setTubeRect(r[0], r[1], r[2], r[3], tubeAxisEw);
    tubeOn = true;
    view.setTubeEnabled(true);
    view.setAirplane(true); // tube flying is airplane-frame
    curl = 0; // flat while the rect loads; the tick rolls it when ready
    view.setTubeCurl(0);
    tubePending = teleport ? 'fly' : 'roll';
    tubePendingSince = performance.now();
    updateHint();
  };
  map.boxZoom.disable(); // shift+drag draws the tube rect instead
  let drawAnchor = null;
  map.on('mousedown', (e) => {
    if (!e.originalEvent.shiftKey) return;
    e.preventDefault(); // keep dragPan out of the gesture
    drawAnchor = e.lngLat;
  });
  map.on('mousemove', (e) => {
    if (drawAnchor) setRectData(normRect(drawAnchor, e.lngLat));
  });
  map.on('mouseup', (e) => {
    if (!drawAnchor) return;
    const r = normRect(drawAnchor, e.lngLat);
    drawAnchor = null;
    // an accidental shift-click, not a rect (under ~30 m each way)
    if (r[2] - r[0] < 3e-4 && r[3] - r[1] < 3e-4) { setRectData(tubeRect); return; }
    tubeRect = r;
    setRectData(r);
    if (view.ready()) applyTube(r, true);
  });

  // locked-mode wheel zoom: handle it ourselves with an unanimated setZoom,
  // which zooms around the center — where the follow keeps the marker — so
  // it can't fight the per-frame follow updates. free mode gets maplibre's
  // native pointer-anchored zoom
  document.getElementById('map').addEventListener('wheel', (e) => {
    if (!following) return;
    e.preventDefault();
    e.stopPropagation();
    map.setZoom(map.getZoom() - e.deltaY * 0.005);
  }, { capture: true, passive: false });

  // per-frame exponential ease of the map center toward the marker: smooth
  // when follow mode re-engages far away, and tight tracking during flight.
  // no built-in map animations — they lock the map for their whole duration,
  // which falls apart when the camera covers a large distance every frame.
  // an exponential ease chasing a moving target always lags it by
  // velocity*tau, so aim at the marker's position led by its (smoothed)
  // velocity — steady fast flight then keeps the marker dead-center
  const FOLLOW_TAU_MS = 120;
  let followVel = null, prevMark = null;
  const followMarker = (latlng, dt) => {
    if (prevMark && dt > 0) {
      const dlat = latlng.lat - prevMark.lat;
      const dlng = latlng.lng - prevMark.lng;
      if (Math.abs(dlat) > 0.05 || Math.abs(dlng) > 0.05) {
        followVel = null; // teleport, not motion: don't feed it forward
      } else {
        const a = 1 - Math.exp(-dt / 200);
        followVel = followVel ? {
          lat: followVel.lat + (dlat / dt - followVel.lat) * a,
          lng: followVel.lng + (dlng / dt - followVel.lng) * a,
        } : { lat: dlat / dt, lng: dlng / dt };
      }
    }
    prevMark = latlng;
    const lead = followVel
      ? { lat: followVel.lat * FOLLOW_TAU_MS, lng: followVel.lng * FOLLOW_TAU_MS }
      : { lat: 0, lng: 0 };
    const c = map.getCenter();
    const k = 1 - Math.exp(-dt / FOLLOW_TAU_MS);
    let nlat = c.lat + (latlng.lat + lead.lat - c.lat) * k;
    let nlng = c.lng + (latlng.lng + lead.lng - c.lng) * k;
    // monotonicity: the lead aims ahead of the marker, and when the camera
    // slows it goes stale for a moment — never let the center actually pass
    // the marker, or stopping visibly springs back. if this step would cross
    // it, land exactly on it
    if ((latlng.lat - c.lat) * (latlng.lat - nlat)
      + (latlng.lng - c.lng) * (latlng.lng - nlng) < 0) {
      nlat = latlng.lat;
      nlng = latlng.lng;
    }
    map.jumpTo({ center: [nlng, nlat] });
  };

  // for devtools poking and automated testing
  window.__demo = { view, map, marker, isFollowing: () => following,
    tube: () => ({ rect: tubeRect, on: tubeOn, curl }) };

  let lastSynced = { lat: 1e9, lon: 1e9 };
  let saveTimer = 0;
  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(100, now - last);
    last = now;

    if (view.ready() && !posed) {
      // once the planet metadata is in, jump to the start (or saved) pose
      posed = true;
      view.setPose(START.lat, START.lon, START.alt, START.heading, START.tilt);
      view.setFov(START.fov);
      gain = START.gain;
      ortho = !!START.ortho;
      view.setOrtho(ortho);
      // restore a saved tube rect; if it was rolled, it rolls up again from
      // flat (the camera pose is already wherever it was saved)
      if (START.tube && START.tube.rect) {
        tubeRect = START.tube.rect;
        tubeAxisEw = START.tube.ewAxis !== false;
        updateAxisBtn();
        setRectData(tubeRect);
        if (START.tube.on) {
          applyTube(tubeRect, false); // reload + roll in place at the saved pose
          if (START.roll) view.setRoll(START.roll); // restore the bank angle
        } else {
          view.setTubeRect(tubeRect[0], tubeRect[1], tubeRect[2], tubeRect[3], tubeAxisEw);
        }
      }
      updateHint();
    }

    const slow = !!(keys.ShiftLeft || keys.ShiftRight);
    // arrows pan/tilt at fixed angular rates (rad/s), shift-slowed. in
    // ortho mode all four arrows instead orbit around whatever is at the
    // center of the screen (raycast into the scene on the wasm side):
    // left/right around its up axis, up/down in tilt
    const rot = (slow ? 0.1 : 1) * dt / 1000;
    const orbitH = ortho ? ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) : 0;
    const orbitV = ortho ? ((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0)) : 0;
    if ((orbitH || orbitV) && view.ready()) view.orbit(orbitH * 45 * rot, orbitV * 34 * rot); // deg
    if (!ortho && keys.ArrowRight) yaw += 1.2 * rot;
    if (!ortho && keys.ArrowLeft) yaw -= 1.2 * rot;
    if (!ortho && keys.ArrowUp) pitch += 0.9 * rot;
    if (!ortho && keys.ArrowDown) pitch -= 0.9 * rot;
    // z/x zoom like the wheel; in ortho E/Q join them as zoom too, since a
    // parallel projection has no meaningful elevation to pedestal along
    if (!!keys.KeyZ !== !!keys.KeyX) {
      if (ortho) {
        view.zoomOrtho(Math.pow(0.9, (dt / 150) * (keys.KeyZ ? 1 : -1)));
      } else {
        const p = view.getPose();
        view.setFov(p.fov * Math.pow(0.9, (dt / 150) * (keys.KeyZ ? -1 : 1)));
      }
    }
    if (ortho && !!keys.KeyR !== !!keys.KeyF) {
      view.zoomOrtho(Math.pow(0.9, (dt / 150) * (keys.KeyR ? 1 : -1))); // R out, F in
    }

    const flying = dragging || yaw !== 0 || pitch !== 0 || orbitH !== 0 || orbitV !== 0
      || keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD || keys.KeyQ || keys.KeyE
      || keys.KeyR || keys.KeyF;
    if (flying && !following) following = true;

    // in tube mode Q/E become the roll axis (airplane style) and R/F boom
    // along the camera's own up — the body-frame counterpart of A/D
    const roll = tubeOn ? ((keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0)) * 1.5 * rot : 0;
    view.fly(yaw, pitch, roll,
      !!keys.KeyW, !!keys.KeyS, !!keys.KeyA, !!keys.KeyD,
      (tubeOn || !ortho) && !!keys.KeyR,
      (tubeOn || !ortho) && !!keys.KeyF,
      slow, !!keys.Space, gain, dt);
    yaw = 0;
    pitch = 0;
    view.frame(dt);

    if (view.ready() && posed) {
      // stage 2+3 of the tube pipeline: the engine locks ground level as
      // soon as the rect is covered at measurement resolution (well before
      // full res), then we fly in and roll while the rest keeps streaming
      // into the rolled tube. after 20s (a download stuck or failed), force
      // the measurement with what's resident
      const tubeInfoEl = document.getElementById('tubeinfo');
      if (tubeOn) {
        let ti = view.getTubeInfo();
        if (tubePending) {
          if (now - tubePendingSince > 20000 && !ti.groundLocked) {
            view.lockTubeGround();
            ti = view.getTubeInfo();
          }
          if (ti.groundLocked) {
            if (tubePending === 'fly') flyIntoTube(tubeRect);
            tubePending = null;
          }
        }
        const parts = [];
        if (tubePending || ti.nodesLoaded < ti.nodesWanted)
          parts.push(`loading ${ti.nodesLoaded}/${ti.nodesWanted} tiles`);
        if (!tubePending && curl !== curlTarget) parts.push('rolling…');
        tubeInfoEl.style.display = parts.length ? '' : 'none';
        if (parts.length) tubeInfoEl.textContent = 'tube: ' + parts.join(' · ');
      } else {
        tubeInfoEl.style.display = 'none';
      }
      // ease the roll toward closed; ~.7s time constant reads as the
      // ground curling up rather than snapping
      if (tubeOn && !tubePending && curl !== curlTarget) {
        curl += (curlTarget - curl) * (1 - Math.exp(-dt / 700));
        if (Math.abs(curlTarget - curl) < 0.001) curl = curlTarget;
        view.setTubeCurl(curl);
      }
      const p = view.getPose();
      // in tube mode the marker shows the camera in unrolled tube
      // coordinates — the spot on the rect whose imagery is wrapped around
      // the camera — rather than the now-meaningless ecef point under it
      const tp = tubeOn ? view.getTubePose() : null;
      const m = tp || p;
      setMarkerHeading(m.heading);
      if (Math.abs(m.lat - lastSynced.lat) > 1e-7 || Math.abs(m.lon - lastSynced.lon) > 1e-7) {
        lastSynced = { lat: m.lat, lon: m.lon };
        marker.setLngLat([m.lon, m.lat]);
      }
      // runs every frame (not just on movement) so the ease finishes
      // converging even after the camera stops; paused while the pointer is
      // down on the map so drag gestures aren't cancelled mid-flight
      if (following && !mapPointerDown) followMarker({ lat: m.lat, lng: m.lon }, dt);
      if (pickDebug) updatePickDebug();

      saveTimer += dt;
      if (saveTimer > 1000) {
        saveTimer = 0;
        saveView();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
