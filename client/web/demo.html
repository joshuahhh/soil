<!doctype html>
<!-- split-screen demo: maplibre gl slippy map on the left, the earth renderer on
     an ordinary canvas on the right, two-way synced. tiles are cached in
     indexeddb via the js fetch hook.

     serve this directory and open /demo.html, e.g.:
       ./build.sh weblib && python3 -m http.server -d web 8000
     coi-serviceworker injects the cross-origin-isolation headers the pthread
     build needs (expect one automatic reload on first visit). -->
<meta charset="utf-8">
<title>earth split-screen demo</title>
<script>window.coi = { coepCredentialless: () => true };</script>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; }
  #map, #right { flex: 1; height: 100%; }
  #globe { width: 100%; height: 100%; display: block; outline: none; }
  #hint { position: fixed; right: 8px; top: 8px; z-index: 10; color: #fff;
          background: rgba(0,0,0,.55); font: 12px sans-serif; padding: 6px 8px;
          border-radius: 4px; }
</style>
<div id="map"></div>
<div id="right"><canvas id="globe" tabindex="0"></canvas></div>
<div id="hint"></div>
<script>
  const hintText = 'WASD move · E/Q up/down · hold space: view-frame · arrows look · ' +
    'Z/X zoom · -/= speed · shift slow · click map to teleport';
  document.getElementById('hint').textContent = hintText;
</script>
<script src="earth.js"></script>
<script>
(async () => {
  // --- indexeddb byte cache -------------------------------------------------
  const db = await new Promise((res, rej) => {
    const r = indexedDB.open('earth-cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tiles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const idbGet = (key) => new Promise((res) => {
    const t = db.transaction('tiles').objectStore('tiles').get(key);
    t.onsuccess = () => res(t.result);
    t.onerror = () => res(undefined);
  });
  const idbPut = (key, bytes) => {
    try { db.transaction('tiles', 'readwrite').objectStore('tiles').put(bytes, key); } catch (e) {}
  };

  // --- module + view --------------------------------------------------------
  const Module = await createEarthModule();

  // the fetch hook: the renderer asks for a path, we answer with bytes.
  // planetoid metadata ('P...') is not cached, matching the native client
  const stats = window.__stats = {
    issued: 0, delivered: 0, failed: 0, inflight: 0,
    idbHits: 0, netHits: 0, maxMs: 0, log: [],
  };
  const fetchTile = async (path, id) => {
    const t0 = performance.now();
    stats.issued++;
    stats.inflight++;
    try {
      let bytes = path[0] !== 'P' ? await idbGet(path) : undefined;
      if (bytes) stats.idbHits++;
      if (!bytes) {
        const resp = await fetch('https://kh.google.com/rt/earth/' + path);
        if (!resp.ok) throw new Error('http ' + resp.status);
        bytes = new Uint8Array(await resp.arrayBuffer());
        stats.netHits++;
        if (path[0] !== 'P') idbPut(path, bytes);
      }
      stats.delivered++;
      Module.deliverFetch(id, true, bytes);
    } catch (e) {
      stats.failed++;
      stats.log.push(path + ' -> ' + e.message);
      Module.deliverFetch(id, false, null);
    } finally {
      stats.inflight--;
      stats.maxMs = Math.max(stats.maxMs, performance.now() - t0);
    }
  };

  const canvas = document.getElementById('globe');
  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
  };
  resize();
  addEventListener('resize', resize);

  const view = Module.createView('#globe', fetchTile);

  // view state (camera pose, fov, speed gain, map zoom) persists in
  // localstorage so a reload puts you back where you were
  const DEFAULT_VIEW = { lat: 40.7605, lon: -74.0135, alt: 2500, heading: 0, tilt: -25, fov: 45, zoom: 12, gain: 1 };
  const START = (() => {
    try {
      const v = JSON.parse(localStorage.getItem('earth-view'));
      if (v && Number.isFinite(v.lat) && Number.isFinite(v.lon) && Number.isFinite(v.alt))
        return { ...DEFAULT_VIEW, ...v };
    } catch (e) {}
    return DEFAULT_VIEW;
  })();
  const saveView = () => {
    if (!view.ready()) return;
    const p = view.getPose();
    try {
      localStorage.setItem('earth-view', JSON.stringify({
        lat: p.lat, lon: p.lon, alt: p.alt, heading: p.heading, tilt: p.tilt,
        fov: p.fov, zoom: map.getZoom(), gain,
      }));
    } catch (e) {}
  };
  addEventListener('beforeunload', saveView);

  // --- maplibre -------------------------------------------------------------
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [START.lon, START.lat],
    zoom: START.zoom,
    dragRotate: false, // keep the map north-up
    pitchWithRotate: false,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disable(); // arrows belong to the flight canvas
  // camera marker: a dot with a view cone that rotates with the heading.
  // pointer-events none so clicks pass through to the map (teleport)
  const markerEl = document.createElement('div');
  markerEl.style.pointerEvents = 'none';
  markerEl.innerHTML =
    '<svg id="camIcon" width="44" height="44" viewBox="-22 -22 44 44" style="display:block">' +
    '<path d="M0,-3 L-13,-19 A21,21 0 0 1 13,-19 Z" fill="rgba(66,133,244,.4)"/>' +
    '<circle r="5.5" fill="#4285f4" stroke="#fff" stroke-width="2.5"/></svg>';
  const marker = new maplibregl.Marker({ element: markerEl })
    .setLngLat([START.lon, START.lat]).addTo(map);
  const setMarkerHeading = (deg) => {
    const el = document.getElementById('camIcon');
    if (el) el.style.transform = `rotate(${deg}deg)`;
  };

  // --- input on the canvas -> built-in flying controls ----------------------
  // ground frame: WASD cruise/truck, Q/E pedestal. hold Space for the view
  // frame: W/S dolly along the view, Q/E boom along view-up. arrows pan/tilt
  // so no mouse is needed. Z/X zoom (fov). -/= sticky speed gain. shift slow
  const keys = {};
  const handled = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyZ','KeyX',
    'Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Minus','Equal']);
  let gain = 1; // re-initialized from the saved view once it loads
  const gainBadge = () => {
    document.getElementById('hint').textContent =
      hintText + (gain !== 1 ? `  [speed x${gain >= 1 ? gain : '1/' + (1/gain)}]` : '');
  };
  canvas.addEventListener('keydown', (e) => {
    if (handled.has(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Minus' && !e.repeat) { gain = Math.max(1/16, gain/2); gainBadge(); }
    if (e.code === 'Equal' && !e.repeat) { gain = Math.min(16, gain*2); gainBadge(); }
  });
  canvas.addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  let dragging = false, yaw = 0, pitch = 0;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    canvas.focus();
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // grab-the-world: dragging pulls the scene with the pointer
    yaw -= e.movementX * 0.003;
    pitch += e.movementY * 0.003;
  });
  // scroll on the 3d view zooms by narrowing/widening the fov, like the
  // native app (which uses fov *= 0.9^wheel; setFov clamps to 1..100 deg)
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const p = view.getPose();
    view.setFov(p.fov * Math.pow(0.9, -e.deltaY / 100));
  }, { passive: false });

  // --- sync -----------------------------------------------------------------
  // the marker always shows where the camera is. the map is a free viewport:
  // dragging it never touches the camera; clicking it teleports the camera
  // there. while flying, the map follows the marker (smoothly easing over
  // when follow mode re-engages); grabbing the map stops the following
  let following = true;
  let posed = false;

  // while the pointer is down on the map, pause follow updates entirely:
  // the per-frame jumpTo would cancel maplibre's drag gesture mid-flight
  // (the aborted drag then even lands as a click -> surprise teleport)
  let mapPointerDown = false;
  const mapEl = document.getElementById('map');
  mapEl.addEventListener('pointerdown', () => { mapPointerDown = true; });
  addEventListener('pointerup', () => { mapPointerDown = false; });

  map.on('dragstart', () => { following = false; });
  map.on('click', (e) => {
    if (!view.ready()) return;
    const p = view.getPose();
    view.setPose(e.lngLat.lat, e.lngLat.lng, p.alt, p.heading, p.tilt);
  });

  // locked-mode wheel zoom: handle it ourselves with an unanimated setZoom,
  // which zooms around the center — where the follow keeps the marker — so
  // it can't fight the per-frame follow updates. free mode gets maplibre's
  // native pointer-anchored zoom
  document.getElementById('map').addEventListener('wheel', (e) => {
    if (!following) return;
    e.preventDefault();
    e.stopPropagation();
    map.setZoom(map.getZoom() - e.deltaY * 0.005);
  }, { capture: true, passive: false });

  // per-frame exponential ease of the map center toward the marker: smooth
  // when follow mode re-engages far away, and tight tracking during flight.
  // no built-in map animations — they lock the map for their whole duration,
  // which falls apart when the camera covers a large distance every frame.
  // an exponential ease chasing a moving target always lags it by
  // velocity*tau, so aim at the marker's position led by its (smoothed)
  // velocity — steady fast flight then keeps the marker dead-center
  const FOLLOW_TAU_MS = 120;
  let followVel = null, prevMark = null;
  const followMarker = (latlng, dt) => {
    if (prevMark && dt > 0) {
      const dlat = latlng.lat - prevMark.lat;
      const dlng = latlng.lng - prevMark.lng;
      if (Math.abs(dlat) > 0.05 || Math.abs(dlng) > 0.05) {
        followVel = null; // teleport, not motion: don't feed it forward
      } else {
        const a = 1 - Math.exp(-dt / 200);
        followVel = followVel ? {
          lat: followVel.lat + (dlat / dt - followVel.lat) * a,
          lng: followVel.lng + (dlng / dt - followVel.lng) * a,
        } : { lat: dlat / dt, lng: dlng / dt };
      }
    }
    prevMark = latlng;
    const lead = followVel
      ? { lat: followVel.lat * FOLLOW_TAU_MS, lng: followVel.lng * FOLLOW_TAU_MS }
      : { lat: 0, lng: 0 };
    const c = map.getCenter();
    const k = 1 - Math.exp(-dt / FOLLOW_TAU_MS);
    let nlat = c.lat + (latlng.lat + lead.lat - c.lat) * k;
    let nlng = c.lng + (latlng.lng + lead.lng - c.lng) * k;
    // monotonicity: the lead aims ahead of the marker, and when the camera
    // slows it goes stale for a moment — never let the center actually pass
    // the marker, or stopping visibly springs back. if this step would cross
    // it, land exactly on it
    if ((latlng.lat - c.lat) * (latlng.lat - nlat)
      + (latlng.lng - c.lng) * (latlng.lng - nlng) < 0) {
      nlat = latlng.lat;
      nlng = latlng.lng;
    }
    map.jumpTo({ center: [nlng, nlat] });
  };

  // for devtools poking and automated testing
  window.__demo = { view, map, marker, isFollowing: () => following };

  let lastSynced = { lat: 1e9, lon: 1e9 };
  let saveTimer = 0;
  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(100, now - last);
    last = now;

    if (view.ready() && !posed) {
      // once the planet metadata is in, jump to the start (or saved) pose
      posed = true;
      view.setPose(START.lat, START.lon, START.alt, START.heading, START.tilt);
      view.setFov(START.fov);
      gain = START.gain;
      gainBadge();
    }

    const slow = !!(keys.ShiftLeft || keys.ShiftRight);
    // arrows pan/tilt at fixed angular rates (rad/s), shift-slowed
    const rot = (slow ? 0.1 : 1) * dt / 1000;
    if (keys.ArrowRight) yaw += 1.2 * rot;
    if (keys.ArrowLeft) yaw -= 1.2 * rot;
    if (keys.ArrowUp) pitch += 0.9 * rot;
    if (keys.ArrowDown) pitch -= 0.9 * rot;
    // z/x zoom like the wheel
    if (!!keys.KeyZ !== !!keys.KeyX) {
      const p = view.getPose();
      view.setFov(p.fov * Math.pow(0.9, (dt / 150) * (keys.KeyZ ? 1 : -1)));
    }

    const flying = dragging || yaw !== 0 || pitch !== 0
      || keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD || keys.KeyQ || keys.KeyE;
    if (flying && !following) following = true;

    view.fly(yaw, pitch,
      !!keys.KeyW, !!keys.KeyS, !!keys.KeyA, !!keys.KeyD,
      !!keys.KeyE, !!keys.KeyQ,
      slow, !!keys.Space, gain, dt);
    yaw = 0;
    pitch = 0;
    view.frame(dt);

    if (view.ready() && posed) {
      const p = view.getPose();
      setMarkerHeading(p.heading);
      if (Math.abs(p.lat - lastSynced.lat) > 1e-7 || Math.abs(p.lon - lastSynced.lon) > 1e-7) {
        lastSynced = { lat: p.lat, lon: p.lon };
        marker.setLngLat([p.lon, p.lat]);
      }
      // runs every frame (not just on movement) so the ease finishes
      // converging even after the camera stops; paused while the pointer is
      // down on the map so drag gestures aren't cancelled mid-flight
      if (following && !mapPointerDown) followMarker({ lat: p.lat, lng: p.lon }, dt);

      saveTimer += dt;
      if (saveTimer > 1000) {
        saveTimer = 0;
        saveView();
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
