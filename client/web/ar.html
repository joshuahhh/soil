<!doctype html>
<!-- camera-match mode: run on a phone in portrait. gps + compass + pitch
     drive the renderer to approximate what the phone camera sees.

     calibration (sensors lie):
       - drag: correct heading (horizontal) and tilt (vertical); corrections
         are offsets on top of the live sensors, so tracking keeps working
       - pinch: adjust fov (the web exposes no camera intrinsics, so match
         the overlay by eye)
       - +/- buttons: eye height above the gps altitude
     the camera toggle blends the real rear camera under the render.

     ?mock runs without sensors (fixed nyc position, synthetic orientation
     events) for desktop testing. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>earth camera match</title>
<!-- require-corp (not credentialless): firefox doesn't support credentialless
     coep, and this page has no cross-origin no-cors subresources to need it -->
<script>window.coi = { coepCredentialless: () => false };</script>
<script src="coi-serviceworker.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 14px sans-serif; }
  #video, #globe { position: fixed; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; display: none; }
  #globe { touch-action: none; display: block; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 8px max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-bottom));
    color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #hud > * { flex: none; }
  #status { flex: 1 1 100%; font-size: 11px; opacity: .8; }
  button, label { background: rgba(255,255,255,.15); color: #fff; border: 0;
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  input[type=range] { width: 90px; }
  #start { position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; background: #000c;
    color: #fff; font-size: 20px; }
  #errors { position: fixed; left: 0; right: 0; top: 0; z-index: 30;
    display: none; max-height: 40%; overflow-y: auto; margin: 0;
    padding: 8px max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
    background: rgba(160, 20, 20, .92); color: #fff;
    font: 11px/1.5 monospace; white-space: pre-wrap; word-break: break-all; }
</style>
<pre id="errors" title="tap to dismiss"></pre>
<video id="video" autoplay muted playsinline></video>
<canvas id="globe"></canvas>
<div id="hud">
  <div id="status">starting…</div>
  <label><input type="checkbox" id="camToggle"> camera</label>
  <input type="range" id="blend" min="0" max="100" value="50" title="blend">
  <button id="eyeUp">+2m</button>
  <button id="eyeDown">−2m</button>
  <button id="resetCal">reset cal</button>
</div>
<div id="start"><div>tap to start<br><small>(needs location &amp; motion access)</small></div></div>
<script src="earth.js"></script>
<script>
// on-page error console: this runs on phones, where nobody has devtools.
// uncaught errors, unhandled rejections, and console.error (which includes
// the wasm module's stderr) all land in a red tap-to-dismiss panel
(() => {
  const box = document.getElementById('errors');
  const lines = [];
  const show = (msg) => {
    lines.push(new Date().toTimeString().slice(0, 8) + '  ' + msg);
    while (lines.length > 20) lines.shift();
    box.textContent = lines.join('\n');
    box.style.display = 'block';
  };
  box.addEventListener('click', () => { box.style.display = 'none'; });
  window.addEventListener('error', (e) => show(
    (e.message || 'error') + (e.filename ? '  @' + e.filename.split('/').pop() + ':' + e.lineno : '')));
  window.addEventListener('unhandledrejection', (e) => show(
    'unhandled promise: ' + ((e.reason && e.reason.message) || e.reason)));
  const orig = console.error.bind(console);
  console.error = (...a) => { orig(...a); show(a.map(String).join(' ')); };
})();
(async () => {
  const MOCK = new URLSearchParams(location.search).has('mock');
  const $ = (id) => document.getElementById(id);
  const status = (t) => { $('status').textContent = t; };

  // the start gate attaches before anything async: permission requests need
  // the tap's user-gesture, and a dead button with no error is the worst
  // failure mode (seen when module load fails and nothing was listening)
  const started = new Promise((resolve) => {
    $('start').addEventListener('click', async () => {
      $('start').remove();
      if (!MOCK) {
        try {
          if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission)
            await DeviceOrientationEvent.requestPermission(); // ios
        } catch (e) {}
        try { await navigator.wakeLock.request('screen'); } catch (e) {}
      }
      resolve();
    });
  });
  status('loading engine…');
  if (!crossOriginIsolated && !sessionStorage.getItem('coiReloaded')) {
    // first visit: the isolation service worker is installing and will
    // reload; note it so a second failure reads as a real error
    sessionStorage.setItem('coiReloaded', '1');
  }

  // --- persisted calibration ------------------------------------------------
  const cal = (() => {
    try { return { headingOff: 0, tiltOff: 0, fov: 55, eyeOff: 2, ...JSON.parse(localStorage.getItem('earth-ar')) }; }
    catch (e) { return { headingOff: 0, tiltOff: 0, fov: 55, eyeOff: 2 }; }
  })();
  const saveCal = () => { try { localStorage.setItem('earth-ar', JSON.stringify(cal)); } catch (e) {} };

  // --- module (same idb-cached fetch as the demo) ---------------------------
  const db = await new Promise((res, rej) => {
    const r = indexedDB.open('earth-cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tiles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const idbGet = (key) => new Promise((res) => {
    const t = db.transaction('tiles').objectStore('tiles').get(key);
    t.onsuccess = () => res(t.result);
    t.onerror = () => res(undefined);
  });
  const idbPut = (key, bytes) => {
    try { db.transaction('tiles', 'readwrite').objectStore('tiles').put(bytes, key); } catch (e) {}
  };
  let Module;
  try {
    if (!crossOriginIsolated) throw new Error('page is not cross-origin isolated (browser/service-worker issue)');
    Module = await createEarthModule();
  } catch (e) {
    status('engine failed to load: ' + e.message);
    $('start').remove?.();
    throw e;
  }
  const fetchTile = async (path, id) => {
    try {
      let bytes = path[0] !== 'P' ? await idbGet(path) : undefined;
      if (!bytes) {
        const resp = await fetch('https://kh.google.com/rt/earth/' + path);
        if (!resp.ok) throw new Error('http ' + resp.status);
        bytes = new Uint8Array(await resp.arrayBuffer());
        if (path[0] !== 'P') idbPut(path, bytes);
      }
      Module.deliverFetch(id, true, bytes);
    } catch (e) {
      Module.deliverFetch(id, false, null);
    }
  };

  const canvas = $('globe');
  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
  };
  resize();
  addEventListener('resize', resize);
  const view = Module.createView('#globe', fetchTile);

  // --- sensor state ---------------------------------------------------------
  // gps fix (geodetic; google's globe maps lat/lon onto its sphere directly)
  let fix = MOCK ? { lat: 40.7605, lon: -74.0135, alt: 50, acc: 5 } : null;
  // orientation-derived view direction, before calibration offsets
  let sensor = { heading: 0, tilt: 0, have: false };

  // w3c deviceorientation: intrinsic z-x'-y'' (alpha, beta, gamma), earth
  // frame x=east y=north z=up. the back camera looks along device -z; its
  // world direction f gives heading = atan2(east, north), tilt = asin(up).
  // roll is ignored — the renderer's no-roll camera can't express it
  const orient = (e) => {
    if (e.alpha == null && e.webkitCompassHeading == null) return;
    const d = Math.PI / 180;
    const cX = Math.cos((e.beta || 0) * d), sX = Math.sin((e.beta || 0) * d);
    const cY = Math.cos((e.gamma || 0) * d), sY = Math.sin((e.gamma || 0) * d);
    const cZ = Math.cos((e.alpha || 0) * d), sZ = Math.sin((e.alpha || 0) * d);
    const fx = -(cZ * sY + sZ * sX * cY); // east
    const fy = -(sZ * sY - cZ * sX * cY); // north
    const fz = -(cX * cY);                // up
    sensor.tilt = Math.asin(Math.max(-1, Math.min(1, fz))) * 180 / Math.PI;
    if (e.webkitCompassHeading != null) {
      // ios: alpha isn't north-referenced, but the compass heading is
      sensor.heading = e.webkitCompassHeading;
    } else {
      sensor.heading = Math.atan2(fx, fy) * 180 / Math.PI;
    }
    sensor.have = true;
  };

  // --- sensors start once the gate has been tapped --------------------------
  started.then(() => {
    if (MOCK) {
      status('mock mode');
    } else {
      status('waiting for gps…');
      navigator.geolocation.watchPosition((p) => {
        fix = { lat: p.coords.latitude, lon: p.coords.longitude,
          alt: p.coords.altitude, acc: p.coords.accuracy };
      }, (e) => status('gps error: ' + e.message), { enableHighAccuracy: true });
    }
    // chrome android exposes a north-referenced variant; prefer it — but
    // only once it has actually delivered data (desktop chrome fires one
    // empty absolute event, which must not mute the normal channel)
    let absolute = false;
    window.addEventListener('deviceorientationabsolute', (e) => {
      if (e.alpha == null) return;
      absolute = true;
      orient(e);
    });
    window.addEventListener('deviceorientation', (e) => { if (!absolute) orient(e); });
  });

  // --- camera overlay -------------------------------------------------------
  const video = $('video');
  const applyBlend = () => {
    const on = $('camToggle').checked;
    video.style.display = on ? 'block' : 'none';
    canvas.style.opacity = on ? ($('blend').value / 100) : 1;
  };
  $('camToggle').addEventListener('change', async () => {
    if ($('camToggle').checked && !video.srcObject) {
      try {
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false,
        });
      } catch (e) {
        status('camera error: ' + e.message);
        $('camToggle').checked = false;
      }
    }
    applyBlend();
  });
  $('blend').addEventListener('input', applyBlend);

  // --- calibration gestures -------------------------------------------------
  // drag corrects heading/tilt; pinch corrects fov. offsets ride on top of
  // the live sensors, so tracking continues to work after correction
  const touches = new Map();
  let pinchDist = 0;
  canvas.addEventListener('pointerdown', (e) => {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  canvas.addEventListener('pointerup', (e) => { touches.delete(e.pointerId); });
  canvas.addEventListener('pointercancel', (e) => { touches.delete(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    const t = touches.get(e.pointerId);
    if (!t) return;
    const dx = e.clientX - t.x, dy = e.clientY - t.y;
    t.x = e.clientX; t.y = e.clientY;
    if (touches.size === 1) {
      // degrees per pixel from the current fov, grab-the-world direction
      const degPerPx = cal.fov / canvas.clientHeight;
      cal.headingOff -= dx * degPerPx;
      cal.tiltOff += dy * degPerPx;
      saveCal();
    } else if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) {
        cal.fov = Math.max(10, Math.min(100, cal.fov * pinchDist / dist));
        saveCal();
      }
      pinchDist = dist;
    }
  });
  $('eyeUp').addEventListener('click', () => { cal.eyeOff += 2; saveCal(); });
  $('eyeDown').addEventListener('click', () => { cal.eyeOff -= 2; saveCal(); });
  $('resetCal').addEventListener('click', () => {
    cal.headingOff = 0; cal.tiltOff = 0; cal.fov = 55; cal.eyeOff = 2;
    saveCal();
  });

  // --- drive the renderer ---------------------------------------------------
  window.__ar = { view, cal, sensor, setSensor: (h, t) => { sensor = { heading: h, tilt: t, have: true }; window.__ar.sensor = sensor; } };
  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(100, now - last);
    last = now;
    if (view.ready() && fix) {
      const heading = ((sensor.heading + cal.headingOff) % 360 + 360) % 360;
      const tilt = Math.max(-89, Math.min(89, sensor.tilt + cal.tiltOff));
      const alt = (fix.alt || 0) + cal.eyeOff;
      view.setPose(fix.lat, fix.lon, alt, heading, tilt);
      view.setFov(cal.fov);
      status(`gps ±${Math.round(fix.acc || 0)}m · alt ${Math.round(alt)}m · ` +
        `hdg ${Math.round(heading)}° (${Math.round(cal.headingOff)}° cal) · ` +
        `tilt ${Math.round(tilt)}° · fov ${Math.round(cal.fov)}°` +
        (sensor.have ? '' : ' · waiting for compass…'));
    }
    view.frame(dt);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
