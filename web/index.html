  const AIM_SMOOTH_FRAC = 0.1;
  const HEAD_SMOOTH_FRAC = 0.3;
  const CHORD_FRAC = 0.6;
  const SMOOTH_MIN = 8, SMOOTH_MAX = 4000; // m, either end of the scaling
  const FOLLOW_TURN_TAU = 500; // ms: ease on the heading
  const FOLLOW_ALT_TAU = 700;  // ms: and on the target's altitude, which steps
                               // as the drape measurements land
  let spine = null;
  // s: meters along the spine. az: bearing from the target to the camera,
  // relative to the path's heading (0 = behind it, looking the way it goes).
  // el: how far above the target the camera stands. heading/alt: the eased
  // values actually used, null until the first frame seeds them
  const fol = { s: 0, az: 0, el: 22, dist: 250, heading: null, alt: null };

  // box filter by prefix sum, O(n) whatever the window; the window shrinks at
  // the ends rather than the values being clamped into it
  const boxcar = (a, half) => {
    const n = a.length, pre = new Float64Array(n + 1), out = new Float64Array(n);
    for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];
    for (let i = 0; i < n; i++) {
      const lo = Math.max(0, i - half), hi = Math.min(n - 1, i + half);
      out[i] = (pre[hi + 1] - pre[lo]) / (hi - lo + 1);
    }
    return out;
  };
  const halfFor = (win) => Math.max(1, Math.round(win / SPINE_STEP / 2));
  // the smoothed copies, filtered once and kept until the window they were
  // filtered at has moved appreciably. the window follows the zoom, so it
  // technically changes every frame — but quantizing it costs a sub-metre
  // step in the aim and saves refiltering the track for a change nobody can
  // see. two boxcars over the whole spine is O(n) and only runs while you are
  // actually zooming; a per-frame kernel would run always
  const SMOOTH_STALE = 0.08; // refilter once the window has moved this much
  const smoothCache = new Map(); // 'aim' | 'head' -> { win, xs, ys }
  const smoothed = (key, win) => {
    const c = smoothCache.get(key);
    if (c && Math.abs(win - c.win) < SMOOTH_STALE * c.win) return c;
    const half = halfFor(win);
    let xs = spine.rx, ys = spine.ry;
    for (let pass = 0; pass < 2; pass++) { xs = boxcar(xs, half); ys = boxcar(ys, half); }
    const built = { win, xs, ys };
    smoothCache.set(key, built);
    // the debug line is the aim copy itself, not a second filtering of it:
    // a debug view that can disagree with the thing it depicts is worse than
    // none at all
    if (key === 'aim' && debugSmooth) drawSmoothLayer(built);
    return built;
  };

  const buildSpine = () => {
    spine = null;
    if (!path) return;
    // one line to follow: the gaps between track segments are crossed rather
    // than jumped, since the camera has to travel through them somehow
    const raw = [];
    for (const seg of path.segs) for (const p of seg) raw.push(p);
    if (raw.length < 2) return;
    // one local tangent plane for the whole track: meters east/north of its
    // mean latitude. the east scale drifts with cos(lat) away from that — a
    // percent over a degree — which is nothing against a camera standoff, and
    // it keeps resampling and smoothing to plain 2d arithmetic
    const lat0 = raw.reduce((t, p) => t + p.lat, 0) / raw.length;
    const lon0 = raw[0].lon;
    const mLat = D2R * planetR, mLon = mLat * Math.cos(lat0 * D2R);
    const xy = raw.map((p) => [(p.lon - lon0) * mLon, (p.lat - lat0) * mLat]);
    // resample at a fixed step, remembering which original point each sample
    // came from — the engine's altitudes are indexed by that
    const samples = [{ x: xy[0][0], y: xy[0][1], i: 0 }];
    let dAcc = 0, dNext = SPINE_STEP;
    for (let i = 1; i < xy.length; i++) {
      const dx = xy[i][0] - xy[i - 1][0], dy = xy[i][1] - xy[i - 1][1];
      const len = Math.hypot(dx, dy);
      if (!(len > 0)) continue;
      while (dNext <= dAcc + len) {
        const t = (dNext - dAcc) / len;
        samples.push({ x: xy[i - 1][0] + dx * t, y: xy[i - 1][1] + dy * t, i });
        dNext += SPINE_STEP;
      }
      dAcc += len;
    }
    if (samples.length < 2) return;
    // resampled but *unsmoothed*: the smoothing happens per frame now, at
    // whatever window the current view scale asks for
    const rx = Float64Array.from(samples, (p) => p.x);
    const ry = Float64Array.from(samples, (p) => p.y);
    // arc length along the *raw* points, which is what the ribbon is drawn
    // through and therefore what the cursor and the progress readout have to
    // speak. the spine is only ever consulted for which way the track heads
    smoothCache.clear();
    const cum = new Float64Array(xy.length);
    for (let i = 1; i < xy.length; i++)
      cum[i] = cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]);
    spine = { rx, ry, idx: samples.map((p) => p.i), raw, cum, step: SPINE_STEP,
      len: (samples.length - 1) * SPINE_STEP, rawLen: cum[cum.length - 1],
      lat0, lon0, mLat, mLon };
  };

  // the smoothing leaves the samples very slightly unevenly spaced, so s/step
  // is an approximation of arc length — by well under a percent, and nothing
  // here needs it to be exact
  // a point on one of the smoothed copies, interpolated between the samples
  // either side so it doesn't step as s crosses one
  const spineAt = (s, sm) => {
    const n = sm.xs.length;
    const u = Math.min(n - 1, Math.max(0, s / spine.step));
    const i = Math.min(n - 2, Math.floor(u)), f = u - i;
    return [sm.xs[i] + (sm.xs[i + 1] - sm.xs[i]) * f,
      sm.ys[i] + (sm.ys[i + 1] - sm.ys[i]) * f];
  };
  // metres along the raw track -> fractional point index, and the point
  // itself. this is the number the ribbon is built from, so a cursor placed
  // with it sits on the drawn line by construction
  const rawAt = (s) => {
    const cum = spine.cum;
    let lo = 0, hi = cum.length - 1;
    const d = Math.max(0, Math.min(s, spine.rawLen));
    while (lo < hi) { // first index whose cumulative length is >= d
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(0, lo - 1);
    const leg = cum[i + 1] - cum[i];
    const f = leg > 0 ? (d - cum[i]) / leg : 0;
    const a = spine.raw[i], b = spine.raw[Math.min(i + 1, spine.raw.length - 1)];
    return { idx: i + f,
      lat: a.lat + (b.lat - a.lat) * f, lon: a.lon + (b.lon - a.lon) * f };
  };
  const spineIdx = (s) => spine.idx[Math.min(spine.idx.length - 1,
    Math.max(0, Math.round(s / spine.step)))];
  // how much ground the view spans at the target, in metres — the scale the
  // smoothing windows are cut from. a parallel projection says so outright;
  // in perspective it comes from the standoff and the fov, so both the R/F
  // standoff and the Z/X zoom feed it
  const followSpan = () => {
    if (ortho) {
      const e = view.getOrthoExtent();
      if (e > 0) return 2 * e;
    }
    const fov = view.ready() ? view.getPose().fov : 45;
    return Math.max(20, 2 * fol.dist * Math.tan(fov * D2R / 2));
  };
  const winFor = (frac, span) =>
    Math.min(SMOOTH_MAX, Math.max(SMOOTH_MIN, frac * span));
  const spineLatLon = (xy) => ({ lat: spine.lat0 + xy[1] / spine.mLat,
    lon: spine.lon0 + xy[0] / spine.mLon });
  // which way the track heads at s, degrees clockwise from north, over a
  // chord rather than a segment (this is the anti-jitter measurement)
  const spineHeading = (s, sm, chord) => {
    const a = spineAt(Math.max(0, s - chord), sm);
    const b = spineAt(Math.min(spine.len, s + chord), sm);
    const dx = b[0] - a[0], dy = b[1] - a[1];
    return Math.hypot(dx, dy) < 1e-6 ? null : Math.atan2(dx, dy) / D2R;
  };
  // the ground the camera should be looking at, averaged over a stretch of
  // track so one bad fix doesn't dip the view. the engine answers with the
  // draped altitude where the mesh under that point has been measured and
  // with nothing where it hasn't, so measured points win outright and the
  // file's own elevations only stand in until the drape reaches there —
  // averaging the two together would split the difference and park the
  // target inside the hillside
  const spineAlt = (s) => {
    const at = (j) => Math.round(rawAt(s + j * 25).idx);
    let sum = 0, n = 0;
    for (let j = -3; j <= 3; j++) {
      const a = view.getPathGroundAlt(at(j));
      if (Number.isFinite(a)) { sum += a; n++; }
    }
    if (n) return sum / n;
    for (let j = -3; j <= 3; j++) {
      const e = spine.raw[at(j)].ele;
      if (Number.isFinite(e)) { sum += e; n++; }
    }
    return n ? sum / n : null;
  };
  // where on the spine the camera is standing now, so V picks you up where
  // you are rather than teleporting to the trailhead
  const nearestS = () => {
    const p = view.getPose();
    const x = (p.lon - spine.lon0) * spine.mLon, y = (p.lat - spine.lat0) * spine.mLat;
    let best = 0, bd = Infinity;
    for (let i = 0; i < spine.raw.length; i++) {
      const rx = (spine.raw[i].lon - spine.lon0) * spine.mLon;
      const ry = (spine.raw[i].lat - spine.lat0) * spine.mLat;
      const d = (rx - x) ** 2 + (ry - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return spine.cum[best];
  };

  // --- debug: draw what the camera is actually following ---------------------
  // the smoothed copy is invisible by construction — it exists only as the
  // thing the camera aims down — so when the marker floats off-centre there
  // is nothing to look at to see why. this draws it on the map beside the
  // track: dashed, in a contrasting color, at whatever window the current
  // zoom is asking for. the gap between the two lines *is* the float
  let debugSmooth = false;
  const drawSmoothLayer = (sm) => {
    const src = map.getSource('gpx-smooth');
    if (!src || !spine) return;
    const coords = [];
    for (let i = 0; i < sm.xs.length; i++) {
      const ll = spineLatLon([sm.xs[i], sm.ys[i]]);
      coords.push([ll.lon, ll.lat]);
    }
    src.setData({ type: 'Feature', properties: { win: sm.win },
      geometry: { type: 'LineString', coordinates: coords } });
  };
  const setDebugSmooth = (on) => {
    debugSmooth = on;
    const src = map.getSource('gpx-smooth');
    if (src && !on) src.setData({ type: 'FeatureCollection', features: [] });
    // draw whatever the camera is following right now; if it has not been
    // following anything yet, filter at the window it would use
    if (on && spine) drawSmoothLayer(smoothed('aim', winFor(AIM_SMOOTH_FRAC, followSpan())));
    canvas.focus();
  };

  const setFollow = (on) => {
    if (on && (!spine || !view.ready() || tubeOn)) on = false;
    if (on === followOn) { refreshPathPanel(); return; }
    followOn = on;
    fol.heading = fol.alt = null; // don't ease out of a stale value
    if (on) {
      // terrain hug goes: it re-eases the eye toward a held height above the
      // mesh inside every fly() call, and the rails write the pose outright,
      // so the two fight over the same thing. ortho stays — a parallel
      // projection has no quarrel with the rails, it just changes what R/F
      // and a drag have to do (see followStep)
      if (hug) { hug = false; view.setTerrainFollow(false); }
      fol.s = nearestS();
      following = true; // let the map track the camera along
      canvas.focus();
    } else {
      setCursor(null);
    }
    document.body.classList.toggle('riding', on);
    refreshPathPanel();
    updateHint();
    savePath();
  };
  const toggleFollow = () => setFollow(!followOn);
  pathEls.follow.addEventListener('click', toggleFollow);

  // one frame of the follow camera; replaces the flight controls entirely
  // while it is on (see the tick)
  const followStep = (dt, slow) => {
    const k = (slow ? 0.15 : 1) * dt / 1000;
    // a drag on the view swings the standoff, the same grab-the-world way it
    // turns the head in free flight: pull right and the track goes right,
    // which means the camera walks left around it. yaw/pitch carry only the
    // pointer here — the tick keeps the arrow keys out of them on the rails
    if (yaw || pitch) {
      fol.az += yaw / D2R;
      fol.el = Math.min(85, Math.max(-10, fol.el + pitch / D2R));
    }
    // one notion of scale for everything that has to follow the zoom: how
    // much ground the view spans (see followSpan). travel is scaled to it so
    // motion looks the same on screen at any zoom — from 20 m out a hiking
    // pace is right, from 5 km up it would take all day. this used to scale
    // to the standoff alone, which is proportional to the span at a fixed fov
    // and so felt right until you touched a zoom: Z/X moves the fov, and in
    // ortho the wheel and Z/X move the extent, none of which is the standoff
    const span = followSpan();
    const speed = Math.max(15, span * 0.6) * gain;
    if (keys.KeyW) fol.s += speed * k;
    if (keys.KeyS) fol.s -= speed * k;
    fol.s = Math.min(spine.rawLen, Math.max(0, fol.s));
    if (keys.ArrowRight) fol.az += 60 * k;
    if (keys.ArrowLeft) fol.az -= 60 * k;
    if (keys.ArrowUp) fol.el = Math.min(85, fol.el + 40 * k);
    if (keys.ArrowDown) fol.el = Math.max(-10, fol.el - 40 * k);
    if (!!keys.KeyR !== !!keys.KeyF) {
      // >1 zooms in, matching zoomOrtho's sense; R backs off, F closes in
      const f = Math.pow(1.8, (keys.KeyR ? -1 : 1) * (slow ? 0.15 : 1) * dt / 1000);
      // a parallel projection doesn't care how far back the camera stands, so
      // in ortho the standoff is invisible and R/F have to move the extent
      // instead — the way they do outside follow. the standoff still rides
      // along, so the framing survives a switch back to perspective and the
      // travel speed (which scales with it) tracks what you can actually see
      if (ortho) view.zoomOrtho(f);
      fol.dist = Math.min(50000, Math.max(15, fol.dist / f));
    }

    // the smoothing windows for this frame, cut from that same span: zoom out
    // and the camera rides a longer average of the track, which is what keeps
    // the same track from reading as rigid at altitude and shaky up close
    const aimWin = winFor(AIM_SMOOTH_FRAC, span);
    const headWin = winFor(HEAD_SMOOTH_FRAC, span);
    const chord = winFor(CHORD_FRAC, span);
    const aimSm = smoothed('aim', aimWin), headSm = smoothed('head', headWin);
    // the heading is the one thing still taken from the smoothed spine — the
    // jitter that matters is in the *direction* between raw points, not in
    // their positions. its arc length runs a hair short of the raw track's
    // (smoothing cuts corners), so the position is scaled across
    const sSpine = fol.s * (spine.len / Math.max(1, spine.rawLen));
    const h = spineHeading(sSpine, headSm, chord);
    if (h !== null) {
      if (fol.heading === null) fol.heading = h;
      else {
        // shortest way round, so crossing north doesn't spin the long way
        const d = ((h - fol.heading + 540) % 360) - 180;
        fol.heading += d * (1 - Math.exp(-dt / FOLLOW_TURN_TAU));
      }
    }
    const a = spineAlt(fol.s);
    if (a !== null)
      fol.alt = fol.alt === null ? a
        : fol.alt + (a - fol.alt) * (1 - Math.exp(-dt / FOLLOW_ALT_TAU));

    // the aim point is on the raw track, not the smoothed copy: the ribbon is
    // drawn through the raw points, and a marker placed off the smoothed one
    // visibly leaves the line at every bend. the 3d disc is placed by point
    // index so the engine can put it on the drawn geometry exactly, drape and
    // all; the map dot and the camera get the interpolated position
    const ll = rawAt(fol.s);
    setCursor(ll);
    view.setPathCursorIndex(ll.idx);
    pathEls.progress.textContent = `${(fol.s / 1000).toFixed(2)} of `
      + `${(spine.rawLen / 1000).toFixed(2)} km · `
      + `${Math.round(100 * fol.s / Math.max(1, spine.rawLen))}%`
      + (debugSmooth ? ` · smooth ${Math.round(aimWin)}/${Math.round(headWin)} m` : '');
    // the camera aims down its own lightly smoothed copy, never the raw
    // track: the marker has to be on the drawn line, the camera has to not
    // shake, and those are different requirements
    const aim = spineLatLon(spineAt(sSpine, aimSm));
    const lat = aim.lat * D2R, lon = aim.lon * D2R;
    const up = geoUpV(lat, lon), north = geoNorthV(lat, lon), east = vcross(north, up);
    const bearing = ((fol.heading || 0) + fol.az) * D2R;
    const horiz = vadd(vmul(north, Math.cos(bearing)), vmul(east, Math.sin(bearing)));
    const target = vmul(up, planetR + (fol.alt || 0));
    // the camera stands off *behind* the target along that bearing, lifted by
    // the elevation angle — so az 0 is a chase view down the track
    const el = fol.el * D2R;
    const eye = vadd(target, vadd(vmul(horiz, -fol.dist * Math.cos(el)),
      vmul(up, fol.dist * Math.sin(el))));
    // back into the pose vocabulary: where that put the camera, and the aim
    // from there to the target — which is not quite the bearing above once
    // the planet has curved between the two
    const r = Math.hypot(eye[0], eye[1], eye[2]);
    const eu = vmul(eye, 1 / r);
    const clamp1 = (v) => Math.min(1, Math.max(-1, v));
    const clat = Math.asin(clamp1(eu[2])), clon = Math.atan2(eu[1], eu[0]);
    const v = vnorm(vsub(target, eye));
    if (!v) return;
    const cnorth = geoNorthV(clat, clon), ceast = vcross(cnorth, eu);
    view.setPose(clat / D2R, clon / D2R, r - planetR,
      Math.atan2(vdot(v, ceast), vdot(v, cnorth)) / D2R,
      Math.asin(clamp1(vdot(v, eu))) / D2R);
  };

  // restore. skipped in test mode for the same reason the saved pose is: a
  // capture must not depend on what the last interactive session dropped
  (async () => {
    if (TEST) return;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('earth-path')); } catch (e) {}
    if (saved && saved.style) Object.assign(pathStyle, saved.style);
    if (saved && saved.follow) Object.assign(fol, saved.follow, { heading: null, alt: null });
    refreshPathPanel();
    const file = await idbGet('gpx-file', 'app');
    if (!file) return;
    const parsed = parseGpx(await file.text());
    if (parsed) {
      if (!parsed.name) parsed.name = (saved && saved.name) || '';
      setPath(parsed); // pushPath is a no-op until the planet is ready; tick retries
    } else {
      idbDel('gpx-file', 'app');
    }
  })();

  // locked-mode wheel zoom: handle it ourselves with an unanimated setZoom,
  // which zooms around the center — where the follow keeps the marker — so
  // it can't fight the per-frame follow updates. free mode gets maplibre's
  // native pointer-anchored zoom
  document.getElementById('map').addEventListener('wheel', (e) => {
    if (!following) return;
    e.preventDefault();
    e.stopPropagation();
    map.setZoom(map.getZoom() - e.deltaY * 0.005);
  }, { capture: true, passive: false });

  // per-frame exponential ease of the map center toward the marker: smooth
  // when follow mode re-engages far away, and tight tracking during flight.
  // no built-in map animations — they lock the map for their whole duration,
  // which falls apart when the camera covers a large distance every frame.
  // an exponential ease chasing a moving target always lags it by
  // velocity*tau, so aim at the marker's position led by its (smoothed)
  // velocity — steady fast flight then keeps the marker dead-center
  const FOLLOW_TAU_MS = 120;
  let followVel = null, prevMark = null;
  const followMarker = (latlng, dt) => {
    if (prevMark && dt > 0) {
      const dlat = latlng.lat - prevMark.lat;
      const dlng = latlng.lng - prevMark.lng;
      if (Math.abs(dlat) > 0.05 || Math.abs(dlng) > 0.05) {
        followVel = null; // teleport, not motion: don't feed it forward
      } else {
        const a = 1 - Math.exp(-dt / 200);
        followVel = followVel ? {
          lat: followVel.lat + (dlat / dt - followVel.lat) * a,
          lng: followVel.lng + (dlng / dt - followVel.lng) * a,
        } : { lat: dlat / dt, lng: dlng / dt };
      }
    }
    prevMark = latlng;
    const lead = followVel
      ? { lat: followVel.lat * FOLLOW_TAU_MS, lng: followVel.lng * FOLLOW_TAU_MS }
      : { lat: 0, lng: 0 };
    const c = map.getCenter();
    const k = 1 - Math.exp(-dt / FOLLOW_TAU_MS);
    let nlat = c.lat + (latlng.lat + lead.lat - c.lat) * k;
    let nlng = c.lng + (latlng.lng + lead.lng - c.lng) * k;
    // monotonicity: the lead aims ahead of the marker, and when the camera
    // slows it goes stale for a moment — never let the center actually pass
    // the marker, or stopping visibly springs back. if this step would cross
    // it, land exactly on it
    if ((latlng.lat - c.lat) * (latlng.lat - nlat)
      + (latlng.lng - c.lng) * (latlng.lng - nlng) < 0) {
      nlat = latlng.lat;
      nlng = latlng.lng;
    }
    map.jumpTo({ center: [nlng, nlat] });
  };

  // --- point-pair alignment -------------------------------------------------
  // tie points of the reference photo to points on the mesh, then let a
  // solver nudge the camera until each mesh point lands on its photo point.
  // this is for the last mile — fly the view roughly into place by hand, mark
  // three or four landmarks, and solve for the pose that reproduces the shot.
  //
  // perspective only, and never in the tube: the fit assumes the render is a
  // pinhole image of fixed geometry, which a parallel projection isn't and
  // the rolled tube's warp definitely isn't.
  //
  // the camera projection is reimplemented here rather than called through the
  // engine, so a solver iteration costs no wasm round trips — it mirrors
  // earth_camera.h's poseToCamera and rocktree_math.h's lookAt/perspective,
  // and pickNdc on the wasm side is built from the same basis
  const D2R = Math.PI / 180;
  let planetR = 6371010; // refreshed from the engine as soon as it's ready

  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]];
  const vnorm = (a) => {
    const n = Math.hypot(a[0], a[1], a[2]);
    return n > 1e-12 ? vmul(a, 1 / n) : null;
  };
  const geoUpV = (lat, lon) => [Math.cos(lat) * Math.cos(lon),
    Math.cos(lat) * Math.sin(lon), Math.sin(lat)]; // radians
  const geoNorthV = (lat, lon) => [-Math.sin(lat) * Math.cos(lon),
    -Math.sin(lat) * Math.sin(lon), Math.cos(lat)];
  // a pair's mesh anchor as ecef meters. pickNdc reports the hit in spherical
  // terms against the same radius, so this rebuilds the exact point
  const ecefOf = (pr) => vmul(geoUpV(pr.lat * D2R, pr.lon * D2R), planetR + pr.alt);

  // the basis lookAt builds for a pose: eye, boresight, screen-right, view-up
  const poseBasis = (p) => {
    const lat = p.lat * D2R, lon = p.lon * D2R;
    const up = geoUpV(lat, lon);
    const north = geoNorthV(lat, lon);
    const east = vcross(north, up);
    const horiz = vadd(vmul(north, Math.cos(p.heading * D2R)),
      vmul(east, Math.sin(p.heading * D2R)));
    const dir = vnorm(vadd(vmul(horiz, Math.cos(p.tilt * D2R)),
      vmul(up, Math.sin(p.tilt * D2R))));
    if (!dir) return null;
    const right = vnorm(vcross(dir, up)); // straight up/down: right is undefined
    if (!right) return null;
    return { eye: vmul(up, planetR + p.alt), dir, right, vup: vcross(right, dir) };
  };
  // ecef -> viewport pixels; null when the point is behind the camera
  const projectWith = (b, fovDeg, P, W, H) => {
    const v = vsub(P, b.eye);
    const z = vdot(v, b.dir);
    if (!(z > 1e-6)) return null;
    const t = Math.tan(fovDeg * D2R / 2);
    const ndcX = vdot(v, b.right) / z / (t * (W / H));
    const ndcY = vdot(v, b.vup) / z / t;
    return { x: (ndcX * 0.5 + 0.5) * W, y: (0.5 - ndcY * 0.5) * H };
  };

  // --- state ---
  let pairs = [];       // { u, v, lat, lon, alt } — photo coords + mesh anchor
  let selPair = -1;
  // which pair the pointer is on, wherever it is: a row of the list and the
  // markers out in the view are two views of the same pair, so hovering
  // either lights up both
  let hovPair = -1;
  let panelOpen = false;
  let refImageKey = null; // name:size of the stored photo, to spot a re-drop
  const freeFlags = { pos: true, aim: true, fov: true };
  const listEl = document.getElementById('aplist');
  const statusEl = document.getElementById('apstatus');
  const bannerEl = document.getElementById('apbanner');
  const svgEl = document.getElementById('pairs');
  const scaleEl = document.getElementById('apscale');
  const solveBtn = document.getElementById('apsolve');
  const addBtn = document.getElementById('apadd');

  // selection and hover live in these two numbers; this is the only thing
  // that paints them, on the markers and on the rows alike. rebuilding the
  // list would do it too, but it also resets the live error text and yanks
  // the delete buttons, which is a lot to do for a change of colour
  const applyPairStates = () => {
    markerEls.forEach((m, i) => {
      m.g.classList.toggle('sel', i === selPair);
      m.g.classList.toggle('hov', i === hovPair);
    });
    rowEls.forEach((r, i) => {
      r.row.classList.toggle('sel', i === selPair);
      r.row.classList.toggle('hov', i === hovPair);
    });
  };
  const setSel = (i) => { selPair = i; applyPairStates(); };
  const setHover = (i) => {
    if (hovPair === i) return;
    hovPair = i;
    applyPairStates();
  };

  function saveAlign() {
    if (storageFrozen) return;
    try {
      localStorage.setItem('earth-align', JSON.stringify({
        pairs, ov, free: freeFlags, open: panelOpen, key: refImageKey,
        opacity: +overlayBlend.value,
      }));
    } catch (e) {}
  }
  function clearPairs() {
    pairs = [];
    selPair = -1;
    stopSolve();
    buildMarkers();
    renderList();
    saveAlign();
  }
  // alignment is off in ortho and in the tube (see the note above), and
  // pointless without a photo. called from updateHint, so every mode switch
  // re-evaluates it
  function alignRefresh() {
    const on = panelOpen && document.body.classList.contains('overlay')
      && !ortho && !tubeOn;
    document.body.classList.toggle('align', on);
    if (!on) { cancelCapture(); stopSolve(); }
    scaleEl.value = Math.round(ov.scale * 100);
    document.getElementById('apfreepos').checked = freeFlags.pos;
    document.getElementById('apfreeaim').checked = freeFlags.aim;
    document.getElementById('apfreefov').checked = freeFlags.fov;
    buildMarkers();
    renderList();
  }

  // --- markers ---
  // rebuilt when the pair set changes; positions refresh every frame in tick
  let markerEls = [];
  const svgNode = (tag, attrs) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  // one group per pair, in paint order: the fat invisible line that makes the
  // residual clickable, the residual itself, then each end (state ring, ring,
  // centre dot), the number, and last the two grab discs — last so that where
  // an end sits on the line or the number, the end is what you get
  function buildMarkers() {
    svgEl.textContent = '';
    hovPair = -1;
    markerEls = pairs.map((pr, i) => {
      const g = svgNode('g', {});
      // wide enough to hit, narrow enough that it isn't much of a dead band
      // for a camera drag started on the picture (nothing under #pairs sees a
      // pointerdown that lands on a hit shape)
      const hitLine = svgNode('line', { class: 'hit pick', 'stroke-width': 12 });
      const line = svgNode('line', { class: 'res', stroke: '#fff', 'stroke-width': 1.5,
        'stroke-dasharray': '4 3', opacity: .9 });
      // the photo end (magenta) and the mesh end (cyan); the solver's job is
      // to drive one onto the other
      const photoHalo = svgNode('circle', { r: 12, class: 'halo' });
      const photo = svgNode('circle', { r: 6, fill: 'none', stroke: '#ff2fd0',
        'stroke-width': 2.5 });
      const photoDot = svgNode('circle', { r: 1.5, fill: '#ff2fd0' });
      const meshHalo = svgNode('circle', { r: 12, class: 'halo' });
      const mesh = svgNode('circle', { r: 6, fill: 'none', stroke: '#22d3ee',
        'stroke-width': 2.5 });
      const meshDot = svgNode('circle', { r: 1.5, fill: '#22d3ee' });
      const lbl = svgNode('text', { class: 'lbl pick' });
      lbl.textContent = i + 1;
      const photoHit = svgNode('circle', { r: 13, class: 'hit grab' });
      const meshHit = svgNode('circle', { r: 13, class: 'hit grab' });
      for (const el of [hitLine, line, photoHalo, photo, photoDot,
                        meshHalo, mesh, meshDot, lbl, photoHit, meshHit])
        g.appendChild(el);
      svgEl.appendChild(g);
      hookDrag(photoHit, i, 'photo');
      hookDrag(meshHit, i, 'mesh');
      // the line and the number don't drag anything; they just say which pair
      // you mean, the way clicking its row in the list does
      for (const el of [hitLine, lbl]) el.addEventListener('click', () => setSel(selPair === i ? -1 : i));
      for (const el of [hitLine, lbl, photoHit, meshHit]) {
        el.addEventListener('pointerenter', () => setHover(i));
        el.addEventListener('pointerleave', () => setHover(-1));
      }
      return { g, hitLine, line, photoHalo, photo, photoDot,
               meshHalo, mesh, meshDot, lbl, photoHit, meshHit };
    });
    applyPairStates();
  }
  // dragging an end adjusts that pair: the photo end moves within the picture,
  // the mesh end re-picks whatever terrain is now under the pointer
  let dragPair = null;
  function hookDrag(el, i, which) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragPair = { i, which };
      setSel(i);
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragPair || dragPair.i !== i) return;
      const r = rightEl.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const pr = pairs[i];
      if (!pr) return;
      if (which === 'photo') {
        const p = viewToPhoto(x, y);
        if (p) { pr.u = p.u; pr.v = p.v; }
      } else {
        const hit = view.pickNdc((x / r.width) * 2 - 1, 1 - (y / r.height) * 2);
        if (hit) { pr.lat = hit.lat; pr.lon = hit.lon; pr.alt = hit.alt; }
      }
    });
    const end = () => { if (dragPair) { dragPair = null; saveAlign(); } };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // per-frame: place both ends, draw the residual between them, and report
  // each pair's error. returns the rms pixel error over the usable pairs
  let lastErrs = [];
  const updateMarkers = () => {
    const W = rightEl.clientWidth, H = rightEl.clientHeight;
    const p = view.getPose();
    const basis = poseBasis(p);
    let sum = 0, n = 0;
    lastErrs = pairs.map((pr, i) => {
      const m = markerEls[i];
      const tgt = photoToView(pr.u, pr.v);
      const cur = basis ? projectWith(basis, p.fov, ecefOf(pr), W, H) : null;
      if (!m) return null;
      // an end that isn't on screen takes its hit shape down with it, or the
      // pointer would find a target where there is nothing drawn
      const show = (el, on) => el.setAttribute('visibility', on ? 'visible' : 'hidden');
      for (const el of [m.photo, m.photoDot, m.photoHalo, m.photoHit, m.lbl]) show(el, !!tgt);
      for (const el of [m.mesh, m.meshDot, m.meshHalo, m.meshHit]) show(el, !!cur);
      for (const el of [m.line, m.hitLine]) show(el, !!(tgt && cur));
      // the marked-out pair also stands a little taller
      const big = i === selPair || i === hovPair;
      m.photo.setAttribute('r', big ? 8 : 6);
      m.mesh.setAttribute('r', big ? 8 : 6);
      if (tgt) {
        for (const el of [m.photo, m.photoDot, m.photoHalo, m.photoHit]) {
          el.setAttribute('cx', tgt.x);
          el.setAttribute('cy', tgt.y);
        }
        m.lbl.setAttribute('x', tgt.x + 10);
        m.lbl.setAttribute('y', tgt.y - 8);
      }
      if (cur) {
        for (const el of [m.mesh, m.meshDot, m.meshHalo, m.meshHit]) {
          el.setAttribute('cx', cur.x);
          el.setAttribute('cy', cur.y);
        }
      }
      if (tgt && cur) {
        for (const el of [m.line, m.hitLine]) {
          el.setAttribute('x1', tgt.x);
          el.setAttribute('y1', tgt.y);
          el.setAttribute('x2', cur.x);
          el.setAttribute('y2', cur.y);
        }
        const d = Math.hypot(cur.x - tgt.x, cur.y - tgt.y);
        sum += d * d;
        n++;
        return d;
      }
      return null;
    });
    return n ? Math.sqrt(sum / n) : null;
  };

  // --- the pair list ---
  // rows are built only when the pair set changes; their live numbers are
  // patched in place every frame (rebuilding at frame rate would yank the
  // delete buttons out from under a click)
  let rowEls = [];
  function renderList() {
    listEl.textContent = '';
    rowEls = pairs.map((pr, i) => {
      const row = document.createElement('div');
      row.className = 'pair';
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i + 1;
      const uv = document.createElement('span');
      uv.textContent = pr.u.toFixed(2) + ',' + pr.v.toFixed(2);
      const err = document.createElement('span');
      err.className = 'err';
      const del = document.createElement('button');
      del.className = 'x';
      del.textContent = '✕';
      del.title = 'delete this pair';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        pairs.splice(i, 1);
        if (selPair >= pairs.length) selPair = -1;
        hovPair = -1; // the row under the pointer is a different pair now
        buildMarkers();
        renderList();
        saveAlign();
      });
      row.append(n, uv, err, del);
      row.addEventListener('click', () => setSel(selPair === i ? -1 : i));
      // the other half of the mirror: pointing at a row marks its pair out in
      // the view, the same wash the row itself takes
      row.addEventListener('pointerenter', () => setHover(i));
      row.addEventListener('pointerleave', () => setHover(-1));
      listEl.appendChild(row);
      return { row, err };
    });
    applyPairStates();
    updateStatus(null);
  }
  // the live readout: per-pair pixel error and the overall rms
  function updateStatus(rms) {
    rowEls.forEach((r, i) => {
      const e = lastErrs[i];
      r.err.textContent = e == null ? 'off-screen' : Math.round(e) + 'px';
      r.row.classList.toggle('off', e == null);
    });
    const k = dofCount();
    const need = Math.ceil(k / 2);
    const bits = [`${pairs.length} pair${pairs.length === 1 ? '' : 's'} · ${k} free parameter${k === 1 ? '' : 's'}`];
    if (rms != null) bits.push(`rms ${rms.toFixed(1)}px`);

  // two clicks: first the point in the photo, then the same feature on the

  let capture = null;

  const setBanner = (t) => { bannerEl.textContent = t; };
  function startCapture() {

      // the measurement with what's resident
      const tubeInfoEl = document.getElementById('tubeinfo');
      if (tubeOn) {
        let ti = view.getTubeInfo();
        if (tubePending) {
          if (now - tubePendingSince > 20000 && !ti.groundLocked) {
            view.lockTubeGround();
            ti = view.getTubeInfo();
          }
          if (ti.groundLocked) {
            if (tubePending === 'fly') flyIntoTube(tubeRect);
            tubePending = null;
          }
        }
        const parts = [];
        if (tubePending || ti.nodesLoaded < ti.nodesWanted)
          parts.push(`loading ${ti.nodesLoaded}/${ti.nodesWanted} tiles`);
        if (!tubePending && curl !== curlTarget) parts.push('rolling…');
        tubeInfoEl.style.display = parts.length ? '' : 'none';
        if (parts.length) tubeInfoEl.textContent = 'tube: ' + parts.join(' · ');
      } else {
        tubeInfoEl.style.display = 'none';
      }
      // ease the roll toward closed; ~.7s time constant reads as the
      // ground curling up rather than snapping
      if (tubeOn && !tubePending && curl !== curlTarget) {
        curl += (curlTarget - curl) * (1 - Math.exp(-dt / 700));
        if (Math.abs(curlTarget - curl) < 0.001) curl = curlTarget;
        view.setTubeCurl(curl);
      }
      const p = view.getPose();
      // in tube mode the marker shows the camera in unrolled tube
      // coordinates — the spot on the rect whose imagery is wrapped around
      // the camera — rather than the now-meaningless ecef point under it
      const tp = tubeOn ? view.getTubePose() : null;
      const m = tp || p;
      setMarkerHeading(m.heading);
      if (Math.abs(m.lat - lastSynced.lat) > 1e-7 || Math.abs(m.lon - lastSynced.lon) > 1e-7) {
        lastSynced = { lat: m.lat, lon: m.lon };
        marker.setLngLat([m.lon, m.lat]);
      }
      // runs every frame (not just on movement) so the ease finishes
      // converging even after the camera stops; paused while the pointer is
      // down on the map so drag gestures aren't cancelled mid-flight
      if (following && !mapPointerDown) followMarker({ lat: m.lat, lng: m.lon }, dt);
      if (pickDebug) updatePickDebug();

      // point-pair alignment: run the solver (a few steps a frame, so the
      // camera visibly settles onto the fit instead of snapping to it), then
      // redraw the pair markers against wherever the camera ended up
      if (document.body.classList.contains('align')) {
        if (solving) {
          for (let i = 0; i < 4 && solving; i++) if (solveStep()) stopSolve();
        }
        updateStatus(updateMarkers());
      }

      saveTimer += dt;
      if (saveTimer > 1000) {
        saveTimer = 0;
        saveView();
      }
    }
    frameCount++;
    // a capture has to read the canvas in the same task that drew it: the
    // context is created without preserveDrawingBuffer, so the backbuffer is
    // undefined once the browser composites the frame
    if (pendingShot) {
      const resolve = pendingShot;
      pendingShot = null;
      resolve(canvas.toDataURL('image/png'));
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  // --- headless capture api -------------------------------------------------
  // the driver (tools/capture.mjs) talks to the page through this. kept out of
  // the TEST guard so it's also usable by hand from the devtools console
  window.__test = {
    stats: () => view.ready() ? view.getStats() : null,
    drawnNodes: () => view.ready() ? view.getDrawnNodes() : [],
    frameCount: () => frameCount,
    // shimmer measurement (tools/shimmer.mjs) drives these: toggle the texture
    // filtering, then move the camera a fixed sub-degree amount and see how
    // much the image churns
    setMipmaps: (on) => { mipmaps = on; view.setMipmaps(on); updateHint(); },
    nudgeHeading: (deg) => {
      const p = view.getPose();
      view.setPose(p.lat, p.lon, p.alt, p.heading + deg, p.tilt);
    },
    // resolves with a png data url, captured at the end of the next frame
    shot: () => new Promise((resolve) => { pendingShot = resolve; }),
    // for tools/shimmer.mjs: flip texture filtering, and move the camera by a
    // fixed amount so the churn a small motion causes can be scored
    setMipmaps: (on) => { mipmaps = on; view.setMipmaps(on); updateHint(); },
    nudgeHeading: (deg) => {
      const p = view.getPose();
      view.setPose(p.lat, p.lon, p.alt, p.heading + deg, p.tilt);
    },
    // settle until the scene reports itself fully loaded for `stable`
    // consecutive frames, or `timeoutMs` elapses. sceneComplete alone is not
    // enough to wait on: a download that keeps failing resets its node to a
    // stub rather than to a failed state (see rocktree_types.h
    // setFailedDownloading), so it is retried forever and the flag can stay
    // false indefinitely. the timeout is therefore load-bearing, and the
    // caller is told which way it ended rather than it being papered over
    settle: async ({ timeoutMs = 120000, stable = 5 } = {}) => {
      const t0 = performance.now();
      let run = 0;
      for (;;) {
        await new Promise((r) => requestAnimationFrame(r));
        const st = view.ready() ? view.getStats() : null;
        run = st && st.sceneComplete ? run + 1 : 0;
        if (run >= stable) return { complete: true, ms: performance.now() - t0, stats: st };
        if (performance.now() - t0 > timeoutMs)
          return { complete: false, ms: performance.now() - t0, stats: st };
      }
    },
  };
})();
</script>
