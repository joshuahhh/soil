<script>
(async () => {
  // --- indexeddb byte cache -------------------------------------------------
  // 'tiles' holds downloaded rocktree bytes, 'tilemeta' their size and last
  // use (see the lru below), and 'app' holds page state too big for
  // localstorage (the reference photo's blob, the dropped gpx)
  // nothing here is allowed to hold up the page. opening this can take
  // arbitrarily long — a version upgrade waits for every other tab still
  // holding the old connection, and the one below has several gigabytes to
  // clear — and the whole app used to sit behind that await, which shows up
  // as two blank panes and an empty console. so the connection arrives when
  // it arrives: until then every helper below sees a null db, fails its
  // try/catch, and the page runs straight off the network
  let db = null;
  const dbOpen = new Promise((res) => {
    // an open that neither succeeds nor fails is a real state (a blocked
    // upgrade, an origin whose storage is wedged) and it used to be a silent
    // one. the page runs regardless now, so this is a diagnosis, not a bail
    let settled = false;
    setTimeout(() => {
      if (settled) return;
      console.warn('idb: open has been pending for 8s — no cache, and nothing'
        + ' the page stores will persist. if this sticks, clear this site\'s'
        + ' storage (the origin may be out of quota) and reload');
      if (navigator.storage && navigator.storage.estimate)
        navigator.storage.estimate().then((e) => console.warn(
          `idb: origin is using ${Math.round((e.usage || 0) / 1e6)} MB`
          + ` of ${Math.round((e.quota || 0) / 1e6)} MB`));
    }, 8000);
    try {
      const r = indexedDB.open('earth-cache', 3);
      r.onupgradeneeded = (e) => {
        const d = r.result;
        if (!d.objectStoreNames.contains('tiles')) d.createObjectStore('tiles');
        if (!d.objectStoreNames.contains('app')) d.createObjectStore('app');
        if (!d.objectStoreNames.contains('tilemeta')) d.createObjectStore('tilemeta');
        // tiles from before this version have no bookkeeping and no knowable
        // size, so the budget can't see them and they have to go. that does
        // NOT happen here: clearing several gigabytes inside a versionchange
        // transaction holds the whole open() until it finishes, which on a
        // full cache is minutes of a page that cannot start and says nothing.
        // purgeUnbookkept below does it in the background instead
      };
      // another tab still has the old version open: it has to let go before
      // this upgrade can run, and until it does nothing happens at all
      r.onblocked = () => console.warn('idb: the upgrade is blocked by another'
        + ' tab with this page open — close it. running without the cache meanwhile');
      r.onsuccess = () => {
        settled = true;
        const d = r.result;
        // and be the tab that lets go, next time it is someone else's upgrade
        d.onversionchange = () => { db = null; d.close(); };
        db = d;
        res(d);
      };
      r.onerror = () => {
        settled = true;
        console.warn('idb: open failed', r.error);
        res(null);
      };
    } catch (e) { settled = true; console.warn('idb: open threw', e); res(null); }
  });
  const idbGet = (key, store = 'tiles') => new Promise((res) => {
    try {
      const t = db.transaction(store).objectStore(store).get(key);
      t.onsuccess = () => res(t.result);
      t.onerror = () => res(undefined);
    } catch (e) { res(undefined); }
  });
  const idbPut = (key, bytes, store = 'tiles') => {
    try { db.transaction(store, 'readwrite').objectStore(store).put(bytes, key); } catch (e) {}
  };
  // the same write, but reporting whether it actually landed. the fire-and-
  // forget version above is right for tiles (a lost tile is re-fetched next
  // frame and nobody is worse off) and wrong for the files the page restores
  // itself from: a put that fails silently leaves the *previous* file in the
  // store, so the next reload comes back to it and the page looks like it
  // ignored you rather than like it hit an error. note the try/catch alone
  // can't see this — a rejected request and an aborted transaction are
  // events, not throws. quota is the usual reason, and the tile cache in
  // this same origin is what eats it, so failures say where storage stands
  const idbPutChecked = (key, value, store = 'app') => new Promise((res) => {
    const fail = (why, err) => {
      console.warn(`idb: ${why} storing '${key}'`, err || '');
      if (navigator.storage && navigator.storage.estimate)
        navigator.storage.estimate().then((e) => console.warn(
          `idb: origin is using ${Math.round((e.usage || 0) / 1e6)} MB`
          + ` of ${Math.round((e.quota || 0) / 1e6)} MB`));
      res(false);
    };
    if (!db) {
      console.warn(`idb: no database open, '${key}' not saved`);
      res(false);
      return;
    }
    try {
      const tx = db.transaction(store, 'readwrite');
      const rq = tx.objectStore(store).put(value, key);
      rq.onerror = () => fail('put failed', rq.error);
      tx.onabort = () => fail('transaction aborted', tx.error);
      tx.oncomplete = () => res(true);
    } catch (e) { fail('put threw', e); }
  });
  const idbDel = (key, store = 'tiles') => {
    try { db.transaction(store, 'readwrite').objectStore(store).delete(key); } catch (e) {}
  };

  // --- tile cache lru -------------------------------------------------------
  // an unbounded tile cache eventually eats the origin's whole quota (firefox
  // caps a group at 10 GiB), and then *every* write fails — including the
  // dropped gpx and the reference photo, which share this database. that
  // shows up as the page quietly restoring the file before last, which is a
  // miserable thing to debug. so the tiles get a byte budget and the oldest
  // go first.
  //
  // the bookkeeping is one small record per tile rather than a scan: sizes
  // can't be read back from indexeddb without reading the values themselves,
  // which is the thing being avoided. it is held in memory for the session
  // and mirrored to 'tilemeta' so the next session starts knowing the size of
  // the cache rather than having to measure it.
  // a quarter of what the browser offers, held between 512 MiB and 4 GiB.
  // measured rather than guessed: a tile averages about 4 KB, so even the
  // floor is a hundred thousand of them, and past the ceiling the extra hits
  // are places you flew over months ago. what it does NOT do is reason about
  // how full the storage already is — see sizeTileBudget
  const TILE_BUDGET_SHARE = 0.25;
  const TILE_BUDGET_MIN = 512 * 1024 * 1024;
  const TILE_BUDGET_MAX = 4 * 1024 * 1024 * 1024;
  let tileBudget = TILE_BUDGET_MIN; // until the estimate comes back
  const TILE_LOW_WATER = 0.85;   // an eviction pass clears down to this much
  const TILE_TOUCH_MS = 300000;  // rewrite a tile's last-use at most this often
  const tileMeta = new Map();    // path -> { n: bytes, t: last use, w: last written }
  let tileBytes = 0, evicting = false, quotaWarned = false, purging = false;

  // pick up where the last session left off, so the budget spans sessions
  // instead of resetting to zero on every reload. deliberately not awaited:
  // until it lands the cache simply looks empty, which costs an eviction pass
  // that runs a little late, not correctness
  dbOpen.then((d) => {
    if (!d) return;
    try {
      const tx = d.transaction('tilemeta');
      const st = tx.objectStore('tilemeta');
      const keys = st.getAllKeys(), vals = st.getAll();
      tx.oncomplete = () => {
        const k = keys.result || [], v = vals.result || [];
        for (let i = 0; i < k.length; i++) {
          if (!v[i] || !(v[i].n > 0)) continue;
          tileMeta.set(k[i], { n: v[i].n, t: v[i].t || 0, w: v[i].t || 0 });
          tileBytes += v[i].n;
        }
        // what the store holds against what the bookkeeping knows about: the
        // gap is the leftovers, and seeing it stated is the difference
        // between "there was nothing to purge" and "the purge did nothing"
        try {
          const cq = d.transaction('tiles').objectStore('tiles').count();
          cq.onsuccess = () => console.log(`tile cache: ${cq.result} tiles in the store,`
            + ` ${tileMeta.size} of them accounted for (${Math.round(tileBytes / 1e6)} MB)`);
        } catch (e) {}
        // deliberately no sizeTileBudget() here: until the purge below has
        // run, the origin's usage is mostly tiles this bookkeeping cannot see,
        // and subtracting them as "someone else's" collapses the budget to
        // its floor. the provisional value stands until the truth is known
        purgeUnbookkept();
      };
    } catch (e) {}
  });

  // oldest-first until the cache is back under the low-water mark. one sort
  // per pass, and a pass only comes round again once the cache has grown all
  // the way back to the budget, so the cost is amortised into nothing.
  // `hard` is the quota-error path: the accounting says there is room but the
  // browser disagrees, and the browser is the one that counts
  const evictTiles = async (hard) => {
    if (evicting || !db) return;
    evicting = true;
    try {
      let target = tileBudget * TILE_LOW_WATER;
      if (hard) target = Math.min(target, tileBytes * 0.7);
      if (tileBytes <= target) return;
      const oldest = [...tileMeta.entries()].sort((a, b) => a[1].t - b[1].t);
      const doomed = [];
      let freed = 0;
      for (const [path, m] of oldest) {
        if (tileBytes - freed <= target) break;
        doomed.push(path);
        freed += m.n;
      }
      if (!doomed.length) return;
      await new Promise((res) => {
        try {
          const tx = db.transaction(['tiles', 'tilemeta'], 'readwrite');
          const tiles = tx.objectStore('tiles'), meta = tx.objectStore('tilemeta');
          for (const p of doomed) { tiles.delete(p); meta.delete(p); }
          tx.oncomplete = tx.onabort = () => res();
        } catch (e) { res(); }
      });
      for (const p of doomed) tileMeta.delete(p);
      tileBytes -= freed;
      console.log(`tile cache: evicted ${doomed.length} tiles (${Math.round(freed / 1e6)} MB),`
        + ` now ${Math.round(tileBytes / 1e6)} MB`);
    } finally { evicting = false; }
  };

  // a tile was just read or written: it is the most recently used one now.
  // the mirror write is rate-limited — an exact last-use is worth nothing
  // here, and one small write per cache hit would cost more than the eviction
  // order it buys
  const noteTileUse = (path, n) => {
    const now = Date.now();
    const m = tileMeta.get(path);
    if (m) {
      if (m.n !== n) { tileBytes += n - m.n; m.n = n; }
      m.t = now;
      if (now - m.w < TILE_TOUCH_MS) return;
      m.w = now;
    } else {
      tileMeta.set(path, { n, t: now, w: now });
      tileBytes += n;
    }
    idbPut(path, { n, t: now }, 'tilemeta');
  };

  // delete the tiles the bookkeeping doesn't know about — everything written
  // before the budget existed. a key cursor in chunks, with a gap between
  // transactions, so several gigabytes go away without the page noticing;
  // interrupting it just means the next session picks up where this stopped.
  // a tile cached *during* the purge is spared as soon as its meta record
  // lands, and in the sliver before that it can be deleted again — which
  // costs one re-download and nothing else
  const purgeUnbookkept = async () => {
    if (!db) return;
    const CHUNK = 2000;
    let after = null, gone = 0, said = false;
    purging = true;
    for (;;) {
      const keys = await new Promise((res) => {
        try {
          // undefined, never null: null is an invalid key range and throws
          // DataError, which a swallowed catch turns into "nothing to purge"
          const range = after === null ? undefined : IDBKeyRange.lowerBound(after, true);
          const rq = db.transaction('tiles').objectStore('tiles').getAllKeys(range, CHUNK);
          rq.onsuccess = () => res(rq.result || []);
          rq.onerror = () => { console.warn('tile purge: read failed', rq.error); res([]); };
        } catch (e) { console.warn('tile purge: read threw', e); res([]); }
      });
      if (!keys.length) break;
      after = keys[keys.length - 1];
      const doomed = keys.filter((k) => !tileMeta.has(k));
      if (doomed.length) {
        await new Promise((res) => {
          try {
            const tx = db.transaction('tiles', 'readwrite');
            const st = tx.objectStore('tiles');
            for (const k of doomed) st.delete(k);
            tx.oncomplete = () => res();
            tx.onabort = () => { console.warn('tile purge: delete aborted', tx.error); res(); };
          } catch (e) { console.warn('tile purge: delete threw', e); res(); }
        });
        gone += doomed.length;
        // this can run for minutes on a cache that filled the origin, and a
        // silent minutes-long background job is indistinguishable from a
        // broken one, so it says what it is doing
        if (!said) {
          said = true;
          console.log('tile cache: clearing tiles left over from before the budget…');
        } else if (gone % 20000 < CHUNK) {
          console.log(`tile cache: ${gone} leftover tiles cleared so far…`);
        }
      }
      await new Promise((r) => setTimeout(r, 30)); // let the frame loop breathe
    }
    purging = false;
    if (gone) console.log(`tile cache: cleared ${gone} leftover tiles`);
    // only now is the origin's usage a fair description of what is actually
    // there, so this is where the budget can be sized honestly
    sizeTileBudget();
  };

  // the tile write, with the accounting and the quota escape hatch attached
  const putTile = (path, bytes) => {
    if (!db) return;
    try {
      const tx = db.transaction('tiles', 'readwrite');
      tx.objectStore('tiles').put(bytes, path);
      tx.oncomplete = () => {
        noteTileUse(path, bytes.length);
        if (tileBytes > tileBudget) evictTiles(false);
      };
      tx.onabort = () => {
        if (!quotaWarned) {
          quotaWarned = true;
          console.warn('tile write failed (quota?)', tx.error || '');
        }
        // while the purge is running, the room is already on its way: evicting
        // here would throw away the newly cached tiles — the only ones the
        // bookkeeping can see — to make space the purge is about to free
        if (!purging) evictTiles(true);
      };
    } catch (e) {}
  };

  const clearTiles = () => new Promise((res) => {
    if (!db) { res(false); return; }
    try {
      const tx = db.transaction(['tiles', 'tilemeta'], 'readwrite');
      tx.objectStore('tiles').clear();
      tx.objectStore('tilemeta').clear();
      tx.oncomplete = () => {
        tileMeta.clear();
        tileBytes = 0;
        console.log('tile cache cleared; tiles will re-download as you fly');
        res(true);
      };
      tx.onabort = () => { console.warn('tile cache clear aborted', tx.error); res(false); };
    } catch (e) { console.warn('tile cache clear threw', e); res(false); }
  });

  // the budget is a share of the quota, and deliberately ignores `usage`.
  // firefox pools storage by group rather than by origin — every localhost
  // port reports the same usage — so on a dev machine `usage` describes
  // whatever else that browser profile has stored under this host, which is
  // nothing this page can see, evict, or reason about. subtracting it once
  // pinned this cache to its floor because an unrelated project was sitting
  // on ten gigabytes. the quota is still worth reading: it is what the
  // browser is willing to offer at all
  function sizeTileBudget() {
    if (!navigator.storage || !navigator.storage.estimate) return;
    navigator.storage.estimate().then((e) => {
      if (!e.quota) return;
      tileBudget = Math.min(TILE_BUDGET_MAX,
        Math.max(TILE_BUDGET_MIN, e.quota * TILE_BUDGET_SHARE));
      const mb = (b) => Math.round(b / 1e6) + ' MB';
      console.log(`tile cache: ${mb(tileBytes)} in ${tileMeta.size} tiles,`
        + ` budget ${mb(tileBudget)} of a ${mb(e.quota)} quota`
        + ` (${mb(e.usage || 0)} used across everything stored under this host)`);
      if ((e.usage || 0) > e.quota * 0.9)
        console.warn('idb: this host is near its storage limit, so writes may fail —'
          + ' and by the numbers above, most of that is not this page');
      if (tileBytes > tileBudget) evictTiles(false);
    });
  }

  // --- module + view --------------------------------------------------------
  const Module = await createEarthModule();

  // the fetch hook: the renderer asks for a path, we answer with bytes.
  // planetoid metadata ('P...') is not cached, matching the native client
  const stats = window.__stats = {
    issued: 0, delivered: 0, failed: 0, inflight: 0,
    idbHits: 0, netHits: 0, maxMs: 0, log: [],
    // the same counts split by what was asked for, with the two waits kept
    // apart: the cache lookup and the network. the engine schedules bulks and
    // nodes separately and a bulk gates a whole subtree, so when a deep zoom
    // is slow the question is which of these two queues a bulk is sitting in
    kinds: {},
  };
  // 'B' bulk metadata, 'N' node data, 'P' the planetoid header
  const statKind = (path) => {
    const k = stats.kinds[path[0]] || (stats.kinds[path[0]] = {
      n: 0, idb: 0, net: 0, fail: 0, inflight: 0, idbMs: 0, netMs: 0, maxMs: 0 });
    return k;
  };
  const fetchTile = async (path, id) => {
    const t0 = performance.now();
    stats.issued++;
    stats.inflight++;
    const k = statKind(path);
    k.n++;
    k.inflight++;
    try {
      let bytes = path[0] !== 'P' ? await idbGet(path) : undefined;
      k.idbMs += performance.now() - t0;
      // a hit is a use: it moves the tile to the young end of the lru, and
      // re-registers one whose bookkeeping went missing (a meta write that
      // failed, or a store carried over from before the budget existed)
      if (bytes) { stats.idbHits++; k.idb++; noteTileUse(path, bytes.length); }
      if (!bytes) {
        const t1 = performance.now();
        const resp = await fetch('https://kh.google.com/rt/earth/' + path);
        if (!resp.ok) throw new Error('http ' + resp.status);
        bytes = new Uint8Array(await resp.arrayBuffer());
        k.netMs += performance.now() - t1;
        stats.netHits++;
        k.net++;
        if (path[0] !== 'P') putTile(path, bytes);
      }
      stats.delivered++;
      Module.deliverFetch(id, true, bytes);
    } catch (e) {
      stats.failed++;
      k.fail++;
      stats.log.push(path + ' -> ' + e.message);
      Module.deliverFetch(id, false, null);
    } finally {
      stats.inflight--;
      k.inflight--;
      const ms = performance.now() - t0;
      stats.maxMs = Math.max(stats.maxMs, ms);
      k.maxMs = Math.max(k.maxMs, ms);
    }
  };
  // alongside the engine's own 2s line, so the two can be read together.
  // ?fetchlog=0 turns it off
  if (new URLSearchParams(location.search).get('fetchlog') !== '0') setInterval(() => {
    const parts = [];
    for (const [kind, k] of Object.entries(stats.kinds)) {
      if (!k.n) continue;
      const avg = (ms, n) => n ? Math.round(ms / n) : 0;
      parts.push(`${kind}: ${k.n} (${k.idb} cached, ${k.net} net, ${k.fail} failed)`
        + ` idb ${avg(k.idbMs, k.n)}ms net ${avg(k.netMs, k.net)}ms`
        + ` max ${Math.round(k.maxMs)}ms inflight ${k.inflight}`);
      k.maxMs = 0; // a running max says nothing after the first stall
    }
    if (parts.length) console.log('fetch · ' + parts.join(' · '));
  }, 2000);

  const canvas = document.getElementById('globe');
  // the reference-overlay section installs its relayout here. deliberately
  // var: resize() runs (and setFull3d can call it) long before that section
  // is evaluated, and reading a let/const from its dead zone would throw
  var afterResize = null;
  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    // the overlay is placed in viewport-relative terms, so it follows
    // window resizes and the map pane collapsing/expanding
    if (afterResize) afterResize();
  };
  resize();
  addEventListener('resize', resize);

  const QS = new URLSearchParams(location.search);
  if (QS.has('jpg')) Module.forceJpgTextures();
  // multisampling is on by default: mipmaps only fix texture minification,
  // while the crawl on distant building silhouettes is geometric aliasing,
  // which needs this instead. ?msaa=0 opts out (for a slow gpu, or to A/B it).
  // context attribute, so it can't be a live key toggle like M
  if (QS.has('msaa')) Module.setAntialias(QS.get('msaa') !== '0');
  // per-tile decode timing on the console; a line per node, so off unless asked
  if (QS.has('timing')) Module.setLogTiming(QS.get('timing') !== '0');
  // headless capture mode (?test=1&lat=..&lon=..&alt=..&heading=..&tilt=..&fov=..):
  // the pose comes from the url instead of localstorage, nothing is saved back,
  // the 3d view takes the whole window so the canvas size is just the viewport,
  // and the frame step is a fixed dt. that last one doesn't make a run bit-exact
  // — tile arrival is still wall-clock — but it does stop the eviction sweep and
  // every animation ease from depending on the machine's frame rate.
  // window.__test below is the driver's api
  const TEST = QS.has('test') ? {
    dt: Number(QS.get('dt')) || 1000 / 60,
    pose: ['lat', 'lon', 'alt', 'heading', 'tilt', 'fov'].reduce((o, k) => {
      if (QS.has(k)) o[k] = Number(QS.get(k));
      return o;
    }, {
      // flags, not numbers, so they take the same route but parse differently
      ortho: QS.get('ortho') === '1',
      hug: QS.get('hug') === '1',
    }),
  } : null;
  const view = Module.createView('#globe', fetchTile);

  // view state (camera pose, fov, speed gain, map zoom) persists in
  // localstorage so a reload puts you back where you were
  // the seattle skyline from out on elliott bay
  const DEFAULT_VIEW = { lat: 47.5980, lon: -122.3750, alt: 800, heading: 65, tilt: -12, fov: 45, zoom: 12, gain: 1, ortho: false, miniature: false, tube: null, full3d: false };
  const START = (() => {
    // test mode ignores saved state entirely: a capture must not depend on
    // whatever pose the last interactive session happened to leave behind
    if (TEST) return { ...DEFAULT_VIEW, ...TEST.pose, full3d: true };
    try {
      const v = JSON.parse(localStorage.getItem('earth-view'));
      if (v && Number.isFinite(v.lat) && Number.isFinite(v.lon) && Number.isFinite(v.alt))
        return { ...DEFAULT_VIEW, ...v };
    } catch (e) {}
    return DEFAULT_VIEW;
  })();
  // set once a pasted session has been written to storage, and never cleared.
  // from that moment what's in storage describes a session this page is not
  // showing, and every saver below would be writing the one it's replacing
  // over it. the view saver is the one that actually bites: it runs both on
  // beforeunload — which the reload after a paste fires itself — and once a
  // second off the frame loop, so leaving it live loses the pasted pose
  // always, or intermittently, depending on which one gets there first
  let storageFrozen = false;
  const saveView = () => {
    if (TEST) return; // captures never write back over the user's saved view
    if (storageFrozen) return;
    if (!view.ready()) return;
    const p = view.getPose();
    try {
      localStorage.setItem('earth-view', JSON.stringify({
        lat: p.lat, lon: p.lon, alt: p.alt, heading: p.heading, tilt: p.tilt,
        roll: p.roll, fov: p.fov, zoom: map.getZoom(), gain, ortho, hug, miniature, full3d,
        nearCut: view.getNearCut(),
        tube: tubeRect ? { rect: tubeRect, on: tubeOn, ewAxis: tubeAxisEw, body: tubeBody } : null,
        tunnel: { on: tunnelOn && !tunnelClosing, c: tunnelC, across: tunnelAcross, lag: tunnelLag },
      }));
    } catch (e) {}
  };
  addEventListener('beforeunload', saveView);

  // --- maplibre -------------------------------------------------------------
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [START.lon, START.lat],
    zoom: START.zoom,
    dragRotate: false, // keep the map north-up
    pitchWithRotate: false,
  });
  map.touchZoomRotate.disableRotation();
  map.keyboard.disable(); // arrows belong to the flight canvas
  // camera marker: a dot with a view cone that rotates with the heading.
  // pointer-events none so clicks pass through to the map (teleport)
  const markerEl = document.createElement('div');
  markerEl.style.pointerEvents = 'none';
  markerEl.innerHTML =
    '<svg id="camIcon" width="44" height="44" viewBox="-22 -22 44 44" style="display:block">' +
    '<path d="M0,-3 L-13,-19 A21,21 0 0 1 13,-19 Z" fill="rgba(66,133,244,.4)"/>' +
    '<circle r="5.5" fill="#4285f4" stroke="#fff" stroke-width="2.5"/></svg>';
  const marker = new maplibregl.Marker({ element: markerEl })
    .setLngLat([START.lon, START.lat]).addTo(map);
  const setMarkerHeading = (deg) => {
    const el = document.getElementById('camIcon');
    if (el) el.style.transform = `rotate(${deg}deg)`;
  };

  // expand the 3d view to the whole window: the arrow on the middle divider
  // collapses the map pane; the divider stays at the left edge and its arrow
  // flips to bring the map back. sticky across reloads via the saved view
  const expandBtn = document.getElementById('expandbtn');
  const dividerEl = document.getElementById('divider');
  let full3d = false;
  const setFull3d = (on) => {
    full3d = on;
    document.body.classList.toggle('full3d', on);
    expandBtn.textContent = on ? '▶' : '◀';
    expandBtn.title = on ? 'show map' : 'expand 3d view';
    resize(); // the canvas backing store tracks its new client size
    if (!on) map.resize();
  };
  // the whole strip is the target, not just the arrow (the arrow is only the
  // affordance); the button's own click bubbles up to here
  dividerEl.addEventListener('click', () => {
    setFull3d(!full3d);
    canvas.focus(); // keep flight keys live (and space off the button)
  });
  if (START.full3d) setFull3d(true);

  // pick debug (C to toggle): a reticle at the exact center of the 3d view,
  // an orange dot on the map at what the center raycast hit (the orbit
  // pivot), and a readout of the hit distance/altitude and whether it came
  // from terrain triangles or the sea-level sphere fallback. if the orbit
  // pivot looks wrong on screen, the orange dot shows where it actually is
  let pickDebug = false;
  const pickEl = document.createElement('div');
  pickEl.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#ff7f0e;' +
    'border:2.5px solid #fff;pointer-events:none;';
  const pickMarker = new maplibregl.Marker({ element: pickEl });
  let pickMarkerOn = false;
  const setPickDebug = (on) => {
    pickDebug = on;
    document.getElementById('cross').style.display = on ? '' : 'none';
    document.getElementById('pickinfo').style.display = on ? '' : 'none';
    if (!on && pickMarkerOn) { pickMarker.remove(); pickMarkerOn = false; }
  };
  const updatePickDebug = () => {
    const pick = view.pickCenter();
    if (pick) {
      // position before addTo: a marker on the map without a position throws
      // from maplibre's own update events (e.g. when the style loads)
      pickMarker.setLngLat([pick.lon, pick.lat]);
      if (!pickMarkerOn) { pickMarker.addTo(map); pickMarkerOn = true; }
      document.getElementById('pickinfo').textContent =
        `pick: ${pick.src} · dist ${Math.round(pick.dist)}m · alt ${Math.round(pick.alt)}m`;
    } else {
      if (pickMarkerOn) { pickMarker.remove(); pickMarkerOn = false; }
      document.getElementById('pickinfo').textContent = 'pick: miss';
    }
  };
  setPickDebug(pickDebug);

  // --- reference image overlay ----------------------------------------------
  // drop an image file anywhere on the page and it lays over the 3d view, so
  // you can steer the camera until the render lines up with the photo. the
  // slider blends it against the render; the ✕ in the corner removes it.
  // the file never leaves the browser, but it is kept (in indexeddb, next to
  // the tile cache) so a reload comes back to the same photo — the point pairs
  // hanging off it would be meaningless without it
  const rightEl = document.getElementById('right');
  const overlayImg = document.getElementById('overlay');
  const overlayBlend = document.getElementById('overlayblend');
  let overlayUrl = null;
  // where the photo sits over the viewport. scale is its height as a fraction
  // of the viewport's, cx/cy its center as a fraction of the viewport — all
  // relative, so a window resize rescales the photo with the frustum instead
  // of sliding the picture through it
  // k is the lens: a division-model distortion about the photo's centre,
  // negative for barrel. it belongs to the photo, so it lives here with the
  // photo's placement rather than in the camera pose
  let ov = { scale: 1, cx: 0.5, cy: 0.5, k: 0 };
  // how far the photo can be blown up: 16x the viewport height is enough to
  // put a window frame or a roof ridge under the pointer when placing a pair,
  // which is what the big end is for. the slider's own units are log across
  // that range — linear, it would spend four fifths of its track above 4x and
  // leave the small end unadjustable
  const SCALE_MIN = 0.05, SCALE_MAX = 16;
  const clampScale = (s) => Math.max(SCALE_MIN, Math.min(SCALE_MAX, s));
  const applyOverlayBlend = () => {
    overlayImg.style.opacity = overlayBlend.value / 100;
    warpEl.style.opacity = overlayBlend.value / 100;
  };
  // the photo's box in viewport pixels; null until the image has decoded
  const overlayBox = () => {
    if (!overlayImg.naturalWidth || !overlayImg.naturalHeight) return null;
    const W = rightEl.clientWidth, H = rightEl.clientHeight;
    const h = ov.scale * H, w = h * overlayImg.naturalWidth / overlayImg.naturalHeight;
    return { x: ov.cx * W - w / 2, y: ov.cy * H - h / 2, w, h };
  };
  const layoutOverlay = () => {
    const b = overlayBox();
    if (!b) return;
    overlayImg.style.left = b.x + 'px';
    overlayImg.style.top = b.y + 'px';
    overlayImg.style.width = b.w + 'px';
    overlayImg.style.height = b.h + 'px';
    // the warp canvas is the box grown by its margin: m in total, half a
    // side each way, matching the ±(1+m) span it is drawn over
    const m = warpMargin;
    warpEl.style.left = (b.x - b.w * m / 2) + 'px';
    warpEl.style.top = (b.y - b.h * m / 2) + 'px';
    warpEl.style.width = b.w * (1 + m) + 'px';
    warpEl.style.height = b.h * (1 + m) + 'px';
  };
  // photo coordinates (0..1 across the image) <-> viewport pixels. pairs are
  // stored in photo coordinates so moving or resizing the photo carries them.
  // these two are the box only: the image as displayed, which is the photo
  // undistorted when k is set. a pair's own (u, v) are on the photo as
  // shot, so they go through undistortUV on the way out and distortUV on
  // the way in — a pair placed under one k stays on its feature under another
  const photoToView = (u, v) => {
    const b = overlayBox();
    return b ? { x: b.x + u * b.w, y: b.y + v * b.h } : null;
  };
  const viewToPhoto = (x, y) => {
    const b = overlayBox();
    return b ? { u: (x - b.x) / b.w, v: (y - b.y) / b.h } : null;
  };
  // the lens. division model (fitzgibbon): r_u = r_d / (1 + k r_d²), radii
  // from the centre with the photo's half-height as the unit, so k means the
  // same thing whatever the picture's pixel size. one parameter, invertible
  // in closed form (the inverse is a quadratic in r_d), and near-linear in k,
  // which is what makes it fit alongside fov. the centre of distortion is
  // taken to be the image centre — true of an uncropped photo
  const lensAspect = () => overlayImg.naturalWidth / overlayImg.naturalHeight;
  // how far k may go. the model folds at r = 1/√|k|. pincushion turns back
  // from there, so the photo's corner (r = √(a² + 1)) must stay inside, with
  // room. barrel sends that radius to infinity instead: past it the photo
  // has no place on screen, which the warp shows as blank and a pair there
  // as absent — so barrel may go until the fold reaches the half-width, and
  // only the corners are lost
  const lensLimits = () => {
    const a = overlayImg.naturalWidth ? lensAspect() : 1.5;
    return { barrel: -1 / (a * a), pincushion: 0.6 / (a * a + 1) };
  };
  const clampLens = (k) => {
    const l = lensLimits();
    return Math.max(l.barrel, Math.min(l.pincushion, Number(k) || 0));
  };
  // null past the fold: a point of the photo this barrel puts nowhere
  const undistortUV = (u, v, k) => {
    if (!k) return { u, v };
    const a = lensAspect();
    const X = (u - 0.5) * 2 * a, Y = (v - 0.5) * 2;
    const d = 1 + k * (X * X + Y * Y);
    if (d <= 1e-6) return null;
    const f = 1 / d;
    return { u: 0.5 + X * f / (2 * a), v: 0.5 + Y * f / 2 };
  };
  // null where the model has no answer: beyond 1/(4k) of pincushion, or a
  // barrel corner pushed out past where the inverse is real
  const distortUV = (u, v, k) => {
    if (!k) return { u, v };
    const a = lensAspect();
    const X = (u - 0.5) * 2 * a, Y = (v - 0.5) * 2;
    const ru = Math.hypot(X, Y);
    if (ru < 1e-9) return { u, v };
    const q = 4 * k * ru * ru;
    if (q > 1) return null;
    // (1 - sqrt(1 - q)) / (2 k r_u), with the series where the subtraction
    // would lose its digits
    const rd = Math.abs(q) < 1e-6 ? ru * (1 + k * ru * ru) : (1 - Math.sqrt(1 - q)) / (2 * k * ru);
    const sc = rd / ru;
    return { u: 0.5 + X * sc / (2 * a), v: 0.5 + Y * sc / 2 };
  };
  // where a photo point (as shot) shows on screen under lens k
  const photoToViewK = (u, v, k) => {
    const p = undistortUV(u, v, k);
    return p ? photoToView(p.u, p.v) : null;
  };

  // the undistorted photo, when k is set: the <img> can't be warped, so a
  // canvas is drawn in its place — a grid of cells over the undistorted
  // picture, each filled from the source through the affine that carries
  // its three corners. redrawn only when k changes, never per frame. barrel
  // pushes the corners outward, so the canvas is the box plus a margin for
  // them, capped: a strong lens sends a corner off to infinity
  const warpEl = document.getElementById('overlaywarp');
  let warpMargin = 0;
  const renderWarp = () => {
    const k = ov.k || 0;
    const on = !!k && overlayImg.naturalWidth > 0;
    document.body.classList.toggle('distorted', on);
    if (!on) return;
    const a = lensAspect();
    const rc = Math.hypot(a, 1); // the corner, as shot
    const ruc = rc / (1 + k * rc * rc);
    // the corner's outward push, as a fraction of the box; capped, and
    // doubled because it is spent half on each side
    warpMargin = k < 0 ? Math.min(1.0, 2 * Math.max(0, (ruc > 0 ? ruc / rc : 9) - 1)) : 0;
    const m = warpMargin;
    // canvas pixels: the photo's own, capped — it is a viewport-sized picture
    const natW = overlayImg.naturalWidth, natH = overlayImg.naturalHeight;
    const sc = Math.min(1, 2048 / natW);
    // the canvas spans ±a(1+m) by ±(1+m): the box grown by m in total,
    // half on each side. every size below has to use the same (1 + m), or
    // the picture is drawn at a different scale from the box the markers
    // are laid out in (it was: barrel was a fraction too big, and the
    // pairs slid off their features as k changed)
    const cw = Math.round(natW * sc * (1 + m)), ch = Math.round(natH * sc * (1 + m));
    warpEl.width = cw; warpEl.height = ch;
    const ctx = warpEl.getContext('2d');
    ctx.clearRect(0, 0, cw, ch);
    // undistorted normalised coords (X in ±a(1+m), Y in ±(1+m)) -> canvas px
    const toCanvas = (X, Y) => [(X / (2 * a * (1 + m)) + 0.5) * cw, (Y / (2 * (1 + m)) + 0.5) * ch];
    // canvas px -> photo px as shot, through the lens; null off the model
    const toSource = (X, Y) => {
      const ru = Math.hypot(X, Y);
      if (ru < 1e-9) return [natW / 2, natH / 2];
      const q = 4 * k * ru * ru;
      if (q > 1) return null;
      const rd = Math.abs(q) < 1e-6 ? ru * (1 + k * ru * ru) : (1 - Math.sqrt(1 - q)) / (2 * k * ru);
      const s = rd / ru;
      return [(X * s / (2 * a) + 0.5) * natW, (Y * s / 2 + 0.5) * natH];
    };
    const N = 36;
    const spanX = 2 * a * (1 + m), spanY = 2 * (1 + m);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const X0 = -a * (1 + m) + spanX * i / N, X1 = X0 + spanX / N;
      const Y0 = -(1 + m) + spanY * j / N, Y1 = Y0 + spanY / N;
      const s0 = toSource(X0, Y0), s1 = toSource(X1, Y0), s2 = toSource(X0, Y1);
      if (!s0 || !s1 || !s2) continue;
      // cells whose source lies wholly outside the photo have nothing to draw
      if (Math.max(s0[0], s1[0], s2[0]) < 0 || Math.min(s0[0], s1[0], s2[0]) > natW
        || Math.max(s0[1], s1[1], s2[1]) < 0 || Math.min(s0[1], s1[1], s2[1]) > natH) continue;
      const t0 = toCanvas(X0, Y0), t1 = toCanvas(X1, Y0), t2 = toCanvas(X0, Y1);
      // the affine with M s_i = t_i: M_lin = [t1-t0 t2-t0] [s1-s0 s2-s0]^-1
      const ax = s1[0] - s0[0], ay = s1[1] - s0[1], bx = s2[0] - s0[0], by = s2[1] - s0[1];
      const det = ax * by - ay * bx;
      if (Math.abs(det) < 1e-12) continue;
      const px = t1[0] - t0[0], py = t1[1] - t0[1], qx = t2[0] - t0[0], qy = t2[1] - t0[1];
      // [p q] · inv([a b]) with inv = [by -bx; -ay ax] / det
      const m11 = (px * by - qx * ay) / det, m12 = (-px * bx + qx * ax) / det;
      const m21 = (py * by - qy * ay) / det, m22 = (-py * bx + qy * ax) / det;
      const e = t0[0] - (m11 * s0[0] + m12 * s0[1]);
      const f = t0[1] - (m21 * s0[0] + m22 * s0[1]);
      ctx.save();
      ctx.beginPath();
      // a hair of overlap, or the cell seams show as a lattice of gaps
      ctx.rect(t0[0] - 0.5, t0[1] - 0.5, t1[0] - t0[0] + 1, t2[1] - t0[1] + 1);
      ctx.clip();
      ctx.setTransform(m11, m21, m12, m22, e, f);
      ctx.drawImage(overlayImg, 0, 0);
      ctx.restore();
    }
  };
  // ov.k, and everything that follows from it: the warp, its panel, the
  // markers (alignRefresh's per-frame pass moves those on its own)
  const lensAmountEl = document.getElementById('lensamount');
  const lensSlider = document.getElementById('lensk');
  const refreshLens = () => {
    const k = ov.k || 0;
    const lim = lensLimits();
    lensSlider.min = lim.barrel;
    lensSlider.max = lim.pincushion;
    lensSlider.value = k;
    // 'k' and the sign carry the number; the word is the reading of it
    lensAmountEl.textContent = !k ? 'k = 0 · none'
      : `k = ${k < 0 ? '−' : '+'}${Math.abs(k).toFixed(3)} · ${k < 0 ? 'barrel' : 'pincushion'}`;
  };
  const setLens = (k) => {
    k = clampLens(k);
    if (Math.abs(k) < 1e-4) k = 0;
    if (k === ov.k) return;
    ov.k = k;
    renderWarp();
    layoutOverlay();
    refreshLens();
  };
  lensSlider.addEventListener('input', () => { setLens(lensSlider.value); saveAlign(); });
  document.getElementById('lensreset').addEventListener('click', () => {
    setLens(0);
    saveAlign();
    canvas.focus();
  });
  // "fit": the largest scale that keeps the whole photo inside the viewport —
  // the old object-fit: contain behaviour, now just a preset
  const fitOverlay = () => {
    if (!overlayImg.naturalWidth) return;
    const W = rightEl.clientWidth, H = rightEl.clientHeight;
    ov.scale = Math.min(1, W / (H * (overlayImg.naturalWidth / overlayImg.naturalHeight)));
    ov.cx = ov.cy = 0.5;
    layoutOverlay();
  };
  afterResize = layoutOverlay; // see the declaration above the resize handler
  const setOverlay = (file, keepPlacement) => {
    if (overlayUrl) URL.revokeObjectURL(overlayUrl);
    overlayUrl = URL.createObjectURL(file);
    // the photo is only shown once it has decoded: its placement needs the
    // natural size, and revealing it before that flashes the image at full
    // resolution across the viewport
    overlayImg.onload = () => {
      if (!keepPlacement) { fitOverlay(); ov.k = 0; } // a new photo, a new lens
      renderWarp();
      refreshLens();
      layoutOverlay();
      document.body.classList.add('overlay');
      applyOverlayBlend();
      alignRefresh();
    };
    overlayImg.onerror = () => {
      overlayUrl = null;
      idbDel('ref-image', 'app');
    };
    overlayImg.src = overlayUrl;
    canvas.focus(); // the drop shouldn't cost you the flight keys
  };
  // the ✕ is the "get rid of it" button: the photo goes, and so do the point
  // pairs, which are anchored to points of that picture and mean nothing
  // without it. the panel's "clear pairs" is the narrower one
  const clearOverlay = () => {
    document.body.classList.remove('overlay');
    document.body.classList.remove('distorted');
    ov.k = 0;
    refreshLens();
    overlayImg.removeAttribute('src');
    if (overlayUrl) { URL.revokeObjectURL(overlayUrl); overlayUrl = null; }
    idbDel('ref-image', 'app');
    refImageKey = null;
    clearPairs();
    alignRefresh();
    saveAlign();
    canvas.focus();
  };
  overlayBlend.addEventListener('input', applyOverlayBlend);
  // a panel's head is its minimize switch: click anywhere on it (except its
  // other buttons, like ✕) and the panel shrinks to that line; the –/+ in
  // it says which way the next click goes
  for (const panel of document.querySelectorAll('.panel')) {
    const head = panel.querySelector('.head');
    const btn = document.createElement('button');
    btn.className = 'minbtn';
    btn.textContent = '–';
    head.insertBefore(btn, head.querySelector('button'));
    head.title = 'minimize';
    head.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b && b !== btn) return; // ✕ and friends do their own thing
      const min = panel.classList.toggle('min');
      btn.textContent = min ? '+' : '–';
      head.title = min ? 'expand' : 'minimize';
      canvas.focus();
    });
  }
  // the word "opacity" is a switch: full if the photo is faded at all, off if
  // it's full. quicker than dragging the slider end to end while comparing
  const toggleOverlayBlend = () => {
    if (!document.body.classList.contains('overlay')) return;
    overlayBlend.value = +overlayBlend.value >= 100 ? 0 : 100;
    applyOverlayBlend();
    saveAlign();
    canvas.focus();
  };
  document.getElementById('overlayblendtoggle').addEventListener('click', toggleOverlayBlend);
  // --- the key table (?) ----------------------------------------------------
  // what every key does *in the current mode* — a key that does nothing here
  // isn't listed, and one that does something different (arrows orbit in
  // ortho, look around in perspective) says what it does here. rebuilt by
  // updateHint on every mode switch
  const K = (t) => t.split(' ').map((k) => `<kbd>${k}</kbd>`).join(' ');
  const keysFor = () => {
    const mode = followOn ? 'follow' : tunnelOn ? 'tunnel' : tubeOn ? (tubeBody ? 'body' : 'tube') : ortho ? 'ortho' : 'persp';
    const g = [];
    if (mode === 'tunnel') g.push(['flying the tunnel', [
      [K('W A S D'), 'move'], [K('R F'), 'up / down'],
      [K('space') + ' +', 'move in the view frame instead'],
      [K('←↑↓→') + ' drag', 'look around'], [K('Z X') + ' wheel', 'zoom (fov)'],
      [K('- ='), 'speed'], [K('shift') + ' +', 'slow'],
      [K('G'), hug ? 'stop hugging the terrain' : 'hug the terrain'],
      [K('T') + ' ' + K('esc'), 'leave the tunnel']]]);
    if (mode === 'persp') g.push(['flying', [
      [K('W A S D'), 'move'], [K('R F'), 'up / down'],
      [K('space') + ' +', 'move in the view frame instead'],
      [K('←↑↓→') + ' drag', 'look around'], [K('Z X') + ' wheel', 'zoom (fov)'],
      [K('- ='), 'speed'], [K('shift') + ' +', 'slow'],
      [K('G'), hug ? 'stop hugging the terrain' : 'hug the terrain'], [K('0'), 'reset view']]]);
    if (mode === 'ortho') g.push(['moving', [
      [K('W A S D') + ' drag', 'pan'], [K('←↑↓→'), 'orbit around the center'],
      [K('Z X R F') + ' wheel', 'zoom'], [K('- ='), 'speed'], [K('shift') + ' +', 'slow'],
      [K('0'), 'reset view']]]);
    if (mode === 'tube') g.push(['flying the tube', [
      [K('W S'), 'thrust'], [K('A D'), 'strafe'], [K('R F'), 'up / down'],
      [K('←↑↓→') + ' drag', 'pitch + yaw'], [K('Q E'), 'roll'], [K('Z X') + ' wheel', 'zoom'],
      [K('- ='), 'speed'], [K('shift') + ' +', 'slow'],
      [K('G'), hug ? 'stop hugging the wall' : 'hug the wall'], [K('0'), 'reset view'],
      [K('T'), 'unroll the tube'], [K('B'), 'wrap it on the body instead'], [K('esc'), 'clear the tube']]]);
    if (mode === 'body') g.push(['flying around the body', [
      [K('W S'), 'thrust'], [K('A D'), 'strafe'], [K('R F'), 'up / down'],
      [K('←↑↓→') + ' drag', 'pitch + yaw'], [K('Q E'), 'roll'], [K('Z X') + ' wheel', 'zoom'],
      [K('- ='), 'speed'], [K('shift') + ' +', 'slow'], [K('0'), 'reset view'],
      [K('B'), 'unwrap'], [K('T'), 'roll it into a tube instead'], [K('esc'), 'clear the rect']]]);
    if (mode === 'follow') g.push(['following the path', [
      [K('W S'), 'run along it'], [K('←↑↓→'), 'swing the view around it'],
      [K('R F'), ortho ? 'zoom' : 'standoff'], [K('Z X'), 'zoom'], [K('shift') + ' +', 'slow'],
      [K('V') + ' ' + K('esc'), 'stop following']]]);
    const viewRows = [];
    if (mode !== 'tube' && mode !== 'body' && mode !== 'tunnel') viewRows.push([K('O'), ortho ? 'perspective' : 'orthographic']);
    if (mode === 'persp' && !tubeRect) viewRows.push([K('T'), 'tunnel']);
    viewRows.push([K('N'), miniature ? 'miniature off' : 'miniature (tilt-shift)']);
    if (!ortho) viewRows.push([K('H'), 'near cut']);
    viewRows.push([K('C L K M'), 'debug: pick · lod · smoothing · mipmaps']);
    g.push(['view', viewRows]);
    if (document.body.classList.contains('overlay')) {
      const rows = [[K('P'), 'photo on / off'], [K('shift') + ' drag', 'move the photo'],
        [K('shift') + ' wheel', 'size it about the pointer']];
      if (mode === 'persp') rows.push(['drag', 'either end of a pair, to adjust it'],
        [K('esc'), 'cancel adding a pair']);
      g.push(['photo', rows]);
    }
    const mapRows = [['click', 'teleport there'],
      [K('shift') + ' drag', tubeRect ? 'draw a new tube rect' : 'draw a tube rect']];
    if (mode !== 'tube' && tubeRect) mapRows.push([K('T'), 'roll the tube up']);
    if (mode !== 'body' && tubeRect) mapRows.push([K('B'), 'wrap it on a body']);
    if (mode !== 'tube' && mode !== 'body' && tubeRect) mapRows.push([K('esc'), 'clear the rect']);
    if (mode !== 'follow' && mode !== 'tube' && mode !== 'body' && document.body.classList.contains('path'))
      mapRows.push([K('V'), 'follow the path']);
    g.push(['map', mapRows]);
    g.push(['session', [[K('⌘C ⌘V'), 'copy / paste the whole session'],
      [K('⌘S'), 'save it as a file'],
      ['drop a file', 'image → photo · .gpx → path · .obj → body · session .json → restore'], [K('?'), 'this']]]);
    return g;
  };
  // the table is a pure function of the view's state, and that state changes
  // from a dozen places (a key, a drop, a rect on the map). rather than have
  // each of them remember to redraw it, the frame loop re-derives it a few
  // times a second while it is open and only touches the dom when the
  // result differs — poor man's react, at the cost of building a short
  // string every 250ms
  let keysHtml = '', keysAt = 0;
  const renderKeys = () => {
    const html = keysFor().map(([title, rows]) =>
      `<section><h4>${title}</h4><table>${rows.map(([k, what]) =>
        `<tr><td>${k}</td><td>${what}</td></tr>`).join('')}</table></section>`).join('');
    if (html === keysHtml) return;
    keysHtml = html;
    document.getElementById('keys').innerHTML = html;
  };
  const refreshKeys = (now) => {
    if (!document.body.classList.contains('keys') || now - keysAt < 250) return;
    keysAt = now;
    renderKeys();
  };
  const toggleKeys = () => {
    if (!document.body.classList.contains('keys')) renderKeys();
    document.body.classList.toggle('keys');
    canvas.focus();
  };
  document.getElementById('keysbtn').addEventListener('click', toggleKeys);
  // --- near cut (H) ---------------------------------------------------------
  // the slider is log across 0.5m..2km, with the bottom notch meaning off: a
  // window is a metre or two away and a courtyard wall fifty, and both need
  // to be settable on the same track
  const cutDist = document.getElementById('cutdist');
  const cutAmount = document.getElementById('cutamount');
  const CUT_MIN = 0.5, CUT_MAX = 2000;
  const cutFromSlider = (v) => v <= 0 ? 0
    : CUT_MIN * Math.pow(CUT_MAX / CUT_MIN, v / 1000);
  const sliderFromCut = (m) => m <= 0 ? 0
    : Math.round(1000 * Math.log(m / CUT_MIN) / Math.log(CUT_MAX / CUT_MIN));
  const showCut = () => {
    const m = view.getNearCut();
    cutDist.value = sliderFromCut(m);
    cutAmount.textContent = m <= 0 ? 'off' : m < 10 ? m.toFixed(1) + ' m'
      : Math.round(m) + ' m';
    document.body.classList.add('cut');
  };
  cutDist.addEventListener('input', () => {
    view.setNearCut(cutFromSlider(+cutDist.value));
    showCut();
  });
  cutDist.addEventListener('change', saveView);
  document.getElementById('cutoff').addEventListener('click', () => {
    view.setNearCut(0);
    document.body.classList.remove('cut');
    saveView();
    canvas.focus();
  });
  // H shows the panel (with whatever cut is set); H again hides the panel
  // but leaves the cut alone — ✕ is what turns it off
  const toggleCutPanel = () => {
    if (document.body.classList.contains('cut')) document.body.classList.remove('cut');
    else showCut();
  };
  // the ✕ that removes the photo lives in the panel head now, and is wired
  // where the rest of that panel is
  // dragover has to be cancelled or the browser navigates to the dropped file.
  // a depth counter keeps the highlight steady as the drag crosses children
  // (dragenter on a child fires before dragleave on its parent)
  let dragDepth = 0;
  // a drag only exposes item types, not names, and a .gpx usually arrives
  // with no type at all — so anything typeless is let through and sorted out
  // on the drop, where the filename is finally visible
  const isFileDrag = (e) => [...(e.dataTransfer ? e.dataTransfer.items : [])]
    .some((it) => it.kind === 'file'
      && (!it.type || it.type.startsWith('image/') || it.type.includes('xml')
        || it.type.includes('json')));
  addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    if (++dragDepth === 1) document.body.classList.add('dropping');
  });
  addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });
  addEventListener('dragleave', () => {
    if (dragDepth && --dragDepth === 0) document.body.classList.remove('dropping');
  });
  addEventListener('drop', (e) => {
    dragDepth = 0;
    document.body.classList.remove('dropping');
    const dropped = [...(e.dataTransfer ? e.dataTransfer.files : [])];
    // a track goes to the path overlay, everything else is a reference photo
    const gpx = dropped.find((f) => /\.gpx$/i.test(f.name));
    if (gpx) {
      e.preventDefault();
      loadGpxFile(gpx);
      return;
    }
    // a mesh replaces the figure the body mode wraps the rect onto
    const obj = dropped.find((f) => /\.obj$/i.test(f.name));
    if (obj) {
      e.preventDefault();
      obj.text().then((text) => {
        if (setBodyMesh(text)) toast(`body: ${obj.name}`);
        else toast('that .obj has no faces');
      });
      return;
    }
    // a session file (the thing ⌘S writes) is the drop-shaped twin of ⌘V
    const json = dropped.find((f) => /\.json$/i.test(f.name) || f.type.includes('json'));
    if (json) {
      e.preventDefault();
      json.text().then((text) => {
        if (!pasteState(text)) toast('that json is not a session file');
      });
      return;
    }
    const file = dropped.find((f) => f.type.startsWith('image/'));
    if (!file) return;
    e.preventDefault();
    // pairs are anchored to points of a particular photo, so a different
    // photo drops them — but re-dropping the same file (same name and size)
    // is a reload, not a new subject, and keeps them
    const key = file.name + ':' + file.size;
    const same = key === refImageKey;
    refImageKey = key;
    if (!same) {
      clearPairs();
      // a new subject starts fully visible: you look at the photo first and
      // fade it once you're lining the view up
      overlayBlend.value = 100;
      applyOverlayBlend();
    }
    setOverlay(file, same);
    idbPut('ref-image', file, 'app');
    saveAlign();
  });

  // --- keyboard -> built-in flying controls -----------------------------------
  // ground frame: WASD cruise/truck, Q/E pedestal. hold Space for the view
  // frame: W/S dolly along the view, Q/E boom along view-up. arrows pan/tilt
  // so no mouse is needed. Z/X zoom (fov). -/= sticky speed gain. shift slow.
  // the keys are the page's, not the canvas's: nudging a slider or clicking
  // a button in a panel used to take them away until you clicked the view
  // again. only a field you can type into keeps them for itself
  const keys = {};
  const typingIn = (t) => !!t && (t.tagName === 'TEXTAREA' || t.isContentEditable
    || t.tagName === 'SELECT'
    || (t.tagName === 'INPUT' && !['range', 'checkbox', 'color', 'button', 'radio'].includes(t.type)));
  const handled = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyR','KeyF','KeyZ','KeyX','KeyG','KeyO','KeyC','KeyK','KeyL','KeyM','KeyT','KeyP','KeyV','KeyN','KeyB',
    'Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Minus','Equal','Digit0','Numpad0','Home','KeyH']);
  let gain = 1; // re-initialized from the saved view once it loads
  let ortho = false;
  let miniature = false; // the tilt-shift look (N)
  const setMiniature = (on) => { miniature = on; view.setMiniature(on, 0.015, 0.35); updateHint(); };
  let hug = false; // terrain hug: hold height above the mesh, not the sphere
  // riding the dropped track (V). declared up here with the other mode flags
  // because updateHint reads it long before the path section is evaluated
  let followOn = false;
  let debugLod = false;
  let mipmaps = true;
  // the speed chip, and the hug chip with the height it is holding — which
  // moves with R/F, so the frame loop refreshes this while hugging
  const updateSpeed = () => {
    document.getElementById('speed').textContent =
      `speed ${gain >= 1 ? gain : '1/' + (1/gain)}`;
    const h = hug ? view.getFollowHeight() : NaN;
    const height = Number.isFinite(h) ? ` at ${h < 10 ? h.toFixed(1) : Math.round(h)} m` : '';
    document.getElementById('hug').textContent =
      hug && tubeOn ? `hugging the wall${height}`
        : hug && !ortho ? `hugging terrain${height}` : '';
  };
  let speedAt = 0;
  const updateHint = () => {
    document.getElementById('hint').textContent = [
      HINTS[followOn ? 'follow' : tunnelOn ? 'tunnel' : tubeOn ? (tubeBody ? 'body' : 'tube') : ortho ? 'ortho' : 'persp'],
      mipmaps ? '' : 'mipmaps off',
      miniature ? 'miniature' : '',
      // T and B only do anything once a rect exists
      !tubeOn && tubeRect ? 'rect drawn (T rolls it into a tube, B wraps it on a body)' : '',
    ].filter(Boolean).join(' · ');
    updateSpeed();
    // point-pair alignment is perspective-only, so every mode switch has to
    // re-decide whether its panel and markers belong on screen
    alignRefresh();
  };
  // 0 (or Home): back to the default view — the pose/fov/speed the demo
  // opens with, level (no roll), out of ortho and terrain hug, map zoom
  // reset and following again. the tube is left alone: esc clears it
  const resetView = () => {
    if (!view.ready()) return;
    if (followOn) setFollow(false); // else the rails put the camera straight back
    view.setPose(DEFAULT_VIEW.lat, DEFAULT_VIEW.lon, DEFAULT_VIEW.alt,
      DEFAULT_VIEW.heading, DEFAULT_VIEW.tilt);
    view.setFov(DEFAULT_VIEW.fov);
    view.setRoll(0);
    gain = DEFAULT_VIEW.gain;
    if (ortho) { ortho = false; view.setOrtho(false); }
    if (miniature) setMiniature(false);
    if (hug) { hug = false; view.setTerrainFollow(false); }
    map.setZoom(DEFAULT_VIEW.zoom);
    following = true;
    followVel = prevMark = null; // a jump, not motion: don't lead the ease
    updateHint();
  };
  addEventListener('keydown', (e) => {
    // browser/os shortcuts (cmd-R reload etc.) pass through untouched
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (typingIn(e.target)) return;
    if (handled.has(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Minus' && !e.repeat) { gain = Math.max(1/128, gain/2); updateHint(); }
    if (e.code === 'Equal' && !e.repeat) { gain = Math.min(128, gain*2); updateHint(); }
    // no ortho inside the tube: its extent/zoom anchoring assumes normal
    // terrain below, and a parallel projection of the tube reads as mush
    if (e.code === 'KeyN' && !e.repeat) setMiniature(!miniature);
    if (e.code === 'KeyO' && !e.repeat && !tubeOn && !tunnelOn) { ortho = !ortho; view.setOrtho(ortho); updateHint(); }
    // terrain hug: cruise at a fixed height above the mesh — over the
    // sphere normally, radially above the wall inside the tube
    if (e.code === 'KeyG' && !e.repeat && !followOn && !(tubeOn && tubeBody)) {
      hug = !hug;
      view.setTerrainFollow(hug);
      if (hug) stopSolve(); // the two fight over altitude — see startSolve
      updateHint();
    }
    if (e.code === 'KeyC' && !e.repeat) setPickDebug(!pickDebug);
    // ride the dropped track; does nothing without one
    if (e.code === 'KeyV' && !e.repeat) toggleFollow();
    // the point-pair panel; only does anything with a photo up, in perspective
    if (e.code === 'KeyP' && !e.repeat) toggleOverlayBlend();
    if (e.code === 'KeyH' && !e.repeat) toggleCutPanel();
    if (e.key === '?' && !e.repeat) toggleKeys();
    if (e.code === 'Escape' && document.body.classList.contains('keys')) {
      document.body.classList.remove('keys');
      return; // that is all this esc does
    }
    if ((e.code === 'Digit0' || e.code === 'Numpad0' || e.code === 'Home') && !e.repeat) resetView();
    // like the native app's L key: tint octants red where a finer tile is
    // wanted but not yet downloaded
    if (e.code === 'KeyL' && !e.repeat) { debugLod = !debugLod; view.setDebugLod(debugLod); }
    // K, its neighbour: draw the smoothed copy of the track the follow camera
    // actually aims down, dashed on the map beside the track it was made from
    if (e.code === 'KeyK' && !e.repeat) setDebugSmooth(!debugSmooth);
    // mipmap A/B. only bites on the uncompressed texture path, so it's the
    // ?jpg build where you can see it — and it's motion that shows it, not a
    // still frame: watch distant ground crawl as you fly
    if (e.code === 'KeyM' && !e.repeat) {
      mipmaps = !mipmaps;
      view.setMipmaps(mipmaps);
      updateHint();
    }
    // roll/unroll the tube for the current rect (drawn by shift+drag on the
    // map). rolling up also flies into the tube mouth — watching the roll
    // from outside mostly shows the back of the sheet
    // clear the tube entirely: unroll, drop the rect, back to normal flight
    if (e.code === 'Escape' && followOn) setFollow(false);
    if (e.code === 'Escape' && tunnelOn) { setTunnel(false); return; }
    // T is the tunnel — unless a rect is drawn on the map, when it rolls
    // that instead (esc clears the rect)
    if (e.code === 'KeyT' && !e.repeat && !followOn && (tunnelOn || !tubeRect)) {
      setTunnel(!tunnelOn || tunnelClosing);
      return;
    }
    if (e.code === 'Escape' && tubeRect) {
      tubeRect = null;
      tubeBody = false;
      unrollTube();
      setRectData(null);
      updateHint();
    }
    // T rolls the rect into a tube, B wraps it onto the body; each key
    // undoes its own shape and switches from the other's
    if (e.code === 'KeyT' && !e.repeat && tubeRect && !tunnelOn) {
      if (tubeOn && !tubeBody) unrollTube();
      else { tubeBody = false; applyTube(tubeRect, true); }
      updateHint();
    }
    if (e.code === 'KeyB' && !e.repeat && tubeRect && !tunnelOn && !followOn) {
      if (tubeOn && tubeBody) unrollTube();
      else { tubeBody = true; applyTube(tubeRect, true); }
      updateHint();
    }
    if (e.code === 'KeyB' && !e.repeat && !tubeRect && !tunnelOn && !followOn)
      toast('shift-drag a rect on the map first, then B wraps it on the body');
  });
  // the two clicks that mark a pair (photo point, then mesh point); the
  // pointer handlers above keep the camera still while this is armed
  canvas.addEventListener('click', (e) => {
    if (!capture) return;
    const r = rightEl.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    captureClick(x, y, (x / r.width) * 2 - 1, 1 - (y / r.height) * 2);
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  // leaving the window (cmd-tab mid-flight) loses the keyups, so let go of
  // everything rather than cruising on until the next keypress
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  let dragging = false, yaw = 0, pitch = 0;
  let ovDragging = false; // shift+drag slides the reference photo instead
  canvas.addEventListener('pointerdown', (e) => {
    canvas.focus();
    // while marking a pair, a click on the view is the mark — don't also
    // grab the camera and swing it away from what was clicked
    if (capture) return;
    if (e.shiftKey && document.body.classList.contains('overlay')) {
      ovDragging = true;
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', () => {
    dragging = false;
    if (ovDragging) { ovDragging = false; saveAlign(); }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (ovDragging) {
      ov.cx += e.movementX / Math.max(1, rightEl.clientWidth);
      ov.cy += e.movementY / Math.max(1, rightEl.clientHeight);
      layoutOverlay();
      return;
    }
    if (!dragging) return;
    // grab-the-world: in perspective, dragging pulls the scene with the
    // pointer by looking around; in ortho it pans instead (WASD-equivalent
    // camera translation, so the ground follows the pointer)
    // ...except on the rails, where the drag swings the standoff in either
    // projection: a pan would be overwritten by followStep on the same frame
    if (ortho && !followOn) {
      view.panOrtho(e.movementX, e.movementY, canvas.clientHeight);
      return;
    }
    yaw -= e.movementX * 0.003;
    pitch += e.movementY * 0.003;
  });
  // scroll on the 3d view zooms by narrowing/widening the fov, like the
  // native app (which uses fov *= 0.9^wheel; setFov clamps to 1..150 deg)
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    // shift+wheel resizes the reference photo rather than the view, the
    // companion of shift+drag's reposition
    if (e.shiftKey && document.body.classList.contains('overlay')) {
      // zoom about the pointer: whatever point of the picture is under it
      // stays under it, so you can wind in on a window frame without chasing
      // the photo back across the viewport afterwards. the centre is stored
      // as a fraction of the viewport, so solve for the one that puts that
      // photo point back where it was at the new size
      const r = rightEl.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const held = viewToPhoto(x, y);
      // a mouse wheel with shift held arrives as a *horizontal* scroll (the
      // browser's shift-scroll convention), and some wheels count in lines
      // rather than pixels — a trackpad gives a plain deltaY, so take
      // whichever axis has the motion and put lines on a pixel scale
      const d = (e.deltaY || e.deltaX) * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
      ov.scale = clampScale(ov.scale * Math.pow(0.9, d / 200));
      const b = overlayBox();
      // divide by the same size overlayBox() multiplies by — the rect is
      // fractional and clientWidth/Height are rounded, and solving against
      // one while drawing against the other nudges the photo a little the
      // same way every tick, which reads as a drift while zooming
      if (held && b) {
        ov.cx = (x + (0.5 - held.u) * b.w) / rightEl.clientWidth;
        ov.cy = (y + (0.5 - held.v) * b.h) / rightEl.clientHeight;
      }
      layoutOverlay();
      saveAlign();
      return;
    }
    // in ortho, zooming is a dolly (elevation is not a real degree of
    // freedom there); in perspective it narrows the fov like the native app
    if (ortho) { view.zoomOrtho(Math.pow(0.9, e.deltaY / 100)); return; }
    const p = view.getPose();
    view.setFov(p.fov * Math.pow(0.9, -e.deltaY / 100));
  }, { passive: false });

  // --- sync -----------------------------------------------------------------
  // the marker always shows where the camera is. the map is a free viewport:
  // dragging it never touches the camera; clicking it teleports the camera
  // there. while flying, the map follows the marker (smoothly easing over
  // when follow mode re-engages); grabbing the map stops the following
  let following = true;
  let posed = false;

  // while the pointer is down on the map, pause follow updates entirely:
  // the per-frame jumpTo would cancel maplibre's drag gesture mid-flight
  // (the aborted drag then even lands as a click -> surprise teleport)
  let mapPointerDown = false;
  const mapEl = document.getElementById('map');
  mapEl.addEventListener('pointerdown', () => { mapPointerDown = true; });
  addEventListener('pointerup', () => { mapPointerDown = false; });

  // the standard geolocate control (crosshair button); its geolocate event
  // teleports the camera like a map click, keeping altitude/heading/tilt.
  // the control's own flyTo is immediately overridden by follow mode's
  // per-frame jumpTo, which brings the map along instead
  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000 },
    trackUserLocation: false,
  });
  map.addControl(geolocate, 'top-left');
  geolocate.on('geolocate', (pos) => {
    if (!view.ready()) return;
    const p = view.getPose();
    view.setPose(pos.coords.latitude, pos.coords.longitude, p.alt, p.heading, p.tilt);
    following = true;
  });

  // place search: the standard maplibre-gl-geocoder control backed by OSM's
  // nominatim api. flyTo is off — picking a result teleports the camera like
  // a map click, and follow mode brings the map along on its own
  const geocoder = new MaplibreGeocoder({
    forwardGeocode: async (config) => {
      const features = [];
      try {
        const resp = await fetch('https://nominatim.openstreetmap.org/search?'
          + new URLSearchParams({ q: config.query, format: 'geojson', limit: 5 }));
        for (const f of (await resp.json()).features) {
          const center = f.geometry.type === 'Point' ? f.geometry.coordinates
            : [(f.bbox[0] + f.bbox[2]) / 2, (f.bbox[1] + f.bbox[3]) / 2];
          features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: center },
            place_name: f.properties.display_name, text: f.properties.display_name,
            place_type: ['place'], center, bbox: f.bbox, properties: f.properties });
        }
      } catch (e) {}
      return { features };
    },
  }, { maplibregl, marker: false, showResultMarkers: false, flyTo: false,
    showResultsWhileTyping: false });
  map.addControl(geocoder, 'top-left');
  // both live in maplibre's top-left slot inside #map, which is display: none
  // once the 3d view has the whole window. move the slot to the body: the
  // controls only hold the map object, not their place in its dom
  document.body.appendChild(map.getContainer().querySelector('.maplibregl-ctrl-top-left'));
  geocoder.on('result', ({ result }) => {
    if (!view.ready()) return;
    const p = view.getPose();
    // altitude scaled to the result's footprint (a city needs more height
    // than a street corner), clamped to something flyable
    let alt = p.alt;
    if (result.bbox) {
      const [w, s, e, n] = result.bbox;
      const spanM = Math.max((n - s), (e - w) * Math.cos(result.center[1] * Math.PI / 180)) * 111000;
      alt = Math.min(20000, Math.max(200, spanM * 0.8));
    }
    view.setPose(result.center[1], result.center[0], alt, p.heading, p.tilt);
    following = true;
    canvas.focus(); // hand the keys back to flight controls
  });

  map.on('dragstart', () => { following = false; });
  map.on('click', (e) => {
    if (!view.ready()) return;
    if (e.originalEvent.shiftKey) return; // shift belongs to rect drawing
    const p = view.getPose();
    view.setPose(e.lngLat.lat, e.lngLat.lng, p.alt, p.heading, p.tilt);
  });

  // --- tunnel mode ----------------------------------------------------------
  // the tube without the rect: the ground ahead curls up in front of the
  // camera, over it and down behind, whichever way it faces — the camera
  // on the axis, looking along the circle, new land rolling up ahead as
  // you fly (earth_core tunnelUpdate). one parameter, the circumference;
  // T toggles it, the panel's slider sets it
  let tunnelOn = false;
  let tunnelC = 2000; // metres around
  let tunnelAcross = true; // the roll runs along the heading (else around it)
  let tunnelLag = 0; // seconds for the tube to swing round after a turn; 0 at once
  const tunnelAxisBtn = document.getElementById('tunnelaxis');
  const TUNNEL_MIN = 200, TUNNEL_MAX = 20000;
  const tunnelSlider = document.getElementById('tunnelc');
  const tunnelAmountEl = document.getElementById('tunnelamount');
  // the slider is log across its range: a tunnel is felt in ratios
  const tunnelFromSlider = (v) => TUNNEL_MIN * Math.pow(TUNNEL_MAX / TUNNEL_MIN, v);
  const tunnelToSlider = (c) => Math.log(c / TUNNEL_MIN) / Math.log(TUNNEL_MAX / TUNNEL_MIN);
  const fmtM = (m) => m >= 1000 ? `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km` : `${Math.round(m)} m`;
  // the lag slider: zero at its left end, then log from a tenth of a
  // second to ten
  const LAG_MIN = 0.1, LAG_MAX = 10;
  const tunnelLagSlider = document.getElementById('tunnellag');
  const tunnelLagAmountEl = document.getElementById('tunnellagamount');
  const lagFromSlider = (v) => v <= 0 ? 0 : LAG_MIN * Math.pow(LAG_MAX / LAG_MIN, v);
  const lagToSlider = (t) => t <= 0 ? 0 : Math.log(Math.max(LAG_MIN, Math.min(LAG_MAX, t)) / LAG_MIN) / Math.log(LAG_MAX / LAG_MIN);
  const refreshTunnel = () => {
    tunnelSlider.value = tunnelToSlider(Math.max(TUNNEL_MIN, Math.min(TUNNEL_MAX, tunnelC)));
    tunnelAmountEl.textContent = `${fmtM(tunnelC)} around`;
    tunnelLagSlider.value = lagToSlider(tunnelLag);
    tunnelLagAmountEl.textContent = tunnelLag > 0 ? `${tunnelLag.toFixed(tunnelLag < 1 ? 2 : 1)} s to turn` : 'turns at once';
    tunnelAxisBtn.textContent = tunnelAcross ? 'forward and backward' : 'left to right';
  };
  tunnelAxisBtn.addEventListener('click', () => {
    tunnelAcross = !tunnelAcross;
    view.setTunnelAcross(tunnelAcross);
    refreshTunnel();
    saveView();
    canvas.focus();
  });
  // going in, the ground rolls up around you from flat; going out it
  // unrolls back to flat first (tunnelClosing, the tick eases curl to 0)
  // and the machinery goes off once it's there. animate: false skips both —
  // a reload lands straight in the tunnel it left
  let tunnelClosing = false;
  const endTunnel = () => {
    tunnelOn = false;
    tunnelClosing = false;
    curlTarget = 1;
    view.setTunnel(false, tunnelC);
    view.setTubeEnabled(false);
    updateHint();
  };
  const setTunnel = (on, animate = true) => {
    if (on) {
      if (tunnelOn && !tunnelClosing) return;
      if (tunnelClosing) {
        // caught on the way out: back up from wherever it got to
        tunnelClosing = false;
        curlTarget = 1;
      } else {
        tunnelOn = true;
        // the rect tube and the tunnel are the same machinery; only one
        if (tubeOn) { tubeOn = false; tubePending = null; view.setAirplane(false); }
        view.setTubeBody(false); // the tunnel is always the cylinder
        if (ortho) { ortho = false; view.setOrtho(false); }
        view.setTunnelAcross(tunnelAcross);
        view.setTunnelLag(tunnelLag * 1000);
        view.setTunnel(true, tunnelC);
        curl = animate ? 0 : 1;
        curlTarget = 1;
        view.setTubeCurl(curl);
        following = true;
      }

  document.getElementById('tunneloff').addEventListener('click', () => setTunnel(false));

  // --- tube mode ------------------------------------------------------------

  // replaces the old one. the roll animates via curl (0 flat .. 1 closed)
  let tubeRect = null; // [latMin, lonMin, latMax, lonMax] degrees
  let tubeOn = false;

  let curlTarget = 1; // 0 only while the tunnel unrolls on its way out
  // staged pipeline: the sheet stays flat while the rect's tiles load at
  // full res; once the scene is complete the engine measures ground level
  // off the mesh, and only then does the roll (and camera fly-in) happen.
  // 'fly' also teleports into the tube mouth; 'roll' just rolls in place
  let tubePending = null; // null | 'fly' | 'roll'

  // edges parallel to it. toggled by the #axisbtn switch

    Math.max(a.lat, b.lat), Math.max(a.lng, b.lng)];
  // the rect plus topology-diagram arrows on the two glued edges (the ones
  // that meet at the overhead seam), same direction on both — the cylinder
  // identification, the way quotient-space diagrams mark it
  const rectFC = (r) => {
    if (!r) return { type: 'FeatureCollection', features: [] };
    const feats = [{ type: 'Feature', properties: { kind: 'rect' },
      geometry: { type: 'Polygon', coordinates: [[
        [r[1], r[0]], [r[3], r[0]], [r[3], r[2]], [r[1], r[2]], [r[1], r[0]],
      ]] } }];
    const latc = (r[0] + r[2]) / 2, lonc = (r[1] + r[3]) / 2;
    const cosLat = Math.cos(latc * Math.PI / 180);
    const tri = (pts) => feats.push({ type: 'Feature', properties: { kind: 'arrow' },
      geometry: { type: 'Polygon', coordinates: [pts.concat([pts[0]])] } });
    if (tubeAxisEw) {

      const s = 0.09 * (r[3] - r[1]); // arrow half-length, degrees lon
      const h = 0.55 * s * cosLat; // half-height in degrees lat (same meters)

  map.on('load', () => {
    map.addSource('tube-rect', { type: 'geojson', data: rectFC(null) });
    map.addLayer({ id: 'tube-rect-fill', type: 'fill', source: 'tube-rect',

    map.addLayer({ id: 'tube-rect-arrows', type: 'fill', source: 'tube-rect',
      filter: ['==', ['get', 'kind'], 'arrow'],
      paint: { 'fill-color': '#ff7f0e', 'fill-opacity': 0.9 } });
    setRectData(tubeRect);
    map.addSource('gpx', { type: 'geojson', data: pathFC() });
    map.addLayer({ id: 'gpx-line', type: 'line', source: 'gpx',
      filter: ['==', ['geometry-type'], 'LineString'],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': pathStyle.color, 'line-width': pathStyle.width,

    // start and end, so a track you are looking at end-on still says which

    map.addLayer({ id: 'gpx-ends', type: 'circle', source: 'gpx',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: { 'circle-radius': 5,
        'circle-color': ['case', ['==', ['get', 'end'], 'start'], '#fff', pathStyle.color],
        'circle-stroke-width': 2, 'circle-stroke-color': pathStyle.color,

  });
  // fly to the near end of the tube axis: the axis runs along the rect's
  // longer dimension at height = tube radius, so spawning at (end, radius)
  // heading along the axis puts you dead center in the pipe, looking down it
  const flyIntoTube = (r) => {
    const latc = (r[0] + r[2]) / 2, lonc = (r[1] + r[3]) / 2;
    const ew = tubeAxisEw;

    const alt = info.groundAlt + Math.max(20, info.radius);
    const inset = 0.05;
    view.setPose(
      ew ? latc : r[0] + inset * (r[2] - r[0]),
      ew ? r[1] + inset * (r[3] - r[1]) : lonc,
      alt, ew ? 90 : 0, -5);

  };
  // the figure stands on the rect's centre, as tall as the rect is long,

  // spawn out in front of it at chest height, looking back level, far
  // enough that the whole figure fits the default fov
  const flyOntoBody = (r) => {
    const latc = (r[0] + r[2]) / 2, lonc = (r[1] + r[3]) / 2;
    const info = view.getTubeInfo();
    const S = 2 * info.halfLen; // the figure's height, m
    const D = 1.4 * S;
    const R = 6371010;
    const dlat = (D / R) * 180 / Math.PI;

    if (tubeAxisEw) view.setPose(latc + dlat, lonc, info.groundAlt + 0.55 * S, 180, 0);
    else view.setPose(latc, lonc - dlon, info.groundAlt + 0.55 * S, 90, 0);

  };
  // back to flat flight over the rect, which stays drawn

  const applyTube = (r, teleport) => {
