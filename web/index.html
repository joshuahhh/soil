    // among the pieces passing the filter; 0 if none
    const cast = (j, ox, oz, dx, dz, filt) => {
      const seg = secs[j], cls = classes[j];
      let best = 0;
      for (let k = 0; k < seg.length; k += 4) {
        if (!filt((seg[k] + seg[k + 2]) / 2, cls[k / 4])) continue;
        const ax = seg[k] - ox, az = seg[k + 1] - oz, ex = seg[k + 2] - seg[k], ez = seg[k + 3] - seg[k + 1];
        const den = ex * dz - ez * dx;
        if (Math.abs(den) < 1e-12) continue;
        const u = (dx * az - dz * ax) / den;
        if (u < 0 || u > 1) continue;
        const t = (ex * az - ez * ax) / den;
        if (t > best) best = t;
      }
      return best;
    };
    const ALL = () => true;
    const TORSO = (x, c) => c === 0;
    const ARM = (side) => (x, c) => c === side;
    // one loop per height can't make two legs: a rectangle with its long
    // edges glued is a cylinder, and rays cast from between the legs miss
    // front and back and web the two into a gown. so the rows are in
    // bands, and a band's loops split the rect's width between the
    // parts of the figure at that height, each part with rays from its own
    // centre:
    //   torso  (band 0): one loop, u = 0 at the back, the seam down the spine
    //   legs   (band 1): below the crotch; the u < 0.5 half wraps the +x leg
    //          (the one beneath the torso's u < 0.5 side), the rest the other
    //   arms   (band 2): where the arms hang free of the torso; the outer
    //          fifths of the width wrap the arms, the middle the torso
    // the crotch is the highest row below the hips where rays straight
    // forward and back from the section's centre both miss — the gap
    // between the legs. the arm rows are those above it where both arms
    // are loops of their own (the base mesh stands in an a-pose, so that
    // is from the fingertips to the armpits), taken as one contiguous range
    let crotch = -1;
    for (let j = Math.floor(0.6 * H); j >= 0; j--) {
      const c = centre(j, ALL);
      if (!c) continue;
      if (!cast(j, c[0], c[1], 0, 1, ALL) && !cast(j, c[0], c[1], 0, -1, ALL)) { crotch = j; break; }
    }
    let armLo = -1, armHi = -2;
    for (let j = crotch + 1; j < H; j++) {
      if (!centre(j, ARM(1)) || !centre(j, ARM(-1)) || !centre(j, TORSO)) continue;
      if (armLo < 0) armLo = j;
      armHi = j;
    }
    const aW = Math.round(0.2 * W);
    const bandOf = (j) => j <= crotch ? 1 : j >= armLo && j <= armHi ? 2 : 0;
    // a loop: its texel range, which pieces of the section it sees, and
    // its ray direction by angle. the legs and arms start at the inner
    // side (facing the torso) and go inner -> front -> outer -> back,
    // mirror images of each other
    const mirror = (side) => (th) => [-side * Math.cos(th), Math.sin(th)];
    const around = (th) => [Math.sin(th), -Math.cos(th)];
    const LOOPS = [
      [{ i0: 0, i1: W, filt: TORSO, dir: around }],
      [{ i0: 0, i1: W / 2, filt: (x) => x > 0, dir: mirror(1) },
        { i0: W / 2, i1: W, filt: (x) => x < 0, dir: mirror(-1) }],
      [{ i0: 0, i1: aW, filt: ARM(1), dir: mirror(1) },
        { i0: aW, i1: W - aW, filt: TORSO, dir: around },
        { i0: W - aW, i1: W, filt: ARM(-1), dir: mirror(-1) }],
    ];
    const loopAt = (i, j) => { const ls = LOOPS[bandOf(j)]; for (const l of ls) if (i < l.i1) return l; return ls[ls.length - 1]; };
    // per-row ray origins (one per loop), smoothed over a few rows within
    // the band so the origin slides up the figure rather than jumping
    const ox = new Float32Array(3 * H), oz = new Float32Array(3 * H);
    for (let j = 0; j < H; j++) {
      LOOPS[bandOf(j)].forEach((l, k) => {
        const c = centre(j, l.filt);
        if (c) { ox[3 * j + k] = c[0]; oz[3 * j + k] = c[1]; }
        else if (j > 0 && bandOf(j - 1) === bandOf(j)) { ox[3 * j + k] = ox[3 * (j - 1) + k]; oz[3 * j + k] = oz[3 * (j - 1) + k]; }
      });
    }
    const sox = new Float32Array(3 * H), soz = new Float32Array(3 * H);
    for (let j = 0; j < H; j++) {
      let lo = j, hi = j;
      while (lo > 0 && j - lo < 4 && bandOf(lo - 1) === bandOf(j)) lo--;
      while (hi < H - 1 && hi - j < 4 && bandOf(hi + 1) === bandOf(j)) hi++;
      for (let k = 0; k < 3; k++) {
        let x = 0, z = 0;
        for (let m = lo; m <= hi; m++) { x += ox[3 * m + k]; z += oz[3 * m + k]; }
        sox[3 * j + k] = x / (hi - lo + 1);
        soz[3 * j + k] = z / (hi - lo + 1);
      }
    }
    const pos = new Float32Array(W * H * 4);
    const cen = new Float32Array(W * H * 2); // each texel's ray origin, for the normals
    const rad = new Float32Array(W), hit = new Uint8Array(W);
    for (let j = 0; j < H; j++) {
      const y = (j + 0.5) / H;
      hit.fill(0);
      LOOPS[bandOf(j)].forEach((l, k) => {
        const L = l.i1 - l.i0;
        const cxj = sox[3 * j + k], czj = soz[3 * j + k];
        for (let i = l.i0; i < l.i1; i++) {
          const [dx, dz] = l.dir(2 * Math.PI * (i - l.i0 + 0.5) / L);
          const best = cast(j, cxj, czj, dx, dz, l.filt);
          if (best > 0) { rad[i] = best; hit[i] = 1; }
        }
        // bridge the misses, linear in radius across each gap, wrapping
        // within the loop
        let nh = 0;
        for (let i = l.i0; i < l.i1; i++) nh += hit[i];
        if (nh === 0) for (let i = l.i0; i < l.i1; i++) rad[i] = 0.002;
        else if (nh < L) {
          for (let i = l.i0; i < l.i1; i++) {
            if (hit[i]) continue;
            let a = i, b = i, da = 0, db = 0;
            while (!hit[a]) { a = l.i0 + (a - l.i0 + L - 1) % L; da++; }
            while (!hit[b]) { b = l.i0 + (b - l.i0 + 1) % L; db++; }
            rad[i] = (rad[a] * db + rad[b] * da) / (da + db);
          }
        }
        for (let i = l.i0; i < l.i1; i++) {
          const [dx, dz] = l.dir(2 * Math.PI * (i - l.i0 + 0.5) / L);
          const q = 4 * (j * W + i);
          pos[q] = cxj + rad[i] * dx;
          pos[q + 1] = y;
          pos[q + 2] = czj + rad[i] * dz;
          pos[q + 3] = hit[i];
          cen[2 * (j * W + i)] = cxj;
          cen[2 * (j * W + i) + 1] = czj;
        }
      });
    }
    // normals from the image itself: central differences, u wrapping
    // within the texel's own loop, v one-sided at a band's edge (the rows
    // either side belong to different loops and a difference across them
    // is a stretch, not a tangent); outward, checked against the radial
    // from the ray origin, since a webbed gap can fold either way
    const nrm = new Float32Array(W * H * 4);
    const at = (i, j) => 4 * (j * W + i);
    const uN = (i, j, d) => { const l = loopAt(i, j); const L = l.i1 - l.i0; return l.i0 + (i - l.i0 + d + L) % L; };
    for (let j = 0; j < H; j++) {
      const jp = j === H - 1 || bandOf(j + 1) !== bandOf(j) ? j : j + 1;
      const jm = j === 0 || bandOf(j - 1) !== bandOf(j) ? j : j - 1;
      for (let i = 0; i < W; i++) {
        const a = at(uN(i, j, 1), j), b = at(uN(i, j, -1), j), c = at(i, jp), d = at(i, jm);
        const ux = pos[a] - pos[b], uy = pos[a + 1] - pos[b + 1], uz = pos[a + 2] - pos[b + 2];
        const vx = pos[c] - pos[d], vy = pos[c + 1] - pos[d + 1], vz = pos[c + 2] - pos[d + 2];
        let nx = vy * uz - vz * uy, ny = vz * ux - vx * uz, nz = vx * uy - vy * ux;
        const k = at(i, j);
        const rx = pos[k] - cen[2 * (j * W + i)], rz = pos[k + 2] - cen[2 * (j * W + i) + 1];
        const len = Math.hypot(nx, ny, nz);
        if (len < 1e-9) { const rl = Math.hypot(rx, rz) || 1; nx = rx / rl; ny = 0; nz = rz / rl; }
        else { nx /= len; ny /= len; nz /= len; }
        if (nx * rx + nz * rz < 0) { nx = -nx; ny = -ny; nz = -nz; }
        nrm[k] = nx; nrm[k + 1] = ny; nrm[k + 2] = nz; nrm[k + 3] = 0;
      }
    }
    // the band edges in (u, v), for the shader to keep its samples and the
    // terrain's triangles within one loop: v below which the rows are
    // legs, the v range of the arm rows, and the arms' share of u
    const bands = [(crotch + 1) / H, armLo >= 0 ? armLo / H : 0, armLo >= 0 ? (armHi + 1) / H : 0, aW / W];
    return { w: W, h: H, pos, nrm, bands };
  };
  // parse, bake, and hand the image to the engine; false for a mesh with
  // nothing in it. takes effect on the next frame, mid-flight included
  const setBodyMesh = (text) => {
    const mesh = parseObj(text);
    if (!mesh.f.length || mesh.v.length < 9) return false;
    const img = bakeBody(mesh);
    const buf = view.bodyBuffer(img.w, img.h);
    buf.pos.set(img.pos);
    buf.nrm.set(img.nrm);
    view.bodyCommit(img.bands[0], img.bands[1], img.bands[2], img.bands[3]);
    return true;
  };
  const ensureBody = () => {
    if (view.bodyReady()) return Promise.resolve(true);
    if (!bodyPromise) {
      bodyPromise = fetch('body.obj').then((r) => {
        if (!r.ok) throw new Error(r.statusText);
        return r.text();
      }).then((text) => setBodyMesh(text)).catch((err) => {
        console.warn('body mesh:', err);
        return false;
      }).finally(() => { bodyPromise = null; });
    }
    return bodyPromise;
  };

  // --- dropped track (gpx) --------------------------------------------------
  // drop a .gpx on the window and the track is drawn twice: as a line on the
  // map, and over the terrain in the 3d view (the engine's path overlay —
  // see earth_core.h, which pins it to the mesh rather than to the file's own
  // elevations). the panel is the handle on it: color, opacity, width, and
  // the ✕ that gets rid of it. like the reference photo, the file never
  // leaves the browser but is kept in indexeddb so a reload comes back to it
  let path = null;   // { name, segs: [[{lat, lon, ele}, ...], ...], pts, km }
  const pathStyle = { color: '#ff7f0e', opacity: 0.9, width: 3, drape: true };
  const pathEls = {};
  for (const k of ['name', 'stats', 'progress', 'color', 'opacity', 'width', 'drape',
    'close', 'fit', 'go', 'follow'])
    pathEls[k] = document.getElementById('path' + k);

  // gpx is xml with a default namespace; a plain type selector matches an
  // element in any namespace, so no namespace juggling is needed here.
  // track segments and routes each become their own polyline — a gap in the
  // recording is a gap in the track, not a straight line across the county
  const parseGpx = (text) => {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) return null;
    const readPts = (nodes) => [...nodes].map((pt) => {
      const ele = pt.querySelector('ele');
      // an attribute that isn't there reads as null, and +null is 0 — which
      // would put a malformed point in the gulf of guinea rather than drop it
      const num = (a) => (pt.hasAttribute(a) ? parseFloat(pt.getAttribute(a)) : NaN);
      return {
        lat: num('lat'), lon: num('lon'),
        ele: ele ? parseFloat(ele.textContent) : NaN,
      };
    }).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
    const segs = [];
    for (const seg of doc.querySelectorAll('trkseg')) {
      const pts = readPts(seg.querySelectorAll('trkpt'));
      if (pts.length) segs.push(pts);
    }
    for (const rte of doc.querySelectorAll('rte')) {
      const pts = readPts(rte.querySelectorAll('rtept'));
      if (pts.length) segs.push(pts);
    }
    if (!segs.length) return null;
    const nameEl = doc.querySelector('trk > name') || doc.querySelector('metadata > name')
      || doc.querySelector('rte > name');
    return { name: (nameEl && nameEl.textContent.trim()) || '', segs };
  };

  // great-circle length, for the readout. the elevation profile is not part
  // of it: the file's elevations are the thing we trust least here
  const pathLengthKm = (segs) => {
    let m = 0;
    for (const seg of segs) {
      for (let i = 1; i < seg.length; i++) {
        const a = seg[i - 1], b = seg[i];
        const dlat = (b.lat - a.lat) * Math.PI / 180;
        const dlon = (b.lon - a.lon) * Math.PI / 180 * Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
        m += Math.hypot(dlat, dlon) * 6371010;
      }
    }
    return m / 1000;
  };

  const pathFC = () => {
    if (!path) return { type: 'FeatureCollection', features: [] };
    const feats = path.segs.map((seg) => ({ type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: seg.map((p) => [p.lon, p.lat]) } }));
    const first = path.segs[0][0];
    const lastSeg = path.segs[path.segs.length - 1];
    const last = lastSeg[lastSeg.length - 1];
    for (const [end, p] of [['start', first], ['end', last]])
      feats.push({ type: 'Feature', properties: { end },
        geometry: { type: 'Point', coordinates: [p.lon, p.lat] } });
    return { type: 'FeatureCollection', features: feats };
  };
  const setPathData = () => {
    const src = map.getSource('gpx');
    if (src) src.setData(pathFC());
    const dbg = map.getSource('gpx-smooth');
    if (dbg) dbg.setData({ type: 'FeatureCollection', features: [] });
  };
  // one place for the style, applied to both views. the map layers may not
  // exist yet (style still loading), which setPathData's guard also covers
  const applyPathStyle = () => {
    const rgb = parseInt(pathStyle.color.slice(1), 16);
    cursorEl.style.borderColor = pathStyle.color;
    if (view.ready())
      view.setPathStyle(rgb, pathStyle.opacity, pathStyle.width, pathStyle.drape);
    if (map.getLayer('gpx-line')) {
      map.setPaintProperty('gpx-line', 'line-color', pathStyle.color);
      map.setPaintProperty('gpx-line', 'line-width', pathStyle.width);
      map.setPaintProperty('gpx-line', 'line-opacity', pathStyle.opacity);
      map.setPaintProperty('gpx-ends', 'circle-color',
        ['case', ['==', ['get', 'end'], 'start'], '#fff', pathStyle.color]);
      map.setPaintProperty('gpx-ends', 'circle-stroke-color', pathStyle.color);
      map.setPaintProperty('gpx-ends', 'circle-opacity', pathStyle.opacity);
      map.setPaintProperty('gpx-ends', 'circle-stroke-opacity', pathStyle.opacity);
    }
  };
  // the engine wants flat [lat, lon, ele] triples with a nan triple marking
  // the break between polylines. re-sent only when the points change; the
  // style has its own call so a slider drag doesn't re-upload the track
  const pushPath = () => {
    if (!view.ready()) return;
    if (!path) { view.clearPath(); return; }
    const flat = new Float64Array(path.pts * 3 + (path.segs.length - 1) * 3);
    let i = 0;
    path.segs.forEach((seg, si) => {
      if (si) { flat[i++] = NaN; flat[i++] = NaN; flat[i++] = NaN; }
      for (const p of seg) { flat[i++] = p.lat; flat[i++] = p.lon; flat[i++] = p.ele; }
    });
    view.setPath(flat);
    applyPathStyle();
  };

  // where you are along the track, on the map: the 3d view marks the same
  // point with a disc on the line itself (the engine's path cursor), but the
  // map is where "how far along am i" is actually a readable question
  const cursorEl = document.createElement('div');
  cursorEl.style.cssText = 'width:13px;height:13px;border-radius:50%;background:#fff;'
    + 'border:3px solid #ff7f0e;box-sizing:border-box;pointer-events:none;'
    + 'box-shadow:0 0 0 1px rgba(0,0,0,.45);';
  const cursorMarker = new maplibregl.Marker({ element: cursorEl });
  let cursorOn = false;
  const setCursor = (ll) => {
    if (!ll) {
      if (cursorOn) { cursorMarker.remove(); cursorOn = false; }
      if (view.ready()) view.clearPathCursor();
      return;
    }
    cursorMarker.setLngLat([ll.lon, ll.lat]);
    if (!cursorOn) { cursorMarker.addTo(map); cursorOn = true; }
  };

  const savePath = () => {
    if (storageFrozen) return;
    try {
      localStorage.setItem('earth-path', JSON.stringify({
        style: pathStyle, name: path ? path.name : null,
        // how you like to stand relative to the track, but neither the mode
        // itself (coming back to a reload already on rails would be a shock)
        // nor where along it you were: entering follow always re-derives that
        // from where the camera actually is, so saving it reads back as dead
        follow: { az: fol.az, el: fol.el, dist: fol.dist },
      }));
    } catch (e) {}
  };
  const pathBounds = () => {
    if (!path) return null;
    const b = new maplibregl.LngLatBounds();
    for (const seg of path.segs) for (const p of seg) b.extend([p.lon, p.lat]);
    return b;
  };
  const fitPath = () => {
    const b = pathBounds();
    if (!b) return;
    following = false; // the map is showing the track now, not the camera
    map.fitBounds(b, { padding: 40, animate: false, maxZoom: 16 });
  };
  // put the 3d camera at the start of the track, looking the way it heads.
  // altitude comes from the file, which is enough to be above the ground and
  // let the mesh stream in — the drape then puts the line on the terrain
  const flyToPathStart = () => {
    if (!path || !view.ready()) return;
    const seg = path.segs[0];
    const a = seg[0];
    const b = seg[Math.min(seg.length - 1, 20)];
    const heading = Math.atan2((b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180),
      b.lat - a.lat) * 180 / Math.PI;
    view.setPose(a.lat, a.lon, (Number.isFinite(a.ele) ? a.ele : 0) + 400, heading, -20);
    following = true;
    canvas.focus();
  };

  const refreshPathPanel = () => {
    document.body.classList.toggle('path', !!path);
    pathEls.color.value = pathStyle.color;
    pathEls.opacity.value = Math.round(pathStyle.opacity * 100);
    pathEls.width.value = pathStyle.width;
    // no elevations in the file means no alternative to draping: show it on
    // and locked rather than offering a switch that would bury the track
    pathEls.drape.checked = pathStyle.drape;
    pathEls.drape.disabled = !!path && !path.hasEle;
    pathEls.drape.parentElement.title = pathEls.drape.disabled
      ? 'this file records no elevations, so the track has to be laid on the mesh'
      : 'lay the track on the mesh instead of at the elevations the file records';
    pathEls.follow.classList.toggle('primary', followOn);
    if (!path) return;
    pathEls.name.textContent = path.name || 'path';
    pathEls.name.title = path.name || '';
    pathEls.stats.textContent = `${path.pts} pts · ${path.km.toFixed(1)} km`
      + (path.segs.length > 1 ? ` · ${path.segs.length} segments` : '')
      + (path.saved === false ? ' · NOT SAVED' : '');
    pathEls.stats.title = path.saved === false
      ? "this track couldn't be written to the browser's storage (it's probably"
        + ' full) — a reload will come back to whatever was stored before it'
      : '';
  };

  // `fresh` marks a file the user just dropped, as opposed to one being
  // restored: a drop re-picks the drape default, a restore keeps whatever
  // was chosen last time
  const setPath = (parsed, fresh) => {
    path = parsed;
    if (path) {
      path.pts = path.segs.reduce((n, seg) => n + seg.length, 0);
      path.km = pathLengthKm(path.segs);
      // elevations are data the file actually recorded, so they win by
      // default and draping is the fallback for when there are none. a few
      // points missing an <ele> is common enough to tolerate — each of those
      // reads as sea level, and the drape measurement fills them in — but a
      // track that is mostly missing them has nothing to plot against
      const withEle = path.segs.reduce((n, seg) =>
        n + seg.filter((p) => Number.isFinite(p.ele)).length, 0);
      path.hasEle = withEle >= path.pts * 0.9;
      if (fresh || !path.hasEle) pathStyle.drape = !path.hasEle;
    }
    buildSpine();
    // a different track means a different journey: start at its beginning
    // rather than however far along the last one you had got, and drop the
    // eased heading and altitude so they don't drift in from the old place
    fol.s = 0;
    fol.heading = fol.alt = null;
    // the debug line belongs to a particular track: redraw it for this one
    // (setPathData has just cleared the old one)
    if (debugSmooth && spine) setDebugSmooth(true);
    if (!spine) setFollow(false); // nothing left to ride
    setPathData();
    pushPath();
    refreshPathPanel();
    savePath();
  };
  const clearPath = () => {
    setFollow(false);
    setPath(null);
    idbDel('gpx-file', 'app');
    canvas.focus();
  };

  const loadGpxFile = async (file) => {
    const parsed = parseGpx(await file.text());
    if (!parsed) { alert('could not read a track out of ' + file.name); return; }
    if (!parsed.name) parsed.name = file.name.replace(/\.gpx$/i, '');
    setPath(parsed, true);
    fitPath();
    // and say so in the panel if it didn't stick, rather than letting the
    // next reload quietly serve whatever track was stored before this one
    const stored = await idbPutChecked('gpx-file', file);
    // another file may have been dropped while that was in flight; it owns
    // the store now, and this result says nothing about it
    if (path === parsed) { path.saved = stored; refreshPathPanel(); }
    canvas.focus(); // the drop shouldn't cost you the flight keys
  };

  pathEls.close.addEventListener('click', clearPath);
  pathEls.color.addEventListener('input', () => {
    pathStyle.color = pathEls.color.value;
    applyPathStyle();
    savePath();
  });
  pathEls.opacity.addEventListener('input', () => {
    pathStyle.opacity = +pathEls.opacity.value / 100;
    applyPathStyle();
    savePath();
  });
  pathEls.width.addEventListener('input', () => {
    pathStyle.width = +pathEls.width.value;
    applyPathStyle();
    savePath();
  });
  pathEls.drape.addEventListener('change', () => {
    pathStyle.drape = pathEls.drape.checked;
    applyPathStyle();
    savePath();
  });
  pathEls.fit.addEventListener('click', fitPath);
  pathEls.go.addEventListener('click', flyToPathStart);
  // the follow button is wired at the end of the follow section below, not
  // here: toggleFollow is a const declared there, and naming it as a handler
  // reads it now rather than at click time

  // --- following the path ---------------------------------------------------
  // V puts the camera on rails. it aims at a point that runs along the track
  // (W/S drive it) from a standoff expressed in the *path's* frame rather
  // than the world's: azimuth is measured from the direction the track heads,
  // so rounding a bend carries the camera around with it and you keep looking
  // at the same shoulder of the trail. the arrows move that standoff (left/
  // right around the track, up/down in elevation), R/F change its distance.
  // A/D do nothing — on rails there is nowhere sideways to go.
  //
  // it steers off a smoothed copy of the track, never the track itself. a gps
  // fix wanders a few meters between samples, and taking the heading from one
  // raw segment hands every one of those wobbles to the camera, which reads
  // as the world shivering. so the track is resampled at a fixed step and
  // boxcar-smoothed twice (two passes ≈ gaussian), and the heading comes from
  // a chord across a couple hundred meters of *that* rather than from any one
  // segment. a temporal ease on top absorbs what survives.
  const SPINE_STEP = 10;       // m between resampled points
  // the smoothing windows are fractions of what the view spans, not fixed
  // distances. a fixed window is only ever right at one zoom: 20 m of
  // smoothing is the difference between a steady camera and a shaky one from
  // 60 m out, and nothing at all from 2 km up, where the same track reads as
  // rigidly locked to its marker. the fractions are set so the default
  // standoff reproduces the fixed windows they replace — about 20 m for the
  // aim, 60 m for the heading, a 150 m chord.
  //
  // the camera aims down the lighter one: a gps fix wanders a few metres and
  // the camera must not inherit that, but heavy smoothing cuts a switchback's
  // corner by tens of metres, and aiming there leaves the marker (which is on
  // the drawn line, where it belongs) off-centre through every bend
  const AIM_SMOOTH_FRAC = 0.1;
  const HEAD_SMOOTH_FRAC = 0.3;
  const CHORD_FRAC = 0.6;
  const SMOOTH_MIN = 8, SMOOTH_MAX = 4000; // m, either end of the scaling
  const FOLLOW_TURN_TAU = 500; // ms: ease on the heading
  const FOLLOW_ALT_TAU = 700;  // ms: and on the target's altitude, which steps
                               // as the drape measurements land
  let spine = null;
  // s: meters along the spine. az: bearing from the target to the camera,
  // relative to the path's heading (0 = behind it, looking the way it goes).
  // el: how far above the target the camera stands. heading/alt: the eased
  // values actually used, null until the first frame seeds them
  const fol = { s: 0, az: 0, el: 22, dist: 250, heading: null, alt: null };

  // box filter by prefix sum, O(n) whatever the window; the window shrinks at
  // the ends rather than the values being clamped into it
  const boxcar = (a, half) => {
    const n = a.length, pre = new Float64Array(n + 1), out = new Float64Array(n);
    for (let i = 0; i < n; i++) pre[i + 1] = pre[i] + a[i];
    for (let i = 0; i < n; i++) {
      const lo = Math.max(0, i - half), hi = Math.min(n - 1, i + half);
      out[i] = (pre[hi + 1] - pre[lo]) / (hi - lo + 1);
    }
    return out;
  };
  const halfFor = (win) => Math.max(1, Math.round(win / SPINE_STEP / 2));
  // the smoothed copies, filtered once and kept until the window they were
  // filtered at has moved appreciably. the window follows the zoom, so it
  // technically changes every frame — but quantizing it costs a sub-metre
  // step in the aim and saves refiltering the track for a change nobody can
  // see. two boxcars over the whole spine is O(n) and only runs while you are
  // actually zooming; a per-frame kernel would run always
  const SMOOTH_STALE = 0.08; // refilter once the window has moved this much
  const smoothCache = new Map(); // 'aim' | 'head' -> { win, xs, ys }
  const smoothed = (key, win) => {
    const c = smoothCache.get(key);
    if (c && Math.abs(win - c.win) < SMOOTH_STALE * c.win) return c;
    const half = halfFor(win);
    let xs = spine.rx, ys = spine.ry;
    for (let pass = 0; pass < 2; pass++) { xs = boxcar(xs, half); ys = boxcar(ys, half); }
    const built = { win, xs, ys };
    smoothCache.set(key, built);
    // the debug line is the aim copy itself, not a second filtering of it:
    // a debug view that can disagree with the thing it depicts is worse than
    // none at all
    if (key === 'aim' && debugSmooth) drawSmoothLayer(built);
    return built;
  };

  const buildSpine = () => {
    spine = null;
    if (!path) return;
    // one line to follow: the gaps between track segments are crossed rather
    // than jumped, since the camera has to travel through them somehow
    const raw = [];
    for (const seg of path.segs) for (const p of seg) raw.push(p);
    if (raw.length < 2) return;
    // one local tangent plane for the whole track: meters east/north of its
    // mean latitude. the east scale drifts with cos(lat) away from that — a
    // percent over a degree — which is nothing against a camera standoff, and
    // it keeps resampling and smoothing to plain 2d arithmetic
    const lat0 = raw.reduce((t, p) => t + p.lat, 0) / raw.length;
    const lon0 = raw[0].lon;
    const mLat = D2R * planetR, mLon = mLat * Math.cos(lat0 * D2R);
    const xy = raw.map((p) => [(p.lon - lon0) * mLon, (p.lat - lat0) * mLat]);
    // resample at a fixed step, remembering which original point each sample
    // came from — the engine's altitudes are indexed by that
    const samples = [{ x: xy[0][0], y: xy[0][1], i: 0 }];
    let dAcc = 0, dNext = SPINE_STEP;
    for (let i = 1; i < xy.length; i++) {
      const dx = xy[i][0] - xy[i - 1][0], dy = xy[i][1] - xy[i - 1][1];
      const len = Math.hypot(dx, dy);
      if (!(len > 0)) continue;
      while (dNext <= dAcc + len) {
        const t = (dNext - dAcc) / len;
        samples.push({ x: xy[i - 1][0] + dx * t, y: xy[i - 1][1] + dy * t, i });
        dNext += SPINE_STEP;
      }
      dAcc += len;
    }
    if (samples.length < 2) return;
    // resampled but *unsmoothed*: the smoothing happens per frame now, at
    // whatever window the current view scale asks for
    const rx = Float64Array.from(samples, (p) => p.x);
    const ry = Float64Array.from(samples, (p) => p.y);
    // arc length along the *raw* points, which is what the ribbon is drawn
    // through and therefore what the cursor and the progress readout have to
    // speak. the spine is only ever consulted for which way the track heads
    smoothCache.clear();
    const cum = new Float64Array(xy.length);
    for (let i = 1; i < xy.length; i++)
      cum[i] = cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]);
    spine = { rx, ry, idx: samples.map((p) => p.i), raw, cum, step: SPINE_STEP,
      len: (samples.length - 1) * SPINE_STEP, rawLen: cum[cum.length - 1],
      lat0, lon0, mLat, mLon };
  };

  // the smoothing leaves the samples very slightly unevenly spaced, so s/step
  // is an approximation of arc length — by well under a percent, and nothing
  // here needs it to be exact
  // a point on one of the smoothed copies, interpolated between the samples
  // either side so it doesn't step as s crosses one
  const spineAt = (s, sm) => {
    const n = sm.xs.length;
    const u = Math.min(n - 1, Math.max(0, s / spine.step));
    const i = Math.min(n - 2, Math.floor(u)), f = u - i;
    return [sm.xs[i] + (sm.xs[i + 1] - sm.xs[i]) * f,
      sm.ys[i] + (sm.ys[i + 1] - sm.ys[i]) * f];
  };
  // metres along the raw track -> fractional point index, and the point
  // itself. this is the number the ribbon is built from, so a cursor placed
  // with it sits on the drawn line by construction
  const rawAt = (s) => {
    const cum = spine.cum;
    let lo = 0, hi = cum.length - 1;
    const d = Math.max(0, Math.min(s, spine.rawLen));
    while (lo < hi) { // first index whose cumulative length is >= d
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const i = Math.max(0, lo - 1);
    const leg = cum[i + 1] - cum[i];
    const f = leg > 0 ? (d - cum[i]) / leg : 0;
    const a = spine.raw[i], b = spine.raw[Math.min(i + 1, spine.raw.length - 1)];
    return { idx: i + f,
      lat: a.lat + (b.lat - a.lat) * f, lon: a.lon + (b.lon - a.lon) * f };
  };
  const spineIdx = (s) => spine.idx[Math.min(spine.idx.length - 1,
    Math.max(0, Math.round(s / spine.step)))];
  // how much ground the view spans at the target, in metres — the scale the
  // smoothing windows are cut from. a parallel projection says so outright;
  // in perspective it comes from the standoff and the fov, so both the R/F
  // standoff and the Z/X zoom feed it
  const followSpan = () => {
    if (ortho) {
      const e = view.getOrthoExtent();
      if (e > 0) return 2 * e;
    }
    const fov = view.ready() ? view.getPose().fov : 45;
    return Math.max(20, 2 * fol.dist * Math.tan(fov * D2R / 2));
  };
  const winFor = (frac, span) =>
    Math.min(SMOOTH_MAX, Math.max(SMOOTH_MIN, frac * span));
  const spineLatLon = (xy) => ({ lat: spine.lat0 + xy[1] / spine.mLat,
    lon: spine.lon0 + xy[0] / spine.mLon });
  // which way the track heads at s, degrees clockwise from north, over a
  // chord rather than a segment (this is the anti-jitter measurement)
  const spineHeading = (s, sm, chord) => {
    const a = spineAt(Math.max(0, s - chord), sm);
    const b = spineAt(Math.min(spine.len, s + chord), sm);
    const dx = b[0] - a[0], dy = b[1] - a[1];
    return Math.hypot(dx, dy) < 1e-6 ? null : Math.atan2(dx, dy) / D2R;
  };
  // the ground the camera should be looking at, averaged over a stretch of
  // track so one bad fix doesn't dip the view. the engine answers with the
  // draped altitude where the mesh under that point has been measured and
  // with nothing where it hasn't, so measured points win outright and the
  // file's own elevations only stand in until the drape reaches there —
  // averaging the two together would split the difference and park the
  // target inside the hillside
  const spineAlt = (s) => {
    const at = (j) => Math.round(rawAt(s + j * 25).idx);
    let sum = 0, n = 0;
    for (let j = -3; j <= 3; j++) {
      const a = view.getPathGroundAlt(at(j));
      if (Number.isFinite(a)) { sum += a; n++; }
    }
    if (n) return sum / n;
    for (let j = -3; j <= 3; j++) {
      const e = spine.raw[at(j)].ele;
      if (Number.isFinite(e)) { sum += e; n++; }
    }
    return n ? sum / n : null;
  };
  // where on the spine the camera is standing now, so V picks you up where
  // you are rather than teleporting to the trailhead
  const nearestS = () => {
    const p = view.getPose();
    const x = (p.lon - spine.lon0) * spine.mLon, y = (p.lat - spine.lat0) * spine.mLat;
    let best = 0, bd = Infinity;
    for (let i = 0; i < spine.raw.length; i++) {
      const rx = (spine.raw[i].lon - spine.lon0) * spine.mLon;
      const ry = (spine.raw[i].lat - spine.lat0) * spine.mLat;
      const d = (rx - x) ** 2 + (ry - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return spine.cum[best];
  };

  // --- debug: draw what the camera is actually following ---------------------
  // the smoothed copy is invisible by construction — it exists only as the
  // thing the camera aims down — so when the marker floats off-centre there
  // is nothing to look at to see why. this draws it on the map beside the
  // track: dashed, in a contrasting color, at whatever window the current
  // zoom is asking for. the gap between the two lines *is* the float
  let debugSmooth = false;
  const drawSmoothLayer = (sm) => {
    const src = map.getSource('gpx-smooth');
    if (!src || !spine) return;
    const coords = [];
    for (let i = 0; i < sm.xs.length; i++) {
      const ll = spineLatLon([sm.xs[i], sm.ys[i]]);
      coords.push([ll.lon, ll.lat]);
    }
    src.setData({ type: 'Feature', properties: { win: sm.win },
      geometry: { type: 'LineString', coordinates: coords } });
  };
  const setDebugSmooth = (on) => {
    debugSmooth = on;
    const src = map.getSource('gpx-smooth');
    if (src && !on) src.setData({ type: 'FeatureCollection', features: [] });
    // draw whatever the camera is following right now; if it has not been
    // following anything yet, filter at the window it would use
    if (on && spine) drawSmoothLayer(smoothed('aim', winFor(AIM_SMOOTH_FRAC, followSpan())));
    canvas.focus();
  };

  const setFollow = (on) => {
    if (on && (!spine || !view.ready() || tubeOn || tunnelOn)) on = false;
    if (on === followOn) { refreshPathPanel(); return; }
    followOn = on;
    fol.heading = fol.alt = null; // don't ease out of a stale value
    if (on) {
      // terrain hug goes: it re-eases the eye toward a held height above the
      // mesh inside every fly() call, and the rails write the pose outright,
      // so the two fight over the same thing. ortho stays — a parallel
      // projection has no quarrel with the rails, it just changes what R/F
      // and a drag have to do (see followStep)
      if (hug) { hug = false; view.setTerrainFollow(false); }
      fol.s = nearestS();
      following = true; // let the map track the camera along
      canvas.focus();
    } else {
      setCursor(null);
    }
    document.body.classList.toggle('riding', on);
    refreshPathPanel();
    updateHint();
    savePath();
  };
  const toggleFollow = () => setFollow(!followOn);
  pathEls.follow.addEventListener('click', toggleFollow);

  // one frame of the follow camera; replaces the flight controls entirely
  // while it is on (see the tick)
  const followStep = (dt, slow) => {
    const k = (slow ? 0.15 : 1) * dt / 1000;
    // a drag on the view swings the standoff, the same grab-the-world way it
    // turns the head in free flight: pull right and the track goes right,
    // which means the camera walks left around it. yaw/pitch carry only the
    // pointer here — the tick keeps the arrow keys out of them on the rails
    if (yaw || pitch) {
      fol.az += yaw / D2R;
      fol.el = Math.min(85, Math.max(-10, fol.el + pitch / D2R));
    }
    // one notion of scale for everything that has to follow the zoom: how
    // much ground the view spans (see followSpan). travel is scaled to it so
    // motion looks the same on screen at any zoom — from 20 m out a hiking
    // pace is right, from 5 km up it would take all day. this used to scale
    // to the standoff alone, which is proportional to the span at a fixed fov
    // and so felt right until you touched a zoom: Z/X moves the fov, and in
    // ortho the wheel and Z/X move the extent, none of which is the standoff
    const span = followSpan();
    const speed = Math.max(15, span * 0.6) * gain;
    if (keys.KeyW) fol.s += speed * k;
    if (keys.KeyS) fol.s -= speed * k;
    fol.s = Math.min(spine.rawLen, Math.max(0, fol.s));
    if (keys.ArrowRight) fol.az += 60 * k;
    if (keys.ArrowLeft) fol.az -= 60 * k;
    if (keys.ArrowUp) fol.el = Math.min(85, fol.el + 40 * k);
    if (keys.ArrowDown) fol.el = Math.max(-10, fol.el - 40 * k);
    if (!!keys.KeyR !== !!keys.KeyF) {
      // >1 zooms in, matching zoomOrtho's sense; R backs off, F closes in
      const f = Math.pow(1.8, (keys.KeyR ? -1 : 1) * (slow ? 0.15 : 1) * dt / 1000);
      // a parallel projection doesn't care how far back the camera stands, so
      // in ortho the standoff is invisible and R/F have to move the extent
      // instead — the way they do outside follow. the standoff still rides
      // along, so the framing survives a switch back to perspective and the
      // travel speed (which scales with it) tracks what you can actually see
      if (ortho) view.zoomOrtho(f);
      fol.dist = Math.min(50000, Math.max(15, fol.dist / f));
    }

    // the smoothing windows for this frame, cut from that same span: zoom out
    // and the camera rides a longer average of the track, which is what keeps
    // the same track from reading as rigid at altitude and shaky up close
    const aimWin = winFor(AIM_SMOOTH_FRAC, span);
    const headWin = winFor(HEAD_SMOOTH_FRAC, span);
    const chord = winFor(CHORD_FRAC, span);
    const aimSm = smoothed('aim', aimWin), headSm = smoothed('head', headWin);
    // the heading is the one thing still taken from the smoothed spine — the
    // jitter that matters is in the *direction* between raw points, not in
    // their positions. its arc length runs a hair short of the raw track's
    // (smoothing cuts corners), so the position is scaled across
    const sSpine = fol.s * (spine.len / Math.max(1, spine.rawLen));
    const h = spineHeading(sSpine, headSm, chord);
    if (h !== null) {
      if (fol.heading === null) fol.heading = h;
      else {
        // shortest way round, so crossing north doesn't spin the long way
        const d = ((h - fol.heading + 540) % 360) - 180;
        fol.heading += d * (1 - Math.exp(-dt / FOLLOW_TURN_TAU));
      }
    }
    const a = spineAlt(fol.s);
    if (a !== null)
      fol.alt = fol.alt === null ? a
        : fol.alt + (a - fol.alt) * (1 - Math.exp(-dt / FOLLOW_ALT_TAU));

    // the aim point is on the raw track, not the smoothed copy: the ribbon is
    // drawn through the raw points, and a marker placed off the smoothed one
    // visibly leaves the line at every bend. the 3d disc is placed by point
    // index so the engine can put it on the drawn geometry exactly, drape and
    // all; the map dot and the camera get the interpolated position
    const ll = rawAt(fol.s);
    setCursor(ll);
    view.setPathCursorIndex(ll.idx);
    pathEls.progress.textContent = `${(fol.s / 1000).toFixed(2)} of `
      + `${(spine.rawLen / 1000).toFixed(2)} km · `
      + `${Math.round(100 * fol.s / Math.max(1, spine.rawLen))}%`
      + (debugSmooth ? ` · smooth ${Math.round(aimWin)}/${Math.round(headWin)} m` : '');
    // the camera aims down its own lightly smoothed copy, never the raw
    // track: the marker has to be on the drawn line, the camera has to not
    // shake, and those are different requirements
    const aim = spineLatLon(spineAt(sSpine, aimSm));
    const lat = aim.lat * D2R, lon = aim.lon * D2R;
    const up = geoUpV(lat, lon), north = geoNorthV(lat, lon), east = vcross(north, up);
    const bearing = ((fol.heading || 0) + fol.az) * D2R;
    const horiz = vadd(vmul(north, Math.cos(bearing)), vmul(east, Math.sin(bearing)));
    const target = vmul(up, planetR + (fol.alt || 0));
    // the camera stands off *behind* the target along that bearing, lifted by
    // the elevation angle — so az 0 is a chase view down the track
    const el = fol.el * D2R;
    const eye = vadd(target, vadd(vmul(horiz, -fol.dist * Math.cos(el)),
      vmul(up, fol.dist * Math.sin(el))));
    // back into the pose vocabulary: where that put the camera, and the aim
    // from there to the target — which is not quite the bearing above once
    // the planet has curved between the two
    const r = Math.hypot(eye[0], eye[1], eye[2]);
    const eu = vmul(eye, 1 / r);
    const clamp1 = (v) => Math.min(1, Math.max(-1, v));
    const clat = Math.asin(clamp1(eu[2])), clon = Math.atan2(eu[1], eu[0]);
    const v = vnorm(vsub(target, eye));
    if (!v) return;
    const cnorth = geoNorthV(clat, clon), ceast = vcross(cnorth, eu);
    view.setPose(clat / D2R, clon / D2R, r - planetR,
      Math.atan2(vdot(v, ceast), vdot(v, cnorth)) / D2R,
      Math.asin(clamp1(vdot(v, eu))) / D2R);
  };

  // restore. skipped in test mode for the same reason the saved pose is: a
  // capture must not depend on what the last interactive session dropped
  (async () => {
    if (TEST) return;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('earth-path')); } catch (e) {}
    if (saved && saved.style) Object.assign(pathStyle, saved.style);
    if (saved && saved.follow) Object.assign(fol, saved.follow, { heading: null, alt: null });
    refreshPathPanel();
    const file = await idbGet('gpx-file', 'app');
    if (!file) return;
    const parsed = parseGpx(await file.text());
    if (parsed) {
      if (!parsed.name) parsed.name = (saved && saved.name) || '';
      setPath(parsed); // pushPath is a no-op until the planet is ready; tick retries
    } else {
      idbDel('gpx-file', 'app');
    }
  })();

  // locked-mode wheel zoom: handle it ourselves with an unanimated setZoom,
  // which zooms around the center — where the follow keeps the marker — so
  // it can't fight the per-frame follow updates. free mode gets maplibre's
  // native pointer-anchored zoom
  document.getElementById('map').addEventListener('wheel', (e) => {
    if (!following) return;
    e.preventDefault();
    e.stopPropagation();
    map.setZoom(map.getZoom() - e.deltaY * 0.005);
  }, { capture: true, passive: false });

  // per-frame exponential ease of the map center toward the marker: smooth
  // when follow mode re-engages far away, and tight tracking during flight.
  // no built-in map animations — they lock the map for their whole duration,
  // which falls apart when the camera covers a large distance every frame.
  // an exponential ease chasing a moving target always lags it by
  // velocity*tau, so aim at the marker's position led by its (smoothed)
  // velocity — steady fast flight then keeps the marker dead-center
  const FOLLOW_TAU_MS = 120;
  let followVel = null, prevMark = null;
  const followMarker = (latlng, dt) => {
    if (prevMark && dt > 0) {
      const dlat = latlng.lat - prevMark.lat;
      const dlng = latlng.lng - prevMark.lng;
      if (Math.abs(dlat) > 0.05 || Math.abs(dlng) > 0.05) {
        followVel = null; // teleport, not motion: don't feed it forward
      } else {
        const a = 1 - Math.exp(-dt / 200);
        followVel = followVel ? {
          lat: followVel.lat + (dlat / dt - followVel.lat) * a,
          lng: followVel.lng + (dlng / dt - followVel.lng) * a,
        } : { lat: dlat / dt, lng: dlng / dt };
      }
    }
    prevMark = latlng;
    const lead = followVel
      ? { lat: followVel.lat * FOLLOW_TAU_MS, lng: followVel.lng * FOLLOW_TAU_MS }
      : { lat: 0, lng: 0 };
    const c = map.getCenter();
    const k = 1 - Math.exp(-dt / FOLLOW_TAU_MS);
    let nlat = c.lat + (latlng.lat + lead.lat - c.lat) * k;
    let nlng = c.lng + (latlng.lng + lead.lng - c.lng) * k;
    // monotonicity: the lead aims ahead of the marker, and when the camera
    // slows it goes stale for a moment — never let the center actually pass
    // the marker, or stopping visibly springs back. if this step would cross
    // it, land exactly on it
    if ((latlng.lat - c.lat) * (latlng.lat - nlat)
      + (latlng.lng - c.lng) * (latlng.lng - nlng) < 0) {
      nlat = latlng.lat;
      nlng = latlng.lng;
    }
    map.jumpTo({ center: [nlng, nlat] });
  };

  // --- point-pair alignment -------------------------------------------------
  // tie points of the reference photo to points on the mesh, then let a
  // solver nudge the camera until each mesh point lands on its photo point.
  // this is for the last mile — fly the view roughly into place by hand, mark
  // three or four landmarks, and solve for the pose that reproduces the shot.
  //
  // perspective only, and never in the tube: the fit assumes the render is a
  // pinhole image of fixed geometry, which a parallel projection isn't and
  // the rolled tube's warp definitely isn't.
  //
  // the camera projection is reimplemented here rather than called through the
  // engine, so a solver iteration costs no wasm round trips — it mirrors
  // earth_camera.h's poseToCamera and rocktree_math.h's lookAt/perspective,
  // and pickNdc on the wasm side is built from the same basis
  const D2R = Math.PI / 180;
  let planetR = 6371010; // refreshed from the engine as soon as it's ready

  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]];
  const vnorm = (a) => {
    const n = Math.hypot(a[0], a[1], a[2]);
    return n > 1e-12 ? vmul(a, 1 / n) : null;
  };
  const geoUpV = (lat, lon) => [Math.cos(lat) * Math.cos(lon),
    Math.cos(lat) * Math.sin(lon), Math.sin(lat)]; // radians
  const geoNorthV = (lat, lon) => [-Math.sin(lat) * Math.cos(lon),
    -Math.sin(lat) * Math.sin(lon), Math.cos(lat)];
  // a pair's mesh anchor as ecef meters. pickNdc reports the hit in spherical
  // terms against the same radius, so this rebuilds the exact point
  const ecefOf = (pr) => vmul(geoUpV(pr.lat * D2R, pr.lon * D2R), planetR + pr.alt);

  // the basis lookAt builds for a pose: eye, boresight, screen-right, view-up
  const poseBasis = (p) => {
    const lat = p.lat * D2R, lon = p.lon * D2R;
    const up = geoUpV(lat, lon);
    const north = geoNorthV(lat, lon);
    const east = vcross(north, up);
    const horiz = vadd(vmul(north, Math.cos(p.heading * D2R)),
      vmul(east, Math.sin(p.heading * D2R)));
    const dir = vnorm(vadd(vmul(horiz, Math.cos(p.tilt * D2R)),
      vmul(up, Math.sin(p.tilt * D2R))));
    if (!dir) return null;
    const right = vnorm(vcross(dir, up)); // straight up/down: right is undefined
    if (!right) return null;
    const vup = vcross(right, dir);
    const eye = vmul(up, planetR + p.alt);
    // the camera's bank turns the screen axes about the boresight — the same
    // rotation the engine applies to gravity when it builds the view matrix,
    // so a pair drawn from this basis stays on its feature in a rolled view
    const r = (p.roll || 0) * D2R;
    if (!r) return { eye, dir, right, vup };
    const c = Math.cos(r), sn = Math.sin(r);
    return { eye, dir,
      right: vsub(vmul(right, c), vmul(vup, sn)),
      vup: vadd(vmul(vup, c), vmul(right, sn)) };
  };
  // ecef -> viewport pixels; null when the point is behind the camera
  const projectWith = (b, fovDeg, P, W, H) => {
    const v = vsub(P, b.eye);
    const z = vdot(v, b.dir);
    if (!(z > 1e-6)) return null;
    const t = Math.tan(fovDeg * D2R / 2);
    const ndcX = vdot(v, b.right) / z / (t * (W / H));
    const ndcY = vdot(v, b.vup) / z / t;
    return { x: (ndcX * 0.5 + 0.5) * W, y: (0.5 - ndcY * 0.5) * H };
  };

  // --- state ---
  let pairs = [];       // { u, v, lat, lon, alt } — photo coords + mesh anchor
  let selPair = -1;
  // which pair the pointer is on, wherever it is: a row of the list and the
  // markers out in the view are two views of the same pair, so hovering
  // either lights up both
  let hovPair = -1;
  let refImageKey = null; // name:size of the stored photo, to spot a re-drop
  const freeFlags = { pos: true, aim: true, fov: true, roll: false, dist: false };
  const listEl = document.getElementById('aplist');
  const statusEl = document.getElementById('apstatus');
  const warnEl = document.getElementById('apwarn');
  const bannerEl = document.getElementById('apbanner');
  const svgEl = document.getElementById('pairs');
  const solveBtn = document.getElementById('apsolve');
  const addBtn = document.getElementById('apadd');

  // selection and hover live in these two numbers; this is the only thing
  // that paints them, on the markers and on the rows alike. rebuilding the
  // list would do it too, but it also resets the live error text and yanks
  // the delete buttons, which is a lot to do for a change of colour
  const applyPairStates = () => {
    markerEls.forEach((m, i) => {
      m.g.classList.toggle('sel', i === selPair);
      m.g.classList.toggle('hov', i === hovPair);
    });
    rowEls.forEach((r, i) => {
      r.row.classList.toggle('sel', i === selPair);
      r.row.classList.toggle('hov', i === hovPair);
    });
  };
  const setSel = (i) => { selPair = i; applyPairStates(); };
  const setHover = (i) => {
    if (hovPair === i) return;
    hovPair = i;
    applyPairStates();
  };

  function saveAlign() {
    if (storageFrozen) return;
    try {
      localStorage.setItem('earth-align', JSON.stringify({
        pairs, ov, free: freeFlags, key: refImageKey,
        opacity: +overlayBlend.value,
      }));
    } catch (e) {}
  }
  function clearPairs() {
    pairs = [];
    selPair = -1;
    stopSolve();
    buildMarkers();
    renderList();
    saveAlign();
  }
  // alignment is off in ortho and in the tube (see the note above), and
  // pointless without a photo. called from updateHint, so every mode switch
  // re-evaluates it
  function alignRefresh() {
    // pairs come with the photo, except where they can't (ortho, or inside
    // the tube) — and then the panel says so rather than silently dropping
    // half of itself
    const on = document.body.classList.contains('overlay') && !ortho && !tubeOn && !tunnelOn;
    document.body.classList.toggle('align', on);
    if (!on) { cancelCapture(); stopSolve(); }
    document.getElementById('apfreepos').checked = freeFlags.pos;
    document.getElementById('apfreeaim').checked = freeFlags.aim;
    document.getElementById('apfreefov').checked = freeFlags.fov;
    document.getElementById('apfreeroll').checked = freeFlags.roll;
    document.getElementById('apfreedist').checked = freeFlags.dist;
    // the lens panel is also up while the solver is asked to fit it: that is
    // when you want to set it by eye and see whether the pairs agree
    document.body.classList.toggle('lenswanted', freeFlags.dist && on);
    buildMarkers();
    renderList();
  }

  // --- markers ---
  // rebuilt when the pair set changes; positions refresh every frame in tick
  let markerEls = [];
  const svgNode = (tag, attrs) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  // one group per pair, in paint order: the fat invisible line that makes the
  // residual clickable, the residual itself, then each end (state ring, ring,
  // centre dot), the number, and last the two grab discs — last so that where
  // an end sits on the line or the number, the end is what you get
  function buildMarkers() {
    svgEl.textContent = '';
    hovPair = -1;
    markerEls = pairs.map((pr, i) => {
      const g = svgNode('g', {});
      // wide enough to hit, narrow enough that it isn't much of a dead band
      // for a camera drag started on the picture (nothing under #pairs sees a
      // pointerdown that lands on a hit shape)
      const hitLine = svgNode('line', { class: 'hit pick', 'stroke-width': 12 });
      const line = svgNode('line', { class: 'res', stroke: '#fff', 'stroke-width': 1.5,
        'stroke-dasharray': '4 3', opacity: .9 });
      // the photo end (magenta) and the mesh end (cyan); the solver's job is
      // to drive one onto the other
      const photoHalo = svgNode('circle', { r: 12, class: 'halo' });
      const photo = svgNode('circle', { r: 6, fill: 'none', stroke: '#ff2fd0',
        'stroke-width': 2.5 });
      const photoDot = svgNode('circle', { r: 1.5, fill: '#ff2fd0' });
      const meshHalo = svgNode('circle', { r: 12, class: 'halo' });
      const mesh = svgNode('circle', { r: 6, fill: 'none', stroke: '#22d3ee',
        'stroke-width': 2.5 });
      const meshDot = svgNode('circle', { r: 1.5, fill: '#22d3ee' });
      const lbl = svgNode('text', { class: 'lbl pick' });
      lbl.textContent = i + 1;
      const photoHit = svgNode('circle', { r: 13, class: 'hit grab' });
      const meshHit = svgNode('circle', { r: 13, class: 'hit grab' });
      for (const el of [hitLine, line, photoHalo, photo, photoDot,
                        meshHalo, mesh, meshDot, lbl, photoHit, meshHit])
        g.appendChild(el);
      svgEl.appendChild(g);
      hookDrag(photoHit, i, 'photo');
      hookDrag(meshHit, i, 'mesh');
      // the line and the number don't drag anything; they just say which pair
      // you mean, the way clicking its row in the list does
      for (const el of [hitLine, lbl]) el.addEventListener('click', () => setSel(selPair === i ? -1 : i));
      for (const el of [hitLine, lbl, photoHit, meshHit]) {
        el.addEventListener('pointerenter', () => setHover(i));
        el.addEventListener('pointerleave', () => setHover(-1));
      }
      return { g, hitLine, line, photoHalo, photo, photoDot,
               meshHalo, mesh, meshDot, lbl, photoHit, meshHit };
    });
    applyPairStates();
  }
  // dragging an end adjusts that pair: the photo end moves within the picture,
  // the mesh end re-picks whatever terrain is now under the pointer
  let dragPair = null;
  function hookDrag(el, i, which) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragPair = { i, which };
      setSel(i);
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragPair || dragPair.i !== i) return;
      const r = rightEl.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const pr = pairs[i];
      if (!pr) return;
      if (which === 'photo') {
        const p = viewToPhoto(x, y);
        const q = p && distortUV(p.u, p.v, ov.k); // back onto the photo as shot
        if (q) { pr.u = q.u; pr.v = q.v; }
      } else {
        const hit = view.pickNdc((x / r.width) * 2 - 1, 1 - (y / r.height) * 2);
        if (hit) { pr.lat = hit.lat; pr.lon = hit.lon; pr.alt = hit.alt; }
      }
    });
    const end = () => { if (dragPair) { dragPair = null; saveAlign(); } };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // per-frame: place both ends, draw the residual between them, and report
  // each pair's error. returns the rms pixel error over the usable pairs
  let lastErrs = [];
  const updateMarkers = () => {
    const W = rightEl.clientWidth, H = rightEl.clientHeight;
    const p = view.getPose();
    const basis = poseBasis(p);
    let sum = 0, n = 0;
    lastErrs = pairs.map((pr, i) => {
      const m = markerEls[i];
      const tgt = photoToViewK(pr.u, pr.v, ov.k);
      const cur = basis ? projectWith(basis, p.fov, ecefOf(pr), W, H) : null;
      if (!m) return null;
      // an end that isn't on screen takes its hit shape down with it, or the
      // pointer would find a target where there is nothing drawn
      const show = (el, on) => el.setAttribute('visibility', on ? 'visible' : 'hidden');
      for (const el of [m.photo, m.photoDot, m.photoHalo, m.photoHit, m.lbl]) show(el, !!tgt);
      for (const el of [m.mesh, m.meshDot, m.meshHalo, m.meshHit]) show(el, !!cur);
      for (const el of [m.line, m.hitLine]) show(el, !!(tgt && cur));
      // the marked-out pair also stands a little taller
      const big = i === selPair || i === hovPair;
      m.photo.setAttribute('r', big ? 8 : 6);
      m.mesh.setAttribute('r', big ? 8 : 6);
      if (tgt) {
        for (const el of [m.photo, m.photoDot, m.photoHalo, m.photoHit]) {
          el.setAttribute('cx', tgt.x);
          el.setAttribute('cy', tgt.y);
        }
        m.lbl.setAttribute('x', tgt.x + 10);
        m.lbl.setAttribute('y', tgt.y - 8);
      }
      if (cur) {
        for (const el of [m.mesh, m.meshDot, m.meshHalo, m.meshHit]) {
          el.setAttribute('cx', cur.x);
          el.setAttribute('cy', cur.y);
        }
      }
      if (tgt && cur) {
        for (const el of [m.line, m.hitLine]) {
          el.setAttribute('x1', tgt.x);
          el.setAttribute('y1', tgt.y);
          el.setAttribute('x2', cur.x);
          el.setAttribute('y2', cur.y);
        }
        const d = Math.hypot(cur.x - tgt.x, cur.y - tgt.y);
        sum += d * d;
        n++;
        return d;
      }
      return null;
    });
    return n ? Math.sqrt(sum / n) : null;
  };

  // --- the pair list ---
  // rows are built only when the pair set changes; their live numbers are
  // patched in place every frame (rebuilding at frame rate would yank the
  // delete buttons out from under a click)
  let rowEls = [];
  function renderList() {
    listEl.textContent = '';
    rowEls = pairs.map((pr, i) => {
      const row = document.createElement('div');
      row.className = 'pair';
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i + 1;
      const uv = document.createElement('span');
      uv.textContent = pr.u.toFixed(2) + ',' + pr.v.toFixed(2);
      const err = document.createElement('span');
      err.className = 'err';
      const del = document.createElement('button');
      del.className = 'x';
      del.textContent = '✕';
      del.title = 'delete this pair';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        pairs.splice(i, 1);
        if (selPair >= pairs.length) selPair = -1;
        hovPair = -1; // the row under the pointer is a different pair now
        buildMarkers();
        renderList();
        saveAlign();
      });
      row.append(n, uv, err, del);
      row.addEventListener('click', () => setSel(selPair === i ? -1 : i));
      // the other half of the mirror: pointing at a row marks its pair out in
      // the view, the same wash the row itself takes
      row.addEventListener('pointerenter', () => setHover(i));
      row.addEventListener('pointerleave', () => setHover(-1));
      listEl.appendChild(row);
      return { row, err };
    });
    applyPairStates();
    updateStatus(null);
  }
  // the live readout: per-pair pixel error and the overall rms
  function updateStatus(rms) {
    rowEls.forEach((r, i) => {
      const e = lastErrs[i];
      r.err.textContent = e == null ? 'off-screen' : Math.round(e) + 'px';
      r.row.classList.toggle('off', e == null);
    });
    const k = dofCount();
    const need = Math.ceil(k / 2);
    const bits = [`${pairs.length} pair${pairs.length === 1 ? '' : 's'} · ${k} unknown${k === 1 ? '' : 's'}`];
    if (rms != null) bits.push(`rms ${rms.toFixed(1)}px`);
    statusEl.textContent = bits.join(' · ');
    // the facts above, the caveat on its own line: a run-on of both was hard
    // to scan
    warnEl.textContent = !k ? 'nothing to solve for — tick something above'
      : (pairs.length && pairs.length < need)
        ? `under-determined: ${need} pairs would pin all ${k} down` : '';
  }
  const dofCount = () => (freeFlags.pos ? 3 : 0) + (freeFlags.aim ? 2 : 0)
    + (freeFlags.fov ? 1 : 0) + (freeFlags.roll ? 1 : 0) + (freeFlags.dist ? 1 : 0);

  // --- capturing a new pair ---
  // two clicks: first the point in the photo, then the same feature on the
  // terrain. the photo is dimmed for the second click so you can see the mesh
  let capture = null;
  let blendBeforeCapture = null;
  const setBanner = (t) => { bannerEl.textContent = t; };
  function startCapture() {
    if (!document.body.classList.contains('align')) return;
    capture = { stage: 'photo' };
    document.body.classList.add('capturing');
    // the photo is the thing being clicked, so show all of it; the slider
    // comes back to where it was when the capture ends
    blendBeforeCapture = +overlayBlend.value;
    overlayBlend.value = 100;
    applyOverlayBlend();
    setBanner('click the point in the photo   (esc to cancel)');
    addBtn.textContent = 'cancel';
    canvas.focus();
  }
  function cancelCapture() {
    if (!capture) return;
    capture = null;
    document.body.classList.remove('capturing');
    if (blendBeforeCapture != null) {
      overlayBlend.value = blendBeforeCapture;
      applyOverlayBlend();
      blendBeforeCapture = null;
    }
    addBtn.textContent = '+ add pair';
  }
  const captureClick = (x, y, ndcX, ndcY) => {
    if (capture.stage === 'photo') {
      // the click is on the photo as displayed (undistorted); the pair is
      // stored on the photo as shot, and 'inside' means inside that
      const shown = viewToPhoto(x, y);
      const p = shown && distortUV(shown.u, shown.v, ov.k);
      if (!p || p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) {
        setBanner('that is outside the photo — click inside it');
        return;
      }
      capture = { stage: 'mesh', u: p.u, v: p.v };
      // now the terrain is the thing being clicked: the photo goes away
      overlayBlend.value = 0;
      applyOverlayBlend();
      setBanner('now click the same feature on the terrain   (esc to cancel)');
      return;
    }
    const hit = view.pickNdc(ndcX, ndcY);
    if (!hit) {
      setBanner('no terrain there — it may still be loading. try again');
      return;
    }
    pairs.push({ u: capture.u, v: capture.v, lat: hit.lat, lon: hit.lon, alt: hit.alt });
    selPair = pairs.length - 1;
    cancelCapture();
    buildMarkers();
    renderList();
    saveAlign();
  };

  // --- the solver -----------------------------------------------------------
  // levenberg–marquardt on the pose: gauss-newton where the local model is
  // trusted, gradient descent where it isn't, with a numeric jacobian (the
  // projection is six cheap parameters, so finite differences cost nothing).
  // it's a local method by design — this is for fine-tuning a view that is
  // already roughly right, not for solving the pose from scratch.
  //
  // the parameters are local deltas rather than the pose itself: metres east /
  // north / up instead of degrees of latitude and longitude, so every column
  // of the jacobian has comparable scale and the normal equations stay
  // conditioned wherever on the globe you are
  const paramSpecs = () => {
    const s = [];
    if (freeFlags.pos) s.push('e', 'n', 'u');
    if (freeFlags.aim) s.push('h', 't');
    if (freeFlags.fov) s.push('f');
    // off by default: a hand-held photo is usually a little banked, but so is
    // a fit that has gone wrong, and a free roll will happily take a bad
    // solution the rest of the way. tick it when the horizon in the picture
    // isn't level
    if (freeFlags.roll) s.push('r');
    // off by default for the same reason, and one more: it is the twin of
    // fov (a barrel lens looks like a wider field at the edges), and pairs
    // near the centre of the picture say nothing about it at all. tick it
    // when the pairs at the edges won't settle while the middle has
    if (freeFlags.dist) s.push('k');
    return s;
  };
  const stepFor = (spec, base) => (spec === 'e' || spec === 'n' || spec === 'u')
    ? Math.max(0.02, Math.abs(base.alt) * 1e-4) // metres
    : spec === 'k' ? 2e-3 // lens, dimensionless
    : 1e-3; // degrees
  const applyDelta = (base, specs, d) => {
    const p = { lat: base.lat, lon: base.lon, alt: base.alt,
      heading: base.heading, tilt: base.tilt, fov: base.fov,
      roll: base.roll || 0, k: base.k || 0 };
    const mPerDeg = (planetR + Math.max(0, base.alt)) * D2R;
    specs.forEach((s, i) => {
      const x = d[i];
      if (s === 'e') p.lon += x / Math.max(1e-6, mPerDeg * Math.cos(base.lat * D2R));
      else if (s === 'n') p.lat += x / mPerDeg;
      else if (s === 'u') p.alt += x;
      else if (s === 'h') p.heading += x;
      else if (s === 't') p.tilt += x;
      else if (s === 'f') p.fov += x;
      else if (s === 'r') p.roll += x;
      else if (s === 'k') p.k += x;
    });
    p.k = clampLens(p.k); // see lensLimits
    // the same limits the engine enforces, so an accepted step survives
    // being handed to setPose/setFov unchanged
    p.lat = Math.max(-89.9, Math.min(89.9, p.lat));
    p.alt = Math.max(1, p.alt);
    p.tilt = Math.max(-89.5, Math.min(89.5, p.tilt));
    p.fov = Math.max(1, Math.min(150, p.fov));
    return p;
  };
  // residual vector: signed pixel offsets, mesh point minus photo point.
  // null if any pair is unusable in this pose (behind the camera) — such a
  // step is simply rejected rather than fitted to a wrapped-around projection
  const residuals = (p, W, H) => {
    const b = poseBasis(p);
    if (!b) return null;
    const out = [];
    for (const pr of pairs) {
      const s = projectWith(b, p.fov, ecefOf(pr), W, H);
      const t = photoToViewK(pr.u, pr.v, p.k == null ? ov.k : p.k);
      if (!s || !t) return null;
      out.push(s.x - t.x, s.y - t.y);
    }
    return out.length ? out : null;
  };
  const costOf = (r) => r ? r.reduce((a, x) => a + x * x, 0) : Infinity;
  // dense gauss-jordan with partial pivoting; k is at most 6
  const solveLinear = (A, b) => {
    const k = b.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let c = 0; c < k; c++) {
      let piv = c;
      for (let r = c + 1; r < k; r++)
        if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
      if (!(Math.abs(M[piv][c]) > 1e-14)) return null; // singular
      [M[c], M[piv]] = [M[piv], M[c]];
      for (let r = 0; r < k; r++) {
        if (r === c) continue;
        const f = M[r][c] / M[c][c];
        for (let j = c; j <= k; j++) M[r][j] -= f * M[c][j];
      }
    }
    const x = [];
    for (let i = 0; i < k; i++) x.push(M[i][k] / M[i][i]);
    return x.every(Number.isFinite) ? x : null;
  };
  let solving = false, lambda = 1e-3, solveIters = 0, stalls = 0;
  // one accepted step (or one give-up) per call; the tick runs it a few times
  // a frame so the camera visibly settles onto the answer. returns true when
  // there's nothing left to do
  const solveStep = () => {
    if (!view.ready() || !pairs.length) return true;
    const specs = paramSpecs();
    const k = specs.length;
    if (!k) return true;
    const W = rightEl.clientWidth, H = rightEl.clientHeight;
    const base = view.getPose();
    base.k = ov.k || 0; // the lens is the photo's, not the camera's
    const r0 = residuals(base, W, H);
    if (!r0) return true; // nothing usable to fit from here
    const cost0 = costOf(r0);
    const n = r0.length;

    const J = [];
    for (let j = 0; j < k; j++) {
      const h = stepFor(specs[j], base);
      const d = new Array(k).fill(0);
      d[j] = h;
      let rp = residuals(applyDelta(base, specs, d), W, H);
      let denom = h;
      if (!rp) { // forward step fell off a clamp: difference backwards instead
        d[j] = -h;
        rp = residuals(applyDelta(base, specs, d), W, H);
        denom = -h;
      }
      const col = new Array(n).fill(0);
      if (rp) for (let i = 0; i < n; i++) col[i] = (rp[i] - r0[i]) / denom;
      J.push(col);
    }
    const A = [], g = [];
    for (let a = 0; a < k; a++) {
      A.push(new Array(k).fill(0));
      let ga = 0;
      for (let i = 0; i < n; i++) ga += J[a][i] * r0[i];
      g.push(-ga);
    }
    for (let a = 0; a < k; a++) for (let b = a; b < k; b++) {
      let s = 0;
      for (let i = 0; i < n; i++) s += J[a][i] * J[b][i];
      A[a][b] = A[b][a] = s;
    }
    // raise the damping until a step actually improves the fit; each failure
    // pulls the step shorter and more gradient-like
    for (let attempt = 0; attempt < 8; attempt++) {
      const Ad = A.map((row, a) => row.map((x, b) =>
        a === b ? x * (1 + lambda) + 1e-9 : x));
      const step = solveLinear(Ad, g);
      if (step) {
        const cand = applyDelta(base, specs, step);
        const cost = costOf(residuals(cand, W, H));
        if (cost < cost0) {
          view.setPose(cand.lat, cand.lon, cand.alt, cand.heading, cand.tilt);
          view.setFov(cand.fov);
          // setPose carries the old roll over, so this only has to run when
          // roll is one of the parameters being fitted
          if (freeFlags.roll) view.setRoll(cand.roll);
          if (freeFlags.dist) setLens(cand.k); // redraws the warp: only on an accepted step
          following = true; // the map should come along
          lambda = Math.max(1e-9, lambda / 3);
          const rel = (cost0 - cost) / Math.max(cost0, 1e-12);
          stalls = rel < 1e-7 ? stalls + 1 : 0;
          return stalls >= 3 || ++solveIters >= 400;
        }
      }
      lambda *= 6;
      if (lambda > 1e12) return true; // no downhill direction left: converged
    }
    return false;
  };
  function stopSolve() {
    solving = false;
    solveBtn.textContent = 'solve';
  }
  const startSolve = () => {
    if (solving) { stopSolve(); return; }
    if (!pairs.length) return;
    // terrain hug and the solver fight over altitude: the hug re-eases the
    // eye toward ground + held height inside every fly() call, including the
    // zero-input one the tick always makes, so it partly undoes each step
    // before the next one measures its residual. drop it rather than restore
    // it afterwards — putting it back would just pull the camera off the fit
    if (hug) {
      hug = false;
      view.setTerrainFollow(false);
      updateHint();
    }
    solving = true;
    lambda = 1e-3;
    solveIters = 0;
    stalls = 0;
    solveBtn.textContent = 'stop';
    canvas.focus();
  };

  // --- wiring ---
  addBtn.addEventListener('click', () => {
    if (capture) cancelCapture(); else startCapture();
  });
  solveBtn.addEventListener('click', startSolve);
  // both of these throw away work placed by hand — the photo's position and
  // size, and pairs put down one click at a time — and the ✕ sits exactly
  // where a "close this panel" button would. so ask first
  const pairsPlural = () => `${pairs.length} point pair${pairs.length === 1 ? '' : 's'}`;
  document.getElementById('apclear').addEventListener('click', () => {
    if (pairs.length && !confirm(`clear ${pairsPlural()}?`)) return;
    clearPairs();
  });
  // the head's ✕ gets rid of the photo, which is the only destructive thing
  // this panel does; 'pairs' folds the pair machinery away without touching it
  document.getElementById('apforget').addEventListener('click', () => {
    const what = pairs.length ? `the photo and its ${pairsPlural()}` : 'the photo and its placement';
    if (!confirm(`remove ${what}?\n\n(to just hide the photo, press P or click "opacity")`)) return;
    clearOverlay();
  });
  for (const [id, key] of [['apfreepos', 'pos'], ['apfreeaim', 'aim'],
                          ['apfreefov', 'fov'], ['apfreeroll', 'roll'],
                          ['apfreedist', 'dist']]) {
    document.getElementById(id).addEventListener('change', (e) => {
      freeFlags[key] = e.target.checked;
      renderList();
      saveAlign();
    });
  }
  // no size slider: shift-wheel sizes the photo about the pointer, which is
  // the only way anyone actually places one. 'reset' is the thing a wheel
  // can't do — put the whole picture back in the frame
  document.getElementById('apfit').addEventListener('click', () => {
    fitOverlay();
    saveAlign();
    canvas.focus();
  });
  overlayBlend.addEventListener('change', saveAlign);
  // esc cancels a capture in progress wherever the focus happens to be (the
  // canvas keydown handler's esc clears the tube, and the two never coexist)
  addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && capture) cancelCapture();
  });

  // --- restore --------------------------------------------------------------
  // pairs, photo placement and solver settings ride in localstorage next to
  // the view; the photo's bytes are too big for that and live in indexeddb
  (async () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('earth-align')); } catch (e) {}
    if (saved) {
      if (saved.ov) ov = { ...ov, ...saved.ov };
      if (!Number.isFinite(ov.k)) ov.k = 0;
      if (saved.free) Object.assign(freeFlags, saved.free);
      if (Number.isFinite(saved.opacity)) {
        overlayBlend.value = saved.opacity;
        applyOverlayBlend();
      }
      refImageKey = saved.key || null;
      if (Array.isArray(saved.pairs))
        pairs = saved.pairs.filter((p) => p && Number.isFinite(p.u) && Number.isFinite(p.v)
          && Number.isFinite(p.lat) && Number.isFinite(p.lon) && Number.isFinite(p.alt));
    }
    const blob = await idbGet('ref-image', 'app');
    if (blob) setOverlay(blob, true); // keepPlacement: the saved ov is the truth
    else { pairs = []; refImageKey = null; } // orphaned without their photo
    alignRefresh();
  })();

  // --- move a session between origins ---------------------------------------
  // the deployed page and localhost are two origins, and nothing is shared
  // across them: separate localstorages, separate indexeddbs. so the
  // clipboard carries it. cmd-C anywhere on the page bundles the whole
  // session — view, path settings and the two dropped files — into one json
  // blob; cmd-V on the other build unpacks it and reloads into exactly that
  // session. cmd-S writes the same blob to a .json, and dropping that file on
  // the page reads it back. the tile cache is deliberately left out: it is megabytes of
  // bytes that re-download themselves, and the only cost of leaving it
  // behind is that the first minute over the same ground is slower
  const STATE_TAG = 'soil-session-v1';
  const STATE_KEYS = ['earth-view', 'earth-path', 'earth-align'];
  const STATE_FILES = ['gpx-file', 'ref-image'];
  let toastTimer = 0;
  const toast = (msg, ms = 2600) => {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), ms);
  };
  // files go over as data urls: json is the only thing the clipboard carries
  // between two pages, and this is the one encoding of a blob that comes back
  // through fetch() without a byte of parsing here
  const fileToJson = (f) => new Promise((res) => {
    const r = new FileReader();
    r.onload = () => res({ name: f.name || '', type: f.type || '', data: r.result });
    r.onerror = () => res(null);
    r.readAsDataURL(f);
  });
  const jsonToFile = async (j, fallbackName) => {
    const blob = await (await fetch(j.data)).blob();
    return new File([blob], j.name || fallbackName, { type: j.type || blob.type });
  };
  const collectState = async () => {
    // the three savers write on their own schedule (beforeunload, on change),
    // so run them first or the copy carries the state as of some earlier moment
    saveView();
    savePath();
    saveAlign();
    // localstorage holds strings, but the file is for reading and diffing
    // too, so each entry goes in as the object it is — not a json string
    // escaped inside the json. (a value that isn't json stays a string)
    const ls = {};
    for (const k of STATE_KEYS) {
      const v = localStorage.getItem(k);
      if (v == null) continue;
      try { ls[k] = JSON.parse(v); } catch (e) { ls[k] = v; }
    }
    const files = {};
    for (const k of STATE_FILES) {
      const f = await idbGet(k, 'app');
      if (!f) continue;
      const j = await fileToJson(f);
      if (j) files[k] = j;
      else console.warn(`session: could not read '${k}' out of idb — copying without it`);
    }
