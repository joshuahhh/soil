  };
  const copyState = async () => {
    const text = await collectState();
    const mb = (text.length / 1e6).toFixed(1);
    try {
      await navigator.clipboard.writeText(text);
      toast(`session copied (${mb} MB) — ⌘V it into the other build`);
    } catch (e) {
      // writeText wants a focused document and the clipboard permission; when
      // it says no there is still a perfectly good string to hand over
      console.warn('session: clipboard write failed', e);
      console.log(text);
      toast('could not reach the clipboard — the session json is in the console');
    }
    return text;
  };
  // ⌘S writes the same bundle to a file — for keeping a session around, or
  // moving it somewhere a clipboard doesn't reach. dropping it back on the
  // page is the other half
  const fileStamp = () => new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  const saveFile = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const saveState = async () => {
    const text = await collectState();
    saveFile(new Blob([text], { type: 'application/json' }), `soil-session-${fileStamp()}.json`);
    toast(`session saved (${(text.length / 1e6).toFixed(1)} MB) — drop the file on the page to restore it`);
  };
  addEventListener('keydown', (e) => {
    if (e.code !== 'KeyS' || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey) return;
    e.preventDefault(); // or the browser offers to save the html
    saveState();
  });
  // applying is destructive on purpose: a key the incoming session doesn't
  // have is a key it doesn't want, so it goes. half-pasting one session over
  // another leaves a mix that belongs to neither
  const applyState = async (s) => {
    storageFrozen = true; // before the first write: nothing may save over it now
    for (const k of STATE_KEYS) {
      // objects from the current format, strings from files written before
      // it stored them parsed
      if (s.ls && s.ls[k] != null)
        localStorage.setItem(k, typeof s.ls[k] === 'string' ? s.ls[k] : JSON.stringify(s.ls[k]));
      else localStorage.removeItem(k);
    }
    const failed = [];
    for (const k of STATE_FILES) {
      const j = s.files && s.files[k];
      if (!j) { idbDel(k, 'app'); continue; }
      try {
        if (!await idbPutChecked(k, await jsonToFile(j, k))) failed.push(k);
      } catch (e) {
        console.warn(`session: could not rebuild '${k}'`, e);
        failed.push(k);
      }
    }
    return failed;
  };
  const pasteState = async (text) => {
    let s = null;
    try { s = JSON.parse(text); } catch (e) {}
    if (!s || s.tag !== STATE_TAG) return false;
    const failed = await applyState(s);
    if (failed.length) {
      // the localstorage half landed and the files didn't, so reloading now
      // would show a session missing its photo or track and say nothing. the
      // savers stay off for the rest of this page's life either way: what is
      // in storage is the pasted session, and flying around now shouldn't
      // quietly edit it
      toast(`pasted, but ${failed.join(' and ')} did not fit in storage — see the console`);

    }
    toast('session pasted — reloading');
    setTimeout(() => location.reload(), 250);
    return true;
  };
  addEventListener('copy', (e) => {
    // a real selection, or a cursor in a field, means the copy is about text
    // on the page and not about the session
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const sel = getSelection();
    if (sel && !sel.isCollapsed && String(sel).trim()) return;

  });
  addEventListener('paste', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

    // page might want it

    e.preventDefault();
    pasteState(text);
  });

  // ?lod=2 draws half as fine, which is a quarter of the tiles — the volume
  // of data a view asks for is what decides whether a deep zoom ever finishes,
  // and this is the only lever on it. live from the console too, via __demo
  if (QS.has('lod')) {
    const v = parseFloat(QS.get('lod'));
    if (Number.isFinite(v) && v > 0) view.setLodScale(v);
  }

  // for devtools poking and automated testing
  window.__demo = { view, map, marker, isFollowing: () => following,
    lod: (v) => { if (v != null) view.setLodScale(v); return view.getLodScale(); },
    tube: () => ({ rect: tubeRect, on: tubeOn, body: tubeBody, curl }),
    body: (text) => text ? setBodyMesh(text) : view.bodyReady(),
    tunnel: (c) => { if (c != null) { tunnelC = c; view.setTunnelCircumference(c); refreshTunnel(); } return view.getTunnelInfo(); },
    path: () => path, loadGpx: (text) => setPath(parseGpx(text), true),
    clearTiles,
    align: () => ({ pairs, solving, dof: dofCount(), errs: lastErrs }),
    solve: startSolve,
    copyState, pasteState, saveState };

  // roll is the one part of the pose with no other sign in the hud, and it can
  // arrive from the solver or from banking the tube, so the panel is driven by
  // what the camera actually reports rather than by whoever set it. inside the
  // tube a bank is the normal way to fly and needs no announcing
  const rollAmountEl = document.getElementById('rollamount');
  let shownRoll = null;
  const refreshRoll = () => {
    const roll = view.ready() ? (view.getPose().roll || 0) : 0;
    const on = !tubeOn && !tunnelOn && Math.abs(roll) > 0.05;
    const shown = on ? Math.round(roll * 10) / 10 : null;
    if (shown === shownRoll) return;
    shownRoll = shown;
    document.body.classList.toggle('rolled', on);
    if (on) rollAmountEl.textContent = `${shown > 0 ? '+' : ''}${shown.toFixed(1)}° from level`;
  };
  document.getElementById('rolllevel').addEventListener('click', () => {
    view.setRoll(0);
    refreshRoll();
    saveView();
    canvas.focus();
  });

  let lastSynced = { lat: 1e9, lon: 1e9 };
  let saveTimer = 0;
  let last = performance.now();
  let frameCount = 0;
  let pendingShot = null; // runs at the end of the next frame, once (shots)
  const tick = (now) => {
    const dt = TEST ? TEST.dt : Math.min(100, now - last);
    last = now;
    refreshKeys(now);
    if (hug && now - speedAt > 100) { speedAt = now; updateSpeed(); }

    if (view.ready() && !posed) {
      // once the planet metadata is in, jump to the start (or saved) pose
      posed = true;
      // the datum setPose's altitude and every pick are measured from; the
      // alignment math rebuilds ecef points against it
      planetR = view.planetRadius();
      view.setPose(START.lat, START.lon, START.alt, START.heading, START.tilt);
      view.setFov(START.fov);
      if (Number.isFinite(START.nearCut) && START.nearCut > 0) {
        view.setNearCut(START.nearCut);
        showCut();
      }
      gain = START.gain;
      ortho = !!START.ortho;
      view.setOrtho(ortho);
      hug = !!START.hug;
      view.setTerrainFollow(hug);
      if (START.miniature) setMiniature(true);
      // a banked camera comes back banked. inside the tube the bank belongs to
      // the airplane frame and is restored after the roll-up below instead,
      // because that is what creates the frame to bank
      if (START.roll && !(START.tube && START.tube.on)) view.setRoll(START.roll);
      // restore a saved tube rect; if it was rolled, it rolls up again from
      // flat (the camera pose is already wherever it was saved)
      if (START.tube && START.tube.rect) {
        tubeRect = START.tube.rect;
        tubeAxisEw = START.tube.ewAxis !== false;
        tubeBody = !!START.tube.body;
        updateAxisBtn();
        setRectData(tubeRect);
        if (START.tube.on) {
          applyTube(tubeRect, false); // reload + roll in place at the saved pose
          if (START.roll) view.setRoll(START.roll); // restore the bank angle
        } else {
          view.setTubeRect(tubeRect[0], tubeRect[1], tubeRect[2], tubeRect[3], tubeAxisEw);

      }
      if (START.tunnel && Number.isFinite(START.tunnel.c)) tunnelC = START.tunnel.c;

      if (START.tunnel && Number.isFinite(START.tunnel.lag)) tunnelLag = Math.max(0, START.tunnel.lag);

      if (START.tunnel && START.tunnel.on && !(START.tube && START.tube.on)) setTunnel(true, false);

    }

    const slow = !!(keys.ShiftLeft || keys.ShiftRight);
    // arrows pan/tilt at fixed angular rates (rad/s), shift-slowed. in
    // ortho mode all four arrows instead orbit around whatever is at the
    // center of the screen (raycast into the scene on the wasm side):
    // left/right around its up axis, up/down in tilt

    // on the rails the arrows swing the camera around the track instead of

    const orbitH = ortho ? ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) : 0;

    if (!ortho && !railed && keys.ArrowLeft) yaw -= 1.2 * rot;
    if (!ortho && !railed && keys.ArrowUp) pitch += 0.9 * rot;
    if (!ortho && !railed && keys.ArrowDown) pitch -= 0.9 * rot;

    // since a parallel projection has no meaningful elevation to pedestal
    // along — so the up/down keys would otherwise sit dead there
    if (!!keys.KeyZ !== !!keys.KeyX) {

    if (ortho && !railed && !!keys.KeyR !== !!keys.KeyF) {

    }

    const flying = dragging || yaw !== 0 || pitch !== 0 || orbitH !== 0 || orbitV !== 0

      // coordinates — the spot on the rect whose imagery is wrapped around
      // the camera — rather than the now-meaningless ecef point under it
      const tp = (tubeOn || tunnelOn) ? view.getTubePose() : null;
      const m = tp || p;
      setMarkerHeading(m.heading);
      if (Math.abs(m.lat - lastSynced.lat) > 1e-7 || Math.abs(m.lon - lastSynced.lon) > 1e-7) {

      // camera visibly settles onto the fit instead of snapping to it), then

  requestAnimationFrame(tick);

  // --- screenshot ------------------------------------------------------------
  // the 3d view as it is on screen, at the canvas's own pixel size: the render,
  // then whatever is drawn over it and showing — the photo (plain, or through
  // the lens), the pair markers, the reticle — at its place and opacity.
  // panels and readouts are left out. the gl canvas is copied inside the frame

  const shotLayers = () => [overlayImg, warpEl, svgEl, document.getElementById('cross')];

  // which an <img> of it can't see, so the copy carries each element's
  // computed style inline
  const SVG_PROPS = ['display', 'visibility', 'opacity', 'fill', 'stroke', 'stroke-width',
    'stroke-dasharray', 'stroke-linecap', 'font-size', 'font-weight', 'font-family'];

    const copy = el.cloneNode(true);
    const src = el.querySelectorAll('*'), dst = copy.querySelectorAll('*');
    for (let i = 0; i < src.length; i++) {
      const cs = getComputedStyle(src[i]);
      for (const p of SVG_PROPS) dst[i].style.setProperty(p, cs.getPropertyValue(p));
    }
    copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    copy.setAttribute('width', w);
    copy.setAttribute('height', h);

    img.onload = () => resolve(img);
    img.onerror = reject;

  });

    pendingShot = async () => {
      const out = document.createElement('canvas');
      out.width = canvas.width;
      out.height = canvas.height;

      // jpeg has no alpha: what's clear on the canvas shows the page behind
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(canvas, 0, 0);

        saveFile(blob, `soil-shot-${fileStamp()}.jpg`);

  };
  document.getElementById('shotbtn').addEventListener('click', () => {
    takeShot();
    canvas.focus();
  });

  // --- photo ⇄ render gif ---------------------------------------------------
  // a loop that holds on the photo, fades to the render it was aligned
  // against, holds, and fades back. cropped to the photo's box (as much of it
  // as is on screen), so it is the picture and the landscape behind it and
  // nothing else: no pair markers, no reticle, and the photo at full opacity
  // whatever the slider says. the encoder is fetched the first time it's used
  const GIF_MAX = 800;   // the longer side, px
  const GIF_STEPS = 12;  // frames per fade
  const GIF_HOLD = 1200, GIF_STEP_MS = 60;
  let gifenc = null;
  const takeGif = () => {
    const b = overlayBox();
    if (!b) return;
    const btn = document.getElementById('apgif');
    btn.disabled = true;
    pendingShot = async () => {
      try {
        const W = rightEl.clientWidth, H = rightEl.clientHeight;
        const s = canvas.width / canvas.clientWidth; // css px -> canvas px
        const x0 = Math.max(0, b.x), y0 = Math.max(0, b.y);
        const x1 = Math.min(W, b.x + b.w), y1 = Math.min(H, b.y + b.h);
        if (x1 - x0 < 1 || y1 - y0 < 1) { toast('the photo is out of view'); return; }
        const f = Math.min(s, GIF_MAX / Math.max(x1 - x0, y1 - y0)); // css px -> gif px
        const w = Math.round((x1 - x0) * f), h = Math.round((y1 - y0) * f);

          const c = document.createElement('canvas');

          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.imageSmoothingQuality = 'high';

        };

        const render = layer();
        render.fillStyle = '#fff';
        render.fillRect(0, 0, w, h);
        render.drawImage(canvas, x0 * s, y0 * s, (x1 - x0) * s, (y1 - y0) * s, 0, 0, w, h);
        // the photo as displayed — through the lens if it has one — over the
        // render, which fills in wherever the warp leaves the box uncovered
        const photo = layer();
        photo.drawImage(render.canvas, 0, 0);
        const el = document.body.classList.contains('distorted') ? warpEl : overlayImg;
        const r = el.getBoundingClientRect(), base = rightEl.getBoundingClientRect();
        photo.drawImage(el, (r.left - base.left - x0) * f, (r.top - base.top - y0) * f,
                        r.width * f, r.height * f);
        toast('making gif…');
        gifenc ??= await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js');
        const { GIFEncoder, quantize, applyPalette } = gifenc;
        // one quantized frame per step of the fade, eased; the way back
        // reuses them in reverse
        const mix = layer();
        const frames = [];
        for (let i = 0; i <= GIF_STEPS; i++) {
          const t = i / GIF_STEPS, e = t * t * (3 - 2 * t);
          mix.globalAlpha = 1;
          mix.drawImage(render.canvas, 0, 0);
          mix.globalAlpha = 1 - e;
          mix.drawImage(photo.canvas, 0, 0);
          const px = mix.getImageData(0, 0, w, h).data;
          const palette = quantize(px, 256);
          frames.push({ index: applyPalette(px, palette), palette });
          await new Promise((res) => setTimeout(res)); // let the page breathe
        }
        const gif = GIFEncoder();
        const order = [...frames.keys(), ...[...frames.keys()].slice(1, -1).reverse()];
        for (const i of order) {
          const { index, palette } = frames[i];
          const delay = i === 0 || i === GIF_STEPS ? GIF_HOLD : GIF_STEP_MS;
          gif.writeFrame(index, w, h, { palette, delay });
        }
        gif.finish();
        const blob = new Blob([gif.bytes()], { type: 'image/gif' });
        saveFile(blob, `soil-photo-${fileStamp()}.gif`);
        toast(`gif saved (${w}×${h}, ${(blob.size / 1e6).toFixed(1)} MB)`);
      } catch (e) {
        console.error('gif failed', e);
        toast('gif failed: ' + (e.message || e));
      } finally {
        btn.disabled = false;
      }
    };
  };
  document.getElementById('apgif').addEventListener('click', () => {
    takeGif();
    canvas.focus();
  });

  // --- headless capture api -------------------------------------------------
  // the driver (tools/capture.mjs) talks to the page through this. kept out of
  // the TEST guard so it's also usable by hand from the devtools console
  window.__test = {
    stats: () => view.ready() ? view.getStats() : null,
    drawnNodes: () => view.ready() ? view.getDrawnNodes() : [],
    frameCount: () => frameCount,
    // shimmer measurement (tools/shimmer.mjs) drives these: toggle the texture
    // filtering, then move the camera a fixed sub-degree amount and see how
    // much the image churns
    setMipmaps: (on) => { mipmaps = on; view.setMipmaps(on); updateHint(); },
    nudgeHeading: (deg) => {
      const p = view.getPose();
      view.setPose(p.lat, p.lon, p.alt, p.heading + deg, p.tilt);
    },
    // resolves with a png data url, captured at the end of the next frame
    shot: () => new Promise((resolve) => {
      pendingShot = () => resolve(canvas.toDataURL('image/png'));
    }),
    // for tools/shimmer.mjs: flip texture filtering, and move the camera by a
    // fixed amount so the churn a small motion causes can be scored
    setMipmaps: (on) => { mipmaps = on; view.setMipmaps(on); updateHint(); },
    nudgeHeading: (deg) => {
      const p = view.getPose();
      view.setPose(p.lat, p.lon, p.alt, p.heading + deg, p.tilt);
    },
    // settle until the scene reports itself fully loaded for `stable`
    // consecutive frames, or `timeoutMs` elapses. sceneComplete alone is not
    // enough to wait on: a download that keeps failing resets its node to a
    // stub rather than to a failed state (see rocktree_types.h
    // setFailedDownloading), so it is retried forever and the flag can stay
    // false indefinitely. the timeout is therefore load-bearing, and the
    // caller is told which way it ended rather than it being papered over
    settle: async ({ timeoutMs = 120000, stable = 5 } = {}) => {
      const t0 = performance.now();
      let run = 0;
      for (;;) {
        await new Promise((r) => requestAnimationFrame(r));
        const st = view.ready() ? view.getStats() : null;
        run = st && st.sceneComplete ? run + 1 : 0;
        if (run >= stable) return { complete: true, ms: performance.now() - t0, stats: st };
        if (performance.now() - t0 > timeoutMs)
          return { complete: false, ms: performance.now() - t0, stats: st };
      }
    },
  };
})();
</script>
